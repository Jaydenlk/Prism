use_default_settings: true

server:
  secret_key: ${SEARXNG_SECRET_KEY:-changeme-replace-in-production}
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  # 国内可用搜索引擎
  - name: bing
    engine: bing
    disabled: false
    weight: 1.5
  - name: baidu
    engine: baidu
    disabled: false
    weight: 1.0
  # 国内不可用，禁用
  - name: google
    engine: google
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    disabled: true
