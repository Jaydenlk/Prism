use_default_settings: true

server:
  secret_key: ${SEARXNG_SECRET_KEY:-changeme-replace-in-production}
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json

engines:
  # Bing 为主力（国内可用，质量好）
  - name: bing
    engine: bing
    disabled: false
    weight: 2.0
  # 百度降权兜底（广告多，仅在 Bing 无结果时补充）
  - name: baidu
    engine: baidu
    disabled: false
    weight: 0.5
  # 国内不可用
  - name: google
    engine: google
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    disabled: true
