version: "3.9"

networks:
  prism-net:
    driver: bridge

volumes:
  pgdata_dev:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism_dev_pass
      POSTGRES_DB: prism_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - prism-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    networks:
      - prism-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - ./executor:/app/executor
      - ./executor_v2:/app/executor_v2
    working_dir: /app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prism-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
