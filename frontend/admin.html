<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prism · Control Room</title>
<link rel="stylesheet" href="styles.css"/>
<style>
/* Admin-specific overrides — desk-tool feel, same palette */
:root {
  --admin-bg: #EDE6D6;
  --admin-rail: #1C1B18;
  --admin-rail-ink: #C8C3B8;
  --admin-rail-ink-dim: #6B675E;
  --admin-rail-active: #F5F1EA;
}
html, body { background: var(--admin-bg); }
.admin-app {
  display: grid;
  grid-template-columns: 64px 1fr;
  height: 100vh; width: 100vw; overflow: hidden;
}
.rail {
  background: var(--admin-rail);
  color: var(--admin-rail-ink);
  display: flex; flex-direction: column;
  padding: 18px 0;
  border-right: 1px solid #000;
}
.rail .brand {
  padding: 0 0 16px; display: flex; justify-content: center;
  border-bottom: 1px solid #2C2B28; margin-bottom: 14px; color: var(--admin-rail-active);
}
.rail-item {
  width: 40px; height: 40px; margin: 3px auto; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--admin-rail-ink-dim); cursor: pointer;
  transition: all 0.15s; position: relative;
}
.rail-item:hover { color: var(--admin-rail-active); background: #2C2B28; }
.rail-item.active { color: var(--admin-rail-active); background: #2C2B28; }
.rail-item.active::before {
  content: ""; position: absolute; left: -12px; width: 3px; height: 22px;
  background: var(--amber); border-radius: 0 3px 3px 0;
}
.rail-item .lbl {
  position: absolute; left: 54px; background: var(--admin-rail); color: var(--admin-rail-active);
  padding: 5px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
  font-family: var(--serif); font-style: italic; z-index: 50;
  box-shadow: var(--shadow-3);
}
.rail-item:hover .lbl { opacity: 1; }

.admin-main { display: flex; flex-direction: column; overflow: hidden; background: var(--admin-bg); }
.admin-top {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--line-strong);
  background: var(--admin-bg);
  flex-shrink: 0;
}
.admin-top h1 {
  font-family: var(--serif); font-size: 22px; margin: 0;
  font-weight: 500; letter-spacing: -0.01em; color: var(--ink);
}
.admin-top .sub { font-family: var(--serif); font-style: italic; color: var(--ink-3); font-size: 13px; }
.admin-top .spacer { flex: 1; }
.admin-top .search {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
  font-size: 12.5px; color: var(--ink-3); min-width: 240px;
}
.admin-top .kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-4); margin-left: auto;
  padding: 1px 6px; background: var(--bg); border-radius: 4px; }
.admin-top .env-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 10px;
  font-size: 11.5px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 999px;
}
.admin-top .env-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }

.admin-tabs {
  display: flex; gap: 2px; padding: 0 28px;
  border-bottom: 1px solid var(--line);
  background: var(--admin-bg); flex-shrink: 0;
  overflow-x: auto;
}
.admin-tabs .tab {
  padding: 10px 14px; font-size: 12.5px; color: var(--ink-3);
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.admin-tabs .tab:hover { color: var(--ink); }
.admin-tabs .tab.active { color: var(--ink); border-bottom-color: var(--amber); font-weight: 500; }

.admin-body { flex: 1; overflow-y: auto; padding: 22px 28px 48px; }

/* Override main page title */
.admin-body .page-head { margin-bottom: 22px; }
.admin-body .page-title { font-size: 24px; }

/* Mini stat strip — denser than user-side */
.strip {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
}
.strip .cell {
  background: var(--paper);
  padding: 14px 16px;
}
.strip .cell .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); font-weight: 500; margin-bottom: 5px; }
.strip .cell .val { font-family: var(--serif); font-size: 22px; color: var(--ink); letter-spacing: -0.01em; }
.strip .cell .delta { font-size: 10.5px; font-family: var(--mono); color: var(--ink-4); margin-top: 3px; }
.strip .cell .delta.up { color: var(--teal); }
.strip .cell .delta.dn { color: var(--rust); }

.two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.panel {
  background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.panel-head h3 {
  font-family: var(--serif); font-size: 15px; font-weight: 500; margin: 0;
  font-style: italic; color: var(--ink);
}
.panel-head .eyebrow { margin: 0; font-size: 10px; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 16px 18px; }
.panel-body.tight { padding: 0; }

/* Table denser */
.admin-body .table { font-size: 12px; }
.admin-body .table th { padding: 8px 14px; }
.admin-body .table td { padding: 9px 14px; }

/* Status badge */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.ok { color: var(--teal); }
.st.warn { color: var(--amber); }
.st.err { color: var(--rust); }
.st.idle { color: var(--ink-4); }

/* Provider health "water grid" */
.health-grid {
  display: grid; grid-template-columns: 160px repeat(60, 1fr); gap: 2px;
  font-size: 11px; padding: 4px 0;
  align-items: center;
}
.health-grid .label {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); color: var(--ink-2);
  padding-right: 10px;
}
.health-grid .cell {
  height: 18px; border-radius: 2px; cursor: pointer;
}
.health-ok { background: #C8D9CE; }
.health-mid { background: #E2D6B3; }
.health-bad { background: #D9B4A2; }
.health-out { background: #E8E1CF; }

/* Audit timeline */
.audit-stream { padding: 0 4px; }
.audit-day { margin-bottom: 22px; }
.audit-day-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.audit-day-head .d {
  font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--ink);
  font-variant-numeric: oldstyle-nums;
}
.audit-day-head .w { font-family: var(--serif); font-style: italic; color: var(--ink-3); font-size: 13px; }
.audit-day-head .c { margin-left: auto; font-size: 11px; color: var(--ink-4); font-family: var(--mono); }

.audit-row {
  display: grid; grid-template-columns: 70px 28px 1fr 140px 120px 100px;
  gap: 14px; align-items: center;
  padding: 8px 12px; border-radius: 10px;
  font-size: 12.5px; cursor: pointer;
}
.audit-row:hover { background: var(--paper); }
.audit-row .t { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
.audit-row .glyph {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper); border: 1px solid var(--line);
  color: var(--ink-3);
}
.audit-row.deny .glyph { color: var(--rust); border-color: var(--rust); background: #F3E1DA; }
.audit-row.permission .glyph { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.audit-row.config .glyph { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }
.audit-row .txt { color: var(--ink); line-height: 1.5; }
.audit-row .txt em { font-family: var(--serif); font-style: italic; color: var(--ink-3); }
.audit-row .who { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.audit-row .tenant { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.audit-row .act { text-align: right; }

/* Progress pill */
.p-pill { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; width: 100%; }
.p-pill .fill { height: 100%; background: var(--ink); border-radius: 4px; }
.p-pill .fill.warn { background: var(--amber); }
.p-pill .fill.err { background: var(--rust); }

.kv-grid {
  display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px;
  font-size: 12.5px;
}
.kv-grid .k { color: var(--ink-3); }
.kv-grid .v { color: var(--ink); font-family: var(--mono); font-size: 12px; }

/* Spark bars */
.spark {
  display: inline-flex; align-items: flex-end; gap: 1.5px; height: 22px;
}
.spark span { width: 3px; background: var(--ink-3); border-radius: 1px; }

/* Alert card */
.alert-card {
  display: flex; gap: 12px; padding: 12px 14px;
  border-radius: 12px; background: var(--paper);
  border: 1px solid var(--line);
  margin-bottom: 8px;
}
.alert-card .sev {
  width: 4px; flex-shrink: 0; border-radius: 4px; background: var(--amber);
  align-self: stretch;
}
.alert-card.critical .sev { background: var(--rust); }
.alert-card.info .sev { background: var(--ink-4); }
.alert-card .title { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--ink); }
.alert-card .meta { font-size: 11px; color: var(--ink-4); font-family: var(--mono); margin-top: 2px; }
.alert-card .msg { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; }
.alert-card .t-time { margin-left: auto; font-size: 11px; color: var(--ink-4); font-family: var(--mono); white-space: nowrap; }

/* Tenant row */
.tenant-row {
  display: grid; grid-template-columns: 1fr 100px 120px 160px 90px 70px;
  gap: 14px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  font-size: 12.5px; cursor: pointer;
}
.tenant-row:hover { background: var(--bg); }
.tenant-row:last-child { border-bottom: 0; }
.tenant-row .name { color: var(--ink); font-weight: 500; display: flex; align-items: center; gap: 10px; }
.tenant-row .avatar-sq {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 13px;
}
.tenant-row .mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
</style>
</head>

});
