<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prism · Control Room</title>
<link rel="stylesheet" href="styles.css"/>
<style>
/* Admin-specific overrides — desk-tool feel, same palette */
:root {
  --admin-bg: #EDE6D6;
  --admin-rail: #1C1B18;
  --admin-rail-ink: #C8C3B8;
  --admin-rail-ink-dim: #6B675E;
  --admin-rail-active: #F5F1EA;
}
html, body { background: var(--admin-bg); }
.admin-app {
  display: grid;
  grid-template-columns: 64px 1fr;
  height: 100vh; width: 100vw; overflow: hidden;
}
.rail {
  background: var(--admin-rail);
  color: var(--admin-rail-ink);
  display: flex; flex-direction: column;
  padding: 18px 0;
  border-right: 1px solid #000;
}
.rail .brand {
  padding: 0 0 16px; display: flex; justify-content: center;
  border-bottom: 1px solid #2C2B28; margin-bottom: 14px; color: var(--admin-rail-active);
}
.rail-item {
  width: 40px; height: 40px; margin: 3px auto; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--admin-rail-ink-dim); cursor: pointer;
  transition: all 0.15s; position: relative;
}
.rail-item:hover { color: var(--admin-rail-active); background: #2C2B28; }
.rail-item.active { color: var(--admin-rail-active); background: #2C2B28; }
.rail-item.active::before {
  content: ""; position: absolute; left: -12px; width: 3px; height: 22px;
  background: var(--amber); border-radius: 0 3px 3px 0;
}
.rail-item .lbl {
  position: absolute; left: 54px; background: var(--admin-rail); color: var(--admin-rail-active);
  padding: 5px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
  font-family: var(--serif); font-style: italic; z-index: 50;
  box-shadow: var(--shadow-3);
}
.rail-item:hover .lbl { opacity: 1; }

.admin-main { display: flex; flex-direction: column; overflow: hidden; background: var(--admin-bg); }
.admin-top {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--line-strong);
  background: var(--admin-bg);
  flex-shrink: 0;
}
.admin-top h1 {
  font-family: var(--serif); font-size: 22px; margin: 0;
  font-weight: 500; letter-spacing: -0.01em; color: var(--ink);
}
.admin-top .sub { font-family: var(--serif); font-style: italic; color: var(--ink-3); font-size: 13px; }
.admin-top .spacer { flex: 1; }
.admin-top .search {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
  font-size: 12.5px; color: var(--ink-3); min-width: 240px;
}
.admin-top .kbd { font-family: var(--mono); font-size: 10px; color: var(--ink-4); margin-left: auto;
  padding: 1px 6px; background: var(--bg); border-radius: 4px; }
.admin-top .env-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 10px;
  font-size: 11.5px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 999px;
}
.admin-top .env-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }

.admin-tabs {
  display: flex; gap: 2px; padding: 0 28px;
  border-bottom: 1px solid var(--line);
  background: var(--admin-bg); flex-shrink: 0;
  overflow-x: auto;
}
.admin-tabs .tab {
  padding: 10px 14px; font-size: 12.5px; color: var(--ink-3);
  border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.admin-tabs .tab:hover { color: var(--ink); }
.admin-tabs .tab.active { color: var(--ink); border-bottom-color: var(--amber); font-weight: 500; }

.admin-body { flex: 1; overflow-y: auto; padding: 22px 28px 48px; }

/* Override main page title */
.admin-body .page-head { margin-bottom: 22px; }
.admin-body .page-title { font-size: 24px; }

/* Mini stat strip — denser than user-side */
.strip {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
}
.strip .cell {
  background: var(--paper);
  padding: 14px 16px;
}
.strip .cell .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-3); font-weight: 500; margin-bottom: 5px; }
.strip .cell .val { font-family: var(--serif); font-size: 22px; color: var(--ink); letter-spacing: -0.01em; }
.strip .cell .delta { font-size: 10.5px; font-family: var(--mono); color: var(--ink-4); margin-top: 3px; }
.strip .cell .delta.up { color: var(--teal); }
.strip .cell .delta.dn { color: var(--rust); }

.two-col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.panel {
  background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.panel-head h3 {
  font-family: var(--serif); font-size: 15px; font-weight: 500; margin: 0;
  font-style: italic; color: var(--ink);
}
.panel-head .eyebrow { margin: 0; font-size: 10px; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 16px 18px; }
.panel-body.tight { padding: 0; }

/* Table denser */
.admin-body .table { font-size: 12px; }
.admin-body .table th { padding: 8px 14px; }
.admin-body .table td { padding: 9px 14px; }

/* Status badge */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st.ok { color: var(--teal); }
.st.warn { color: var(--amber); }
.st.err { color: var(--rust); }
.st.idle { color: var(--ink-4); }

/* Provider health "water grid" */
.health-grid {
  display: grid; grid-template-columns: 160px repeat(60, 1fr); gap: 2px;
  font-size: 11px; padding: 4px 0;
  align-items: center;
}
.health-grid .label {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); color: var(--ink-2);
  padding-right: 10px;
}
.health-grid .cell {
  height: 18px; border-radius: 2px; cursor: pointer;
}
.health-ok { background: #C8D9CE; }
.health-mid { background: #E2D6B3; }
.health-bad { background: #D9B4A2; }
.health-out { background: #E8E1CF; }

/* Audit timeline */
.audit-stream { padding: 0 4px; }
.audit-day { margin-bottom: 22px; }
.audit-day-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.audit-day-head .d {
  font-family: var(--serif); font-size: 18px; font-weight: 500; color: var(--ink);
  font-variant-numeric: oldstyle-nums;
}
.audit-day-head .w { font-family: var(--serif); font-style: italic; color: var(--ink-3); font-size: 13px; }
.audit-day-head .c { margin-left: auto; font-size: 11px; color: var(--ink-4); font-family: var(--mono); }

.audit-row {
  display: grid; grid-template-columns: 70px 28px 1fr 140px 120px 100px;
  gap: 14px; align-items: center;
  padding: 8px 12px; border-radius: 10px;
  font-size: 12.5px; cursor: pointer;
}
.audit-row:hover { background: var(--paper); }
.audit-row .t { font-family: var(--mono); font-size: 11px; color: var(--ink-4); }
.audit-row .glyph {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--paper); border: 1px solid var(--line);
  color: var(--ink-3);
}
.audit-row.deny .glyph { color: var(--rust); border-color: var(--rust); background: #F3E1DA; }
.audit-row.permission .glyph { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.audit-row.config .glyph { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }
.audit-row .txt { color: var(--ink); line-height: 1.5; }
.audit-row .txt em { font-family: var(--serif); font-style: italic; color: var(--ink-3); }
.audit-row .who { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.audit-row .tenant { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.audit-row .act { text-align: right; }

/* Progress pill */
.p-pill { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; width: 100%; }
.p-pill .fill { height: 100%; background: var(--ink); border-radius: 4px; }
.p-pill .fill.warn { background: var(--amber); }
.p-pill .fill.err { background: var(--rust); }

.kv-grid {
  display: grid; grid-template-columns: 120px 1fr; gap: 8px 16px;
  font-size: 12.5px;
}
.kv-grid .k { color: var(--ink-3); }
.kv-grid .v { color: var(--ink); font-family: var(--mono); font-size: 12px; }

/* Spark bars */
.spark {
  display: inline-flex; align-items: flex-end; gap: 1.5px; height: 22px;
}
.spark span { width: 3px; background: var(--ink-3); border-radius: 1px; }

/* Alert card */
.alert-card {
  display: flex; gap: 12px; padding: 12px 14px;
  border-radius: 12px; background: var(--paper);
  border: 1px solid var(--line);
  margin-bottom: 8px;
}
.alert-card .sev {
  width: 4px; flex-shrink: 0; border-radius: 4px; background: var(--amber);
  align-self: stretch;
}
.alert-card.critical .sev { background: var(--rust); }
.alert-card.info .sev { background: var(--ink-4); }
.alert-card .title { font-family: var(--serif); font-style: italic; font-size: 13.5px; color: var(--ink); }
.alert-card .meta { font-size: 11px; color: var(--ink-4); font-family: var(--mono); margin-top: 2px; }
.alert-card .msg { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; }
.alert-card .t-time { margin-left: auto; font-size: 11px; color: var(--ink-4); font-family: var(--mono); white-space: nowrap; }

/* Tenant / IM row */
.tenant-row {
  display: grid; grid-template-columns: 1fr 100px 120px 160px 90px 70px;
  gap: 14px; align-items: center;
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  font-size: 12.5px; cursor: pointer;
}
.tenant-row:hover { background: var(--bg); }
.tenant-row:last-child { border-bottom: 0; }
.tenant-row .name { color: var(--ink); font-weight: 500; display: flex; align-items: center; gap: 10px; }
.tenant-row .avatar-sq {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 13px;
}
.tenant-row .mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

/* Toast */
.toast-wrap {
  position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  padding: 10px 16px; border-radius: 10px;
  font-size: 13px; font-family: var(--mono);
  background: var(--ink); color: var(--paper);
  box-shadow: var(--shadow-3);
  pointer-events: auto;
  animation: toast-in 0.2s ease;
}
.toast.err { background: var(--rust); }
.toast.ok { background: var(--teal); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Modal overlay */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(28,27,24,0.55);
  z-index: 8888; display: flex; align-items: center; justify-content: center;
}
.modal-box {
  background: var(--paper); border-radius: 18px;
  border: 1px solid var(--line); width: 480px; max-width: 95vw;
  box-shadow: var(--shadow-3);
}
.modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 22px; border-bottom: 1px solid var(--line);
}
.modal-head h3 { font-family: var(--serif); font-size: 16px; font-weight: 500; margin: 0; font-style: italic; }
.modal-head .spacer { flex: 1; }
.modal-body { padding: 22px; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* Auth gate / empty state */
.gate-wrap {
  height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--admin-bg);
}
.gate-card {
  background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
  padding: 48px 56px; text-align: center; max-width: 420px; width: 100%;
  box-shadow: var(--shadow-3);
}
</style>
</head>
<body>
<div id="root"></div>

<script src="apiClient.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useCallback, useRef } = React;

/* ================== TOAST ================== */
let _toastId = 0;
let _toastSetter = null;
function toast(msg, type = '') {
  if (_toastSetter) _toastSetter(prev => {
    const id = ++_toastId;
    const next = [...prev, { id, msg, type }];
    setTimeout(() => _toastSetter(p => p.filter(t => t.id !== id)), 3500);
    return next;
  });
}

function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => { _toastSetter = setToasts; return () => { _toastSetter = null; }; }, []);
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>
      ))}
    </div>
  );
}

/* ================== ICONS ================== */
const Icon = ({ name, size = 16, stroke = 1.5, style = {} }) => {
  const s = { width: size, height: size, stroke: "currentColor", fill: "none", strokeWidth: stroke, strokeLinecap: "round", strokeLinejoin: "round", display: "inline-block" };
  const p = {
    activity: <><path d="M1 8h3l2-5 4 10 2-5h3"/></>,
    building: <><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M5 5v2M5 9v2M8 5v2M8 9v2M11 5v2M11 9v2"/></>,
    users: <><circle cx="6" cy="6" r="2.5"/><circle cx="12" cy="6.5" r="2"/><path d="M1 14c0-2.2 2.2-4 5-4s5 1.8 5 4M11 14c0-1.5 1-2.5 3-2.5s2 1 2 2.5"/></>,
    layers: <><path d="M8 2l6 3-6 3-6-3 6-3zM2 8l6 3 6-3M2 11l6 3 6-3"/></>,
    play: <><circle cx="8" cy="8" r="6"/><path d="M7 5.5l3 2.5-3 2.5z"/></>,
    shield: <><path d="M8 1l5 2v4c0 3-2 6-5 7-3-1-5-4-5-7V3l5-2zM6 8l1.5 1.5L10 7"/></>,
    plugin: <><path d="M5 2v3M11 2v3M3 5h10v4a4 4 0 01-4 4H7a4 4 0 01-4-4V5zM8 13v2"/></>,
    coin: <><circle cx="8" cy="8" r="6"/><path d="M6 6h3a1.5 1.5 0 010 3H6h3a1.5 1.5 0 010 3H6M8 4.5v7"/></>,
    book: <><path d="M3 2h10v12H5a2 2 0 01-2-2V2zM3 12a2 2 0 012-2h8"/></>,
    server: <><rect x="2" y="3" width="12" height="4" rx="1"/><rect x="2" y="9" width="12" height="4" rx="1"/><circle cx="4.5" cy="5" r="0.5" fill="currentColor"/><circle cx="4.5" cy="11" r="0.5" fill="currentColor"/></>,
    lock: <><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></>,
    key: <><circle cx="6" cy="8" r="3"/><path d="M9 8h6M13 8v2M15 8v2"/></>,
    search: <><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></>,
    refresh: <><path d="M2 8a6 6 0 0110-4.5L13 5M14 8a6 6 0 01-10 4.5L3 11M13 2v3h-3M3 14v-3h3"/></>,
    more: <><circle cx="4" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="12" cy="8" r="1.2"/></>,
    check: <><path d="M3 8l3 3 7-7"/></>,
    x: <><path d="M3 3l10 10M13 3L3 13"/></>,
    arrowRight: <><path d="M3 8h10M9 4l4 4-4 4"/></>,
    download: <><path d="M8 2v8M4 7l4 4 4-4M2 14h12"/></>,
    alert: <><path d="M8 2l7 12H1L8 2zM8 6v4M8 12v0.5"/></>,
    eye: <><path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></>,
    fork: <><circle cx="4" cy="3" r="2"/><circle cx="12" cy="3" r="2"/><circle cx="8" cy="13" r="2"/><path d="M4 5v3a2 2 0 002 2h4a2 2 0 002-2V5"/></>,
    pause: <><path d="M5 3v10M11 3v10"/></>,
    filter: <><path d="M2 3h12l-4.5 6v4.5L6.5 12V9L2 3z"/></>,
    flow: <><rect x="2" y="2" width="5" height="4" rx="1.5"/><rect x="9" y="10" width="5" height="4" rx="1.5"/><path d="M4 6v4M4 10h9"/></>,
    bell: <><path d="M4 7a4 4 0 118 0v3l1.5 2h-11L4 10V7zM6.5 14a1.5 1.5 0 003 0"/></>,
    clock: <><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 1"/></>,
    mail: <><rect x="2" y="4" width="12" height="9" rx="1.5"/><path d="M2 4l6 5 6-5"/></>,
    plus: <><path d="M8 3v10M3 8h10"/></>,
    edit: <><path d="M11 2l3 3-8 8H3v-3L11 2z"/></>,
    trash: <><path d="M2 4h12M5 4V2h6v2M4 4l1 9h6l1-9"/></>,
    link: <><path d="M7 9a3 3 0 004.24.12l2-2a3 3 0 00-4.24-4.24L7.5 4.5M9 7a3 3 0 00-4.24-.12l-2 2a3 3 0 004.24 4.24L8.5 11.5"/></>,
  };
  return <svg viewBox="0 0 16 16" style={{ ...s, ...style }}>{p[name] || null}</svg>;
};

const PrismMark = ({ size = 22 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} fill="none" style={{ display: 'block' }}>
    <path d="M4 20 L12 5 L20 20 Z" stroke="currentColor" strokeWidth="1.3" strokeLinejoin="round"/>
    <line x1="1" y1="14" x2="7" y2="14" stroke="currentColor" strokeWidth="0.8"/>
    <line x1="17" y1="13" x2="23" y2="11" stroke="#9B4A35" strokeWidth="0.9"/>
    <line x1="17" y1="14" x2="23" y2="13.5" stroke="#B8803A" strokeWidth="0.9"/>
    <line x1="17" y1="15" x2="23" y2="15" stroke="#6B7A4A" strokeWidth="0.9"/>
    <line x1="17" y1="16" x2="23" y2="16.5" stroke="#4E7C6E" strokeWidth="0.9"/>
    <line x1="17" y1="17" x2="23" y2="19" stroke="#7A4E58" strokeWidth="0.9"/>
  </svg>
);

/* ================== NAV ================== */
const NAV = [
  { id: "overview", icon: "activity", label: "总览" },
  { id: "tenants", icon: "building", label: "IM 频道" },
  { id: "users", icon: "users", label: "用户" },
  { id: "providers", icon: "layers", label: "Providers" },
  { id: "runs", icon: "play", label: "Runs" },
  { id: "guardrails", icon: "shield", label: "护栏" },
  { id: "plugins", icon: "plugin", label: "Skills" },
  { id: "mcpServers", icon: "server", label: "MCP Servers" },
  { id: "billing", icon: "coin", label: "账务" },
  { id: "audit", icon: "book", label: "审计" },
  { id: "infra", icon: "server", label: "基础设施" },
  { id: "observability", icon: "flow", label: "可观测" },
  { id: "security", icon: "lock", label: "安全" },
];

/* ================== LOADING SPINNER ================== */
function Spinner({ msg = "加载中…" }) {
  return (
    <div style={{ padding: 48, textAlign: "center", color: "var(--ink-3)", fontFamily: "var(--serif)", fontStyle: "italic" }}>
      {msg}
    </div>
  );
}

function EmptyState({ msg }) {
  return (
    <div style={{ padding: 48, textAlign: "center", color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic" }}>
      <div style={{ marginBottom: 12 }}><PrismMark size={36}/></div>
      {msg}
    </div>
  );
}

/* ================== ALERT CONFIG MODAL ================== */
function AlertConfigModal({ onClose }) {
  const [cfg, setCfg] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => {

function ProviderEditModal({ provider, onClose, onSaved }) {
  const isNew = !provider.id;
  const [presets, setPresets] = useState([]);
  const [selectedPreset, setSelectedPreset] = useState(null);
  const [form, setForm] = useState({
    name: provider.name || '',
    protocol: provider.protocol || 'anthropic',
    base_url: provider.base_url || '',
    model_id: provider.model_id || '',
    api_key: '',
  });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    if (isNew) {
      PrismAPI.providers.presets().then(data => {
        const list = Array.isArray(data) ? data : [];
        setPresets(list);
      }).catch(() => {});
    }
  }, [isNew]);

  function applyPreset(preset) {
    setSelectedPreset(preset);
    setForm(f => ({
      ...f,
      name: preset.name,
      protocol: preset.protocol,
      base_url: preset.base_url,
      model_id: preset.model_id,
    }));
  }

  async function save() {
    if (!window.confirm(isNew ? '确认创建 Provider？' : '确认更新 Provider？')) return;
    setSaving(true);
    try {
      const body = { ...form };
      if (!body.api_key) delete body.api_key; // don't send empty key
      if (isNew) {
        await PrismAPI.providers.create(body);
        toast('Provider 已创建', 'ok');
      } else {
        await PrismAPI.providers.update(provider.id, body);
        toast('Provider 已更新', 'ok');
      }
      onSaved();
      onClose();
    } catch (e) {
      toast((isNew ? '创建' : '更新') + '失败: ' + e.message, 'err');
    } finally {
      setSaving(false);
    }
  }

  const F = ({ label, k, type = 'text', placeholder = '' }) => (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 11, color: "var(--ink-3)", marginBottom: 4, fontFamily: "var(--mono)" }}>{label}</div>
      <input type={type} value={form[k] ?? ''} placeholder={placeholder}
        onChange={e => setForm(f => ({ ...f, [k]: e.target.value }))}
        style={{ width: "100%", padding: "7px 12px", borderRadius: 8, border: "1px solid var(--line)", fontSize: 13, fontFamily: "var(--mono)", background: "var(--bg)", boxSizing: "border-box" }}
      />
    </div>
  );

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box">
        <div className="modal-head">
          <Icon name={isNew ? "plus" : "edit"} size={15}/>
          <h3>{isNew ? '新增 Provider' : '编辑 Provider'}</h3>
          <div className="spacer"/>
          <button className="icon-btn" onClick={onClose}><Icon name="x" size={14}/></button>
        </div>
        <div className="modal-body" style={{ maxHeight: '65vh', overflowY: 'auto' }}>
          {isNew && presets.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 11, color: "var(--ink-3)", marginBottom: 8, fontFamily: "var(--mono)" }}>选择预设</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {presets.map((p, i) => (
                  <button key={i}
                    onClick={() => applyPreset(p)}
                    className={`btn sm ${selectedPreset?.name === p.name ? 'primary' : 'ghost'}`}
                    style={{ fontSize: 11 }}>
                    {p.name}
                  </button>
                ))}
              </div>
            </div>
          )}
          <F label="名称" k="name" placeholder="Anthropic Claude"/>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, color: "var(--ink-3)", marginBottom: 4, fontFamily: "var(--mono)" }}>协议</div>
            <select value={form.protocol} onChange={e => setForm(f => ({ ...f, protocol: e.target.value }))}
              style={{ width: "100%", padding: "7px 12px", borderRadius: 8, border: "1px solid var(--line)", fontSize: 13, background: "var(--bg)", boxSizing: "border-box" }}>
              <option value="anthropic">anthropic</option>
              <option value="openai">openai</option>
            </select>
          </div>
          <F label="Base URL" k="base_url" placeholder="https://api.anthropic.com"/>
          <F label="Model ID" k="model_id" placeholder="claude-sonnet-4-6"/>
          <F label={provider.api_key_masked ? `API Key (当前: ${provider.api_key_masked}，留空保留)` : 'API Key'} k="api_key" type="password" placeholder="sk-…"/>
        </div>
        <div className="modal-foot">
          <button className="btn sm ghost" onClick={onClose}>取消</button>
          <button className="btn sm primary" onClick={save} disabled={saving}>
            {saving ? '保存中…' : (isNew ? '创建' : '保存')}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ================== INVITE CODE MODAL ================== */
function InviteCodeModal({ onClose }) {
  const [codes, setCodes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [creating, setCreating] = useState(false);
  const [maxUses, setMaxUses] = useState('');

  async function load() {
    try {
      const data = await PrismAPI.admin.listInviteCodes();
      setCodes(Array.isArray(data) ? data : (data?.items || []));
    } catch (e) {
      toast('加载邀请码失败: ' + e.message, 'err');
    } finally {
      setLoading(false);
    }
  }

  useEffect(() => { load(); }, []);

  async function create() {
    if (!window.confirm('确认创建邀请码？')) return;
    setCreating(true);
    try {
      const body = {};
      if (maxUses) body.max_uses = parseInt(maxUses);
      await PrismAPI.admin.createInviteCode(body);
      toast('邀请码已创建', 'ok');
      setMaxUses('');
      load();
    } catch (e) {
      toast('创建失败: ' + e.message, 'err');
    } finally {
      setCreating(false);
    }
  }

  async function revoke(id) {
    if (!window.confirm('确认撤销此邀请码？')) return;
    try {
      await PrismAPI.admin.revokeInviteCode(id);
      toast('已撤销', 'ok');
      load();
    } catch (e) {
      toast('撤销失败: ' + e.message, 'err');
    }
  }

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal-box" style={{ width: 560 }}>
        <div className="modal-head">
          <Icon name="key" size={15}/>
          <h3>邀请码管理</h3>
          <div className="spacer"/>
          <button className="icon-btn" onClick={onClose}><Icon name="x" size={14}/></button>
        </div>
        <div className="modal-body" style={{ maxHeight: '55vh', overflowY: 'auto' }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 18, alignItems: "flex-end" }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: "var(--ink-3)", marginBottom: 4, fontFamily: "var(--mono)" }}>最大使用次数（留空=无限）</div>
              <input type="number" value={maxUses} onChange={e => setMaxUses(e.target.value)} placeholder="10"
                style={{ width: "100%", padding: "7px 12px", borderRadius: 8, border: "1px solid var(--line)", fontSize: 13, fontFamily: "var(--mono)", background: "var(--bg)", boxSizing: "border-box" }}/>
            </div>
            <button className="btn sm primary" onClick={create} disabled={creating}>
              <Icon name="plus" size={11}/> {creating ? '创建中…' : '创建邀请码'}
            </button>
          </div>
          {loading ? <Spinner/> : codes.length === 0 ? <EmptyState msg="暂无邀请码"/> : (
            <table className="table" style={{ width: "100%" }}>
              <thead><tr><th>Code</th><th>已用/上限</th><th>过期</th><th></th></tr></thead>
              <tbody>
                {codes.map(c => (
                  <tr key={c.id}>
                    <td className="mono" style={{ fontWeight: 500, color: "var(--ink)" }}>{c.code}</td>
                    <td className="mono">{c.used_count ?? 0} / {c.max_uses ?? '∞'}</td>
                    <td style={{ color: "var(--ink-3)", fontFamily: "var(--mono)", fontSize: 11 }}>{c.expires_at ? new Date(c.expires_at).toLocaleDateString() : '永不'}</td>
                    <td>
                      <button className="btn sm ghost" style={{ color: "var(--rust)" }} onClick={() => revoke(c.id)}>
                        <Icon name="trash" size={11}/> 撤销
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
        <div className="modal-foot">
          <button className="btn sm ghost" onClick={onClose}>关闭</button>
        </div>
      </div>
    </div>
  );
}

function Users({ currentUser }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [page, setPage] = useState(1);
  const [meta, setMeta] = useState({});
  const [showInvite, setShowInvite] = useState(false);

  const load = useCallback(async (p = 1, q = '') => {
    setLoading(true);
    try {
      const data = await PrismAPI.admin.listUsers({ page: p, search: q || undefined });
      setUsers(data?.items || []);
      setMeta({ total: data?.total, hasNext: data?.has_next, hasPrev: data?.has_prev });
    } catch (e) {
      toast('加载用户失败: ' + e.message, 'err');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(1, search); }, []);

  function doSearch() { setPage(1); load(1, search); }

  async function changeRole(user) {
    const newRole = user.role === 'admin' ? 'user' : 'admin';
    if (!window.confirm(`确认将 ${user.email} 的角色改为 ${newRole}？`)) return;
    try {
      await PrismAPI.admin.changeUserRole(user.id, newRole);
      toast('角色已更新', 'ok');
      load(page, search);
    } catch (e) {
      toast('修改失败: ' + e.message, 'err');
    }
  }

  async function disableUser(user) {
    if (user.id === currentUser?.id) { toast('不能禁用自己', 'err'); return; }
    if (!window.confirm(`确认禁用用户 ${user.email}？此操作不可逆（软删除）。`)) return;
    try {
      await PrismAPI.admin.disableUser(user.id);
      toast('用户已禁用', 'ok');
      load(page, search);
    } catch (e) {
      toast('禁用失败: ' + e.message, 'err');
    }

  return (
    <div>
      <div className="page-head"><div className="page-title">用户与角色</div>
        <div className="page-sub" style={{ fontFamily: "var(--serif)", fontStyle: "italic" }}>管理员 / 普通用户。最后一个管理员不可降级（后端 409 保护）。</div>

      <div className="two-col" style={{ gridTemplateColumns: "1fr 280px" }}>
        <div className="panel">

            <Icon name="users" size={14}/>

            <span className="eyebrow">共 {meta.total ?? '…'} 人</span>

          </div>
          <div className="panel-body tight">
            <div style={{ padding: "10px 14px", display: "flex", gap: 10, alignItems: "center", borderBottom: "1px solid var(--line)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "4px 12px", background: "var(--bg)", borderRadius: 999, fontSize: 12, color: "var(--ink-3)", flex: 1 }}>
                <Icon name="search" size={12}/>
                <input value={search} onChange={e => setSearch(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && doSearch()}
                  placeholder="搜索邮箱…"
                  style={{ background: "transparent", border: "none", outline: "none", fontSize: 12, width: "100%", color: "var(--ink)" }}/>
              </div>
              <button className="btn sm ghost" onClick={doSearch}><Icon name="search" size={11}/></button>
            </div>
            {loading ? <Spinner/> : users.length === 0 ? <EmptyState msg="暂无用户"/> : (
              <table className="table">
                <thead><tr><th>用户</th><th>邮箱</th><th>角色</th><th>最后登录</th><th>操作</th></tr></thead>
                <tbody>
                  {users.map((u) => (
                    <tr key={u.id}>
                      <td>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <div className="avatar-sq" style={{ width: 24, height: 24, fontSize: 11 }}>{(u.username || u.email || '?')[0].toUpperCase()}</div>
                          <div style={{ color: "var(--ink)", fontWeight: 500 }}>{u.username || '—'}</div>
                        </div>
                      </td>
                      <td className="mono" style={{ color: "var(--ink-3)" }}>{u.email}</td>
                      <td><span className={`badge ${u.role === 'admin' ? 'ink' : ''}`}>{u.role}</span></td>
                      <td style={{ color: "var(--ink-3)", fontFamily: "var(--mono)", fontSize: 11 }}>

                      <td>

            {(meta.hasPrev || meta.hasNext) && (
              <div style={{ display: "flex", justifyContent: "center", gap: 8, padding: 14 }}>
                <button className="btn sm ghost" disabled={!meta.hasPrev} onClick={() => { setPage(p => p - 1); load(page - 1, search); }}>← 上一页</button>
                <span style={{ fontFamily: "var(--mono)", fontSize: 12, color: "var(--ink-3)", alignSelf: "center" }}>第 {page} 页</span>

          <div className="panel-body" style={{ fontSize: 12 }}>

                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      </div>
      {showInvite && <InviteCodeModal onClose={() => setShowInvite(false)}/>}
    </div>
  );
}

function Audit() {
  const [auditData, setAuditData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filt, setFilt] = useState('all');
  const [exporting, setExporting] = useState(false);
  const [total, setTotal] = useState(0);

  useEffect(() => {
    PrismAPI.admin.listAuditLogs({ limit: 100 })
      .then(data => {
        const items = data?.items || [];
        setTotal(data?.total || items.length);
        // Group by date
        const byDate = {};
        items.forEach(item => {
          const d = new Date(item.created_at);
          const dateKey = d.toISOString().split('T')[0];
          if (!byDate[dateKey]) byDate[dateKey] = [];
          byDate[dateKey].push(item);
        });
        const grouped = Object.entries(byDate)
          .sort(([a], [b]) => b.localeCompare(a))
          .map(([d, rows]) => ({
            d,
            wkd: new Date(d).toLocaleDateString('zh-CN', { weekday: 'long' }),
            rows,
          }));
        setAuditData(grouped);
      })
      .catch(e => toast('加载审计日志失败: ' + e.message, 'err'))
      .finally(() => setLoading(false));
  }, []);

  async function exportCSV() {
    setExporting(true);
    try {
      await PrismAPI.admin.exportAuditLogsCSV({});
      toast('CSV 已下载', 'ok');
    } catch (e) {
      toast('导出失败: ' + e.message, 'err');
    } finally {
      setExporting(false);
    }
  }

  // Map action → kind for styling
  function actionKind(action) {
    if (!action) return '';
    if (action.includes('deny') || action.includes('reject')) return 'deny';
    if (action.includes('permission')) return 'permission';
    if (action.includes('config') || action.includes('update') || action.includes('create') || action.includes('delete')) return 'config';
    return '';
  }

  function actionIcon(action) {
    const k = actionKind(action);
    if (k === 'deny') return 'x';
    if (k === 'permission') return 'shield';
    return 'flow';
  }

  function filterRow(item) {
    if (filt === 'all') return true;
    const k = actionKind(item.action);
    return k === filt;
  }

  return (
    <div>
      <div className="page-head" style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between" }}>
        <div>
          <div className="page-title">审计流</div>
          <div className="page-sub" style={{ fontFamily: "var(--serif)", fontStyle: "italic" }}>每一次操作 —— 都在这里排成一列，永久保存。</div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn sm" onClick={exportCSV} disabled={exporting}>
            <Icon name="download" size={11}/> {exporting ? '导出中…' : 'CSV 导出'}
          </button>
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
        {[
          { id: "all", label: "全部" },
          { id: "permission", label: "权限" },
          { id: "deny", label: "拦截" },
          { id: "config", label: "配置变更" },
        ].map(x => (
          <button key={x.id} onClick={() => setFilt(x.id)} className={`btn sm ${filt === x.id ? "primary" : "ghost"}`}>
            {x.label}
          </button>
        ))}
      </div>

      <div className="two-col" style={{ gridTemplateColumns: "1fr 260px" }}>
        <div className="panel">
          <div className="panel-body">
            {loading ? <Spinner/> : auditData.length === 0 ? <EmptyState msg="暂无审计记录"/> : (
              <div className="audit-stream">
                {auditData.map((day, i) => {
                  const filtered = day.rows.filter(r => filterRow(r));
                  if (filtered.length === 0) return null;
                  return (
                    <div key={i} className="audit-day">
                      <div className="audit-day-head">
                        <div className="d">{day.d}</div>
                        <div className="w">· {day.wkd}</div>
                        <div className="c">{filtered.length} 条</div>
                      </div>
                      {filtered.map((r, j) => {
                        const kind = actionKind(r.action);
                        const t = new Date(r.created_at).toLocaleTimeString('zh-CN', { hour12: false });
                        return (
                          <div key={j} className={`audit-row ${kind}`}>
                            <div className="t">{t}</div>
                            <div className="glyph"><Icon name={actionIcon(r.action)} size={12}/></div>
                            <div className="txt">
                              {r.action}
                              {r.details && Object.keys(r.details).length > 0 && (
                                <em style={{ marginLeft: 8 }}>{JSON.stringify(r.details).substring(0, 60)}</em>
                              )}
                            </div>
                            <div className="who">{r.user_id ? r.user_id.substring(0, 12) + '…' : 'system'}</div>
                            <div className="tenant">{r.resource_type || '—'}</div>
                            <div className="act">
                              <span className={`badge ${r.severity === 'warn' ? '' : ''}`}>{r.severity || 'info'}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
                <div style={{ textAlign: "center", padding: 18, fontSize: 12, color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic" }}>
                  共 {total} 条审计记录（显示最近 100 条）
                </div>
              </div>
            )}
          </div>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div className="panel">
            <div className="panel-head"><Icon name="clock" size={13}/><h3>审计概览</h3></div>
            <div className="panel-body">
              <div style={{ fontFamily: "var(--serif)", fontSize: 26, color: "var(--ink)", letterSpacing: "-0.01em" }}>{total}</div>
              <div style={{ fontSize: 11, color: "var(--ink-4)", fontFamily: "var(--mono)", marginBottom: 12 }}>全部审计事件</div>
              <div className="kv-grid" style={{ gridTemplateColumns: "1fr auto", fontSize: 12 }}>
                <div className="k">当前页</div><div className="v" style={{ color: "var(--ink)" }}>{auditData.reduce((s, d) => s + d.rows.length, 0)}</div>
                <div className="k">分组天数</div><div className="v">{auditData.length}</div>
              </div>
            </div>
          </div>
          <div className="panel">
            <div className="panel-head"><Icon name="alert" size={13} style={{ color: "var(--amber)" }}/><h3>保留策略</h3></div>
            <div className="panel-body" style={{ fontSize: 12.5, lineHeight: 1.6, color: "var(--ink-2)" }}>
              <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", color: "var(--ink)", marginBottom: 6 }}>存储</div>
              <div style={{ color: "var(--ink-3)" }}>审计日志持久化到 PostgreSQL audit_logs 表，无自动清理。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function McpServers() {
  const [servers, setServers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [transport, setTransport] = useState("stdio");
  const [saving, setSaving] = useState(false);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const data = await PrismAPI.mcp.listServers();
      setServers(Array.isArray(data) ? data : (data?.data || []));
    } catch (e) {
      toast('加载 MCP Servers 失败: ' + e.message, 'err');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(); }, []);

  async function handleAdd(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const tr = fd.get("transport");
    const body = {
      name: fd.get("name"),
      description: fd.get("description") || undefined,
      transport: tr,
    };
    if (tr === "stdio") {
      body.command = fd.get("command");
      try { body.args = JSON.parse(fd.get("args") || "[]"); } catch { body.args = []; }
      try { body.env = JSON.parse(fd.get("env") || "{}"); } catch { body.env = {}; }
    } else {
      body.command = "__http__";
      body.url = fd.get("url");
      try { body.headers = JSON.parse(fd.get("headers") || "null"); } catch { body.headers = null; }
    }
    setSaving(true);
    try {
      await PrismAPI.mcp.createServer(body);
      toast('已添加', 'ok');
      setShowForm(false);
      setTransport("stdio");
      e.target.reset();
      load();
    } catch (e2) {
      toast('添加失败: ' + e2.message, 'err');
    } finally {
      setSaving(false);
    }
  }

  async function del(s) {
    if (!window.confirm(`确认删除 "${s.name}"？`)) return;
    try {
      await PrismAPI.mcp.deleteServer(s.id);
      toast('已删除', 'ok');
      load();
    } catch (e) {
      toast('删除失败: ' + e.message, 'err');
    }
  }

  return (
    <div>
      <div className="page-head">
        <div className="page-title">MCP Servers</div>
        <div className="page-sub" style={{ fontFamily: "var(--serif)", fontStyle: "italic" }}>管理 Stdio 子进程与 HTTP Streamable MCP 服务器。</div>
      </div>

      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="panel-head">
          <Icon name="server" size={14}/>
          <h3>全部 MCP Servers</h3>
          <div style={{ flex: 1 }}/>
          <button className="btn sm" onClick={() => setShowForm(v => !v)}>
            {showForm ? "取消" : "+ 添加"}
          </button>
        </div>

        {showForm && (
          <form onSubmit={handleAdd} style={{ padding: "16px 20px", borderBottom: "1px solid var(--border)", background: "var(--paper-2)" }}>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
              <input name="name" required placeholder="名称" style={{ flex: "1 1 160px" }} className="input"/>
              <input name="description" placeholder="描述（可选）" style={{ flex: "2 1 240px" }} className="input"/>
            </div>
            <div style={{ marginBottom: 12, display: "flex", gap: 20 }}>
              <label style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
                <input type="radio" name="transport" value="stdio" checked={transport === "stdio"} onChange={() => setTransport("stdio")}/>
                Stdio（子进程）
              </label>
              <label style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
                <input type="radio" name="transport" value="http" checked={transport === "http"} onChange={() => setTransport("http")}/>
                HTTP（Streamable + SSE）
              </label>
            </div>
            {transport === "stdio" && (
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
                <input name="command" required placeholder="命令，例：npx" style={{ flex: "1 1 140px" }} className="input"/>
                <input name="args" placeholder='参数，例：["-y","@modelcontextprotocol/server-brave-search"]' style={{ flex: "2 1 300px" }} className="input"/>
                <input name="env" placeholder='环境变量，例：{"BRAVE_API_KEY":"xxx"}' style={{ flex: "2 1 300px" }} className="input"/>
              </div>
            )}
            {transport === "http" && (
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 12 }}>
                <input name="url" required placeholder="URL，例：https://mcp.exa.ai/mcp" style={{ flex: "2 1 300px" }} className="input"/>
                <input name="headers" placeholder='请求头，例：{"Authorization":"Bearer xxx"}' style={{ flex: "2 1 300px" }} className="input"/>
              </div>
            )}
            <button type="submit" className="btn sm" disabled={saving}>{saving ? "保存中…" : "保存"}</button>
          </form>
        )}

        <div className="panel-body" style={{ padding: 0 }}>
          {loading ? <Spinner/> : servers.length === 0 ? (
            <EmptyState msg="暂无 MCP Servers"/>
          ) : (
            <table className="table" style={{ width: "100%" }}>
              <thead><tr><th>名称</th><th>Transport</th><th>Command / URL</th><th>Scope</th><th></th></tr></thead>
              <tbody>
                {servers.map(s => (
                  <tr key={s.id}>
                    <td>{s.name}</td>
                    <td><span style={{ background: s.transport === "http" ? "var(--amber)" : "var(--border)", borderRadius: 4, padding: "2px 6px", fontSize: 11 }}>{s.transport || "stdio"}</span></td>
                    <td style={{ fontFamily: "monospace", fontSize: 11, maxWidth: 320, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {s.transport === "http" ? s.url : s.command}
                    </td>
                    <td>{s.scope}</td>
                    <td style={{ textAlign: "right" }}>
                      {s.scope !== "system" && (
                        <button className="btn sm ghost" onClick={() => del(s)}>删除</button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

/* ================== AUTH GATE ================== */
function NotAdmin({ onLogout }) {
  return (
    <div className="gate-wrap">
      <div className="gate-card">
        <div style={{ marginBottom: 24 }}><PrismMark size={48}/></div>
        <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 20, color: "var(--ink)", marginBottom: 12 }}>需要管理员权限</div>
        <div style={{ fontSize: 13, color: "var(--ink-3)", lineHeight: 1.6, marginBottom: 24 }}>
          当前账户角色不是 admin，无法访问控制台。请联系平台管理员开通权限。
        </div>
        <button className="btn sm ghost" onClick={onLogout}>登出 → 返回登录页</button>
      </div>
    </div>
  );
}

/* ================== APP ================== */
function App() {
  const [screen, setScreen] = useState('loading'); // loading | gate-nologin | gate-noadmin | app
  const [currentUserData, setCurrentUserData] = useState(null);
  const [page, setPage] = useState(localStorage.getItem("prism-admin-page") || "overview");
  const [dashData, setDashData] = useState(null);
  const [healthData, setHealthData] = useState(null);
  const [showAlerts, setShowAlerts] = useState(false);
  // tab must be at top level (Rules of Hooks — no conditional hooks)
  const [tab, setTab] = useState(0);

  useEffect(() => { localStorage.setItem("prism-admin-page", page); window.__setPage = setPage; }, [page]);
  useEffect(() => { setTab(0); }, [page]);

  // Auth gate on mount
  useEffect(() => {
    async function init() {
      try {
        if (!PrismAPI.isAuthenticated()) {
          // Try to restore via refresh cookie
          const ok = await PrismAPI.refresh();
          if (!ok) { setScreen('gate-nologin'); return; }
        }
        const user = await PrismAPI.me();
        if (user.role !== 'admin') { setCurrentUserData(user); setScreen('gate-noadmin'); return; }
        setCurrentUserData(user);
        setScreen('app');
        // Load dashboard data
        PrismAPI.admin.getDashboard().then(setDashData).catch(() => {});
        PrismAPI.healthDetailed().then(setHealthData).catch(() => {});
      } catch (e) {
        setScreen('gate-nologin');
      }
    }
    init();

    const handler = () => setScreen('gate-nologin');
    window.addEventListener('prism:unauthorized', handler);
    return () => window.removeEventListener('prism:unauthorized', handler);
  }, []);

  async function doLogout() {
    await PrismAPI.logout().catch(() => {});
    window.location.href = '/Prism.html';
  }

  if (screen === 'loading') {
    return (
      <div className="gate-wrap">
        <div style={{ textAlign: "center" }}>
          <PrismMark size={48}/>
          <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 14, color: "var(--ink-3)", marginTop: 16 }}>验证身份中…</div>
        </div>
      </div>
    );
  }

  if (screen === 'gate-nologin') {
    return (
      <div className="gate-wrap">
        <div className="gate-card">
          <div style={{ marginBottom: 24 }}><PrismMark size={48}/></div>
          <div style={{ fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 20, color: "var(--ink)", marginBottom: 12 }}>请先登录</div>
          <div style={{ fontSize: 13, color: "var(--ink-3)", lineHeight: 1.6, marginBottom: 24 }}>
            需要 admin 账号才能访问控制台。
          </div>
          <button className="btn sm primary" onClick={() => window.location.href = '/Prism.html'}>
            → 前往登录页
          </button>
        </div>
      </div>
    );
  }

  if (screen === 'gate-noadmin') {
    return <NotAdmin onLogout={doLogout}/>;
  }

  const cur = PAGES[page];
  const tabsFor = {
    overview: [{ id: "live", label: "此刻" }],
    tenants: [{ id: "all", label: "IM 频道" }],
    users: [{ id: "all", label: "全部" }, { id: "admins", label: "管理员" }],
    providers: [{ id: "all", label: "全部" }, { id: "anthropic", label: "Anthropic 协议" }, { id: "openai", label: "OpenAI 协议" }],
    runs: [{ id: "live", label: "按 Session 查" }],
    audit: [{ id: "stream", label: "事件流" }, { id: "retention", label: "保留策略" }],
  };
  const userInitial = (currentUserData?.username || currentUserData?.email || 'A')[0].toUpperCase();

  return (
    <div className="admin-app">
      <aside className="rail">
        <div className="brand"><PrismMark size={24}/></div>
        {NAV.map(n => (
          <div key={n.id} className={`rail-item ${page === n.id ? "active" : ""}`} onClick={() => setPage(n.id)}>
            <Icon name={n.icon} size={16}/>
            <span className="lbl">{n.label}</span>
          </div>
        ))}
        <div style={{ flex: 1 }}/>
        <div className="rail-item" title="回到用户端" onClick={() => location.href = "Prism.html"}>
          <Icon name="arrowRight" size={16}/>
          <span className="lbl">用户端</span>
        </div>
      </aside>

      <main className="admin-main">
        <div className="admin-top">
          <div>
            <h1>{cur.title}</h1>
            <div className="sub">· prism control room</div>
          </div>
          <div className="spacer"/>
          <div className="env-chip"><span className="dot"/> prod · single-tenant</div>
          <button className="btn sm ghost" onClick={() => setShowAlerts(true)}>
            <Icon name="bell" size={12}/> 告警配置
          </button>
          <button className="icon-btn" title="刷新" onClick={() => {
            PrismAPI.admin.getDashboard().then(setDashData).catch(() => {});
            PrismAPI.healthDetailed().then(setHealthData).catch(() => {});
            toast('已刷新', 'ok');
          }}>
            <Icon name="refresh" size={14}/>
          </button>
          <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--ink)", color: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--serif)", fontSize: 13, cursor: "pointer" }}
            title={`${currentUserData?.email} — 点击登出`}
            onClick={doLogout}>
            {userInitial}
          </div>
        </div>

        {tabsFor[page] && (
          <div className="admin-tabs">
            {tabsFor[page].map((t, i) => (
              <div key={i} className={`tab ${i === tab ? "active" : ""}`} onClick={() => setTab(i)}>{t.label}</div>
            ))}
          </div>
        )}

        <div className="admin-body">
          {cur.r({ dashData, healthData, currentUser: currentUserData })}
        </div>
      </main>

      {showAlerts && <AlertConfigModal onClose={() => setShowAlerts(false)}/>}
      <ToastContainer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
