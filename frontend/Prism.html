function Sidebar({ page, setPage, t }) {
  const [q, setQ] = useState("");
  const groups = useMemo(() => {
    const f = SESSIONS.filter(s => s.title.includes(q));
    const out = {}; f.forEach(s => (out[s.group] = out[s.group] || []).push(s));
    return out;
  }, [q]);
  const gOrder = ["today", "yesterday", "thisWeek", "earlier"];

  return (
    <aside className="sidebar">
      <div style={{ padding: "16px 16px 12px" }}>
        <div className="logo"><PrismMark size={22}/><span>{t.brand}</span><span className="badge" style={{ marginLeft: "auto" }}>v0.4</span></div>
      </div>
      <div style={{ padding: "0 12px 10px" }}>
        <button className="btn primary" style={{ width: "100%", justifyContent: "center" }}>
          <Icon name="plus" size={12}/> {t.newChat}
        </button>
        <div style={{ marginTop: 10, position: "relative" }}>
          <Icon name="search" size={13} style={{ position: "absolute", left: 14, top: 12, color: "var(--ink-4)" }}/>
          <input className="input" placeholder={t.searchSession} value={q} onChange={e => setQ(e.target.value)}
            style={{ paddingLeft: 34, background: "transparent", fontSize: 12.5 }}/>
        </div>
      </div>
      <nav style={{ padding: "2px 10px 4px" }}>
        {NAV.slice(0, 3).map(it => (
          <div key={it.id} className={`nav-item ${page === it.id ? "active" : ""}`} onClick={() => setPage(it.id)}>
            <Icon name={it.icon} size={13}/><span>{t.nav[it.id]}</span>
          </div>
        ))}
      </nav>
      <div style={{ flex: 1, overflowY: "auto", padding: "8px 10px" }}>
        {gOrder.map(g => !groups[g]?.length ? null : (
          <div key={g} style={{ marginBottom: 8 }}>
            <div className="eyebrow" style={{ padding: "8px 12px 6px" }}>{t[g]} · {groups[g].length}</div>
            {groups[g].map((s, i) => (
              <div key={s.id} className={`session-item ${i === 0 && g === "today" ? "active" : ""}`}>
                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                  {s.pinned && <Icon name="pin" size={10} style={{ color: "var(--amber)" }}/>}
                  <span className="title" style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.title}</span>
                  {s.status === "running" && <span className="dot live"/>}
                </div>
                <div className="preview">{s.preview}</div>
                <div className="meta"><span>{s.time}</span></div>
              </div>
            ))}
          </div>
        ))}
      </div>
      <div style={{ padding: "8px 10px", borderTop: "1px solid var(--line)" }}>
        {NAV.slice(3).map(it => (
          <div key={it.id} className={`nav-item ${page === it.id ? "active" : ""}`} onClick={() => setPage(it.id)}>
            <Icon name={it.icon} size={13}/><span>{t.nav[it.id]}</span>
          </div>
        ))}
      </div>
      <div style={{ padding: "12px 16px", borderTop: "1px solid var(--line)", display: "flex", gap: 10, alignItems: "center" }}>
        <div style={{ width: 28, height: 28, borderRadius: "50%", background: "var(--ink)", color: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--serif)", fontSize: 13 }}>A</div>

function ToolCard({ tool, initOpen = false }) {
  const [open, setOpen] = useState(initOpen);
  return (
    <div className="tool-card" data-open={open}>
      <div className="tool-head" onClick={() => setOpen(!open)}>
        <Icon name="chevron" size={11} style={{ transition: "transform 0.2s", transform: open ? "rotate(90deg)" : "" }}/>
        <Icon name={tool.icon || "terminal"} size={13} style={{ color: "var(--ink-3)" }}/>
        <span className="name">{tool.name}</span>
        <span className="preview">{tool.preview}</span>
        {tool.status === "running" && <span className="tool-status running"><span className="dot warn"/> 进行中</span>}
        {tool.status === "ok" && <span className="tool-status ok"><Icon name="check" size={11}/> {tool.duration}</span>}
      </div>
      <div className="tool-body">
        {tool.input && <><div className="tool-section-label">输入</div><pre className="tool-code">{tool.input}</pre></>}
        {tool.output && <><div className="tool-section-label" style={{ marginTop: 10 }}>输出</div><pre className="tool-code">{tool.output}</pre></>}
        {tool.meta && <div style={{ display: "flex", gap: 14, marginTop: 10, fontSize: 11, color: "var(--ink-3)", fontFamily: "var(--mono)" }}>
          {Object.entries(tool.meta).map(([k, v]) => <div key={k}><span style={{ color: "var(--ink-4)" }}>{k}</span> <b style={{ color: "var(--ink)", fontWeight: 500 }}>{v}</b></div>)}
        </div>}
      </div>
    </div>
  );
}

function Composer({ t, onSend }) {
  const [v, setV] = useState("");

  useEffect(() => { if (ref.current) { ref.current.style.height = "auto"; ref.current.style.height = Math.min(180, ref.current.scrollHeight) + "px"; } }, [v]);
  const submit = () => { if (v.trim()) { onSend(v); setV(""); } };
  return (
    <div className="composer-wrap">
      <div className="composer">
        <textarea ref={ref} placeholder={t.composer_placeholder} value={v}
          onChange={e => setV(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } }}/>
        <div className="tools">
          <button className="icon-btn" title="附件"><Icon name="attach" size={14}/></button>
          <button className="icon-btn" title="技能"><Icon name="skills" size={14}/></button>

        </div>

  );
}

function LoginScreen({ onSignIn, onToast, t }) {
  const [mode, setMode]         = useState("login"); // "login" | "register"
  const [email, setEmail]       = useState("alice@example.com");
  const [password, setPassword] = useState("");
  const [username, setUsername] = useState("");
  const [inviteCode, setInviteCode] = useState("");
  const [loading, setLoading]   = useState(false);
  const [errMsg, setErrMsg]     = useState("");

  async function handleSubmit() {
    setErrMsg("");
    if (!email.trim() || !password.trim()) { setErrMsg("邮箱和密码不能为空"); return; }
    setLoading(true);
    try {
      if (mode === "login") {
        await window.PrismAPI.login(email, password);
        onSignIn();
      } else {
        if (!username.trim()) { setErrMsg("用户名不能为空"); setLoading(false); return; }
        await window.PrismAPI.register({ email, username, password, invite_code: inviteCode || undefined });
        // auto-login after register
        await window.PrismAPI.login(email, password);
        onSignIn();
      }
    } catch (err) {
      const status = err.status;
      if (status === 401) setErrMsg("邮箱或密码错误");
      else if (status === 422) setErrMsg("输入格式有问题,请检查邮箱和密码");
      else setErrMsg(err.message || "登录失败,请重试");
    } finally {
      setLoading(false);
    }
  }

  function handleForgot(e) {
    e.preventDefault();
    if (onToast) onToast({ id: Date.now(), title: "还没做", body: "忘记密码功能还没实现,请联系管理员重置。" });
  }

  return (

            const cs = ["#9B4A35", "#B8803A", "#6B7A4A", "#4E7C6E", "#7A4E58", "#AE8690"];
            return <line key={i} x1="620" y1="440" x2="900" y2={440 + y} stroke={cs[i]} strokeWidth="0.9" opacity="0.75"/>;
          })}
          <circle cx="-50" cy="440" r="3" fill="#E8E4DB"/>
        </svg>
        <div style={{ position: "relative", zIndex: 1 }}>
          <div className="logo" style={{ color: "var(--paper)" }}><PrismMark size={26}/><span style={{ fontSize: 20 }}>Prism · 棱镜</span></div>
        </div>
        <div style={{ position: "relative", zIndex: 1 }}>
          <div className="eyebrow" style={{ color: "rgba(232,228,219,0.55)", marginBottom: 12 }}>No. 04 · 2026</div>

            <em style={{ fontStyle: "italic" }}>Harness</em> 不是胶水,<br/>它是操作系统。

          <p style={{ fontFamily: "var(--serif)", fontSize: 16, color: "rgba(232,228,219,0.75)", maxWidth: 460, marginTop: 20, lineHeight: 1.65 }}>
            把大模型变成可靠、可治理、可扩展的协作者。自托管,协议原生,对每一家 provider 开放。
          </p>

function Tweaks({ tweaks, setTweaks }) {
  const [collapsed, setCollapsed] = useState(false);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const h = e => { if (e.data?.type === "__activate_edit_mode") setVisible(true); if (e.data?.type === "__deactivate_edit_mode") setVisible(false); };
    window.addEventListener("message", h);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", h);
  }, []);
  const up = (k, v) => { setTweaks({ ...tweaks, [k]: v }); window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*"); };
  if (!visible) return null;
  return (
    <div className={`tweaks ${collapsed ? "collapsed" : ""}`}>
      <div className="head" onClick={() => setCollapsed(!collapsed)}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}><PrismMark size={14}/><span style={{ fontFamily: "var(--serif)", fontSize: 14, color: "var(--ink)", fontStyle: "italic" }}>Tweaks</span></div>
        <Icon name="chevron" size={11} style={{ transform: collapsed ? "rotate(90deg)" : "" }}/>
      </div>
      <div className="body">
        <div><div className="label">主题</div><div className="seg">{["light", "dark"].map(v => <button key={v} className={tweaks.theme === v ? "on" : ""} onClick={() => up("theme", v)}>{v}</button>)}</div></div>
        <div><div className="label">密度</div><div className="seg">{["compact", "comfortable", "spacious"].map(v => <button key={v} className={tweaks.density === v ? "on" : ""} onClick={() => up("density", v)}>{v}</button>)}</div></div>
        <div><div className="label">对话气泡圆角</div><div className="seg">{["soft", "softer", "pill"].map(v => <button key={v} className={tweaks.bubble === v ? "on" : ""} onClick={() => up("bubble", v)}>{v}</button>)}</div></div>
        <div><div className="label">语气</div><div className="seg">{["同事", "管家", "冷静"].map(v => <button key={v} className={tweaks.tone === v ? "on" : ""} onClick={() => up("tone", v)}>{v}</button>)}</div></div>
        <div><div className="label">布局</div><div className="seg">{["focus", "split"].map(v => <button key={v} className={tweaks.layout === v ? "on" : ""} onClick={() => up("layout", v)}>{v}</button>)}</div></div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [tweaks, setTweaks] = useState({ theme: "light", density: "comfortable", bubble: "soft", tone: "同事", layout: "split" });
  const [lang, setLang] = useState("zh");
  // screen: "loading" | "login" | "empty" | "app"
  const [screen, setScreen] = useState("loading");
  const [page, setPage] = useState("chat");
  const [showPlan, setShowPlan] = useState(true);
  const [perm, setPerm] = useState(false);
  const [toasts, setToasts] = useState([
    { id: 1, title: "顺手压了一下", body: "Turn 9 的上下文,9.4k → 4.2k。" },
    { id: 2, kind: "danger", title: "护栏响了", body: "数字 '38%' 没出处,让 agent 去找一下。" }
  ]);

  // Auto-restore login from sessionStorage token
  useEffect(() => {
    async function bootstrap() {
      if (window.PrismAPI && window.PrismAPI.isAuthenticated()) {
        try {
          await window.PrismAPI.me();
          setScreen("app");
        } catch {
          setScreen("login");
        }
      } else {
        setScreen("login");
      }
    }
    bootstrap();

    // Redirect to login on unauthorized events from apiClient
    const handler = () => setScreen("login");
    window.addEventListener("prism:unauthorized", handler);
    return () => window.removeEventListener("prism:unauthorized", handler);
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme);
    document.documentElement.setAttribute("data-density", tweaks.density);
  }, [tweaks]);

  // bubble roundness tweak
  useEffect(() => {
    const map = { soft: "18px 18px 6px 18px", softer: "22px 22px 22px 22px", pill: "22px 22px 6px 22px" };
    document.documentElement.style.setProperty("--bubble-radius", map[tweaks.bubble]);
  }, [tweaks.bubble]);

  const t = I18N[lang] || I18N.zh;

  function addToast(toast) {
    setToasts(prev => [...prev, toast]);
  }

  if (screen === "loading") {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: "var(--bg)", gap: 12, color: "var(--ink-3)", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 16 }}>
        <PrismMark size={24}/>正在恢复…
      </div>
    );
  }

  if (screen === "login") {
    return (<><LoginScreen t={t} onSignIn={() => setScreen("app")} onToast={addToast}/><Tweaks tweaks={tweaks} setTweaks={setTweaks}/></>);
  }

  const sidebarMode = tweaks.layout === "split" && page === "chat" && showPlan ? "split" : "normal";

  return (
    <>
      <div className="app" data-sidebar={sidebarMode}>
        <Sidebar page={page} setPage={setPage} t={t}/>
        <main className="main">
          <Topbar page={page} t={t} showPlan={showPlan} setShowPlan={setShowPlan} lang={lang} setLang={setLang} onPerm={() => setPerm(true)}/>
          {screen === "empty" && page === "chat" ? <EmptyChat t={t} onPick={() => setScreen("app")}/> : (<>
            {page === "chat" && <ChatPage t={t}/>}
            {page === "sessions" && <SessionsPage/>}
            {page === "usage" && <UsagePage/>}
            {page === "skills" && <SkillsPage/>}
            {page === "plugins" && <PluginsPage/>}
            {page === "admin" && <AdminPage/>}
            {page === "observability" && <ObsPage/>}
            {page === "settings" && <SettingsPage/>}
          </>)}
          {page !== "chat" && (
            <div className="statusbar">
              <div className="kv"><span>provider</span> <b>anthropic</b></div>
              <div className="kv"><span>模型</span> <b>sonnet-4-5</b></div>
              <div className="kv"><span>缓存</span> <b style={{ color: "var(--teal)" }}>72%</b></div>
              <div style={{ flex: 1 }}/>
              <div className="kv"><span>harness</span> <b style={{ color: "var(--teal)" }}>● active</b></div>
            </div>
          )}
        </main>
        {sidebarMode === "split" && <PlanPanel t={t}/>}
      </div>

      {/* Demo switcher */}
      <div style={{ position: "fixed", top: 14, right: 20, zIndex: 70, display: "flex", gap: 4, background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 999, padding: 4, boxShadow: "var(--shadow-2)" }}>
        <button className="icon-btn" onClick={() => setScreen("login")} title="登录页"><Icon name="arrowRight" size={11} style={{ transform: "rotate(180deg)" }}/></button>
        <button className="icon-btn" onClick={() => { setScreen("empty"); setPage("chat"); }} title="空状态"><Icon name="sparkle" size={11}/></button>
        <button className="icon-btn" onClick={() => setScreen("app")} title="对话"><Icon name="chat" size={11}/></button>
      </div>

      {perm && <PermissionModal t={t} onClose={() => setPerm(false)}/>}
      <Toasts toasts={toasts} onClose={id => setToasts(toasts.filter(x => x.id !== id))}/>
      <Tweaks tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
