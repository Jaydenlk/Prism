/**
 * Group sessions by time bucket relative to now.
 * Returns { today: [], yesterday: [], thisWeek: [], earlier: [] }
 */
function groupByTime(sessions) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfYesterday = new Date(startOfToday - 86400000);
  const startOfWeek = new Date(startOfToday - (now.getDay() || 7) * 86400000);

  const groups = { today: [], yesterday: [], thisWeek: [], earlier: [] };
  const sorted = [...sessions].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  for (const s of sorted) {
    const d = new Date(s.updated_at);
    if (d >= startOfToday) groups.today.push(s);
    else if (d >= startOfYesterday) groups.yesterday.push(s);
    else if (d >= startOfWeek) groups.thisWeek.push(s);
    else groups.earlier.push(s);
  }
  return groups;
}

function formatTime(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfYesterday = new Date(startOfToday - 86400000);
  if (d >= startOfToday) return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  if (d >= startOfYesterday) return "昨天";
  return d.toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
}

/**
 * Render API ContentBlock[] into a displayable structure for Msg.
 * Returns { text, tools }
 */
function renderContentBlocks(blocks, toolResults) {
  if (!Array.isArray(blocks)) return { text: "", tools: [] };
  const texts = [];
  const tools = [];
  // Build a map of tool_result by tool_use_id
  const resultMap = {};
  if (Array.isArray(toolResults)) {
    for (const r of toolResults) {
      if (r.type === "tool_result") resultMap[r.tool_use_id] = r;
    }
  }
  for (const block of blocks) {
    if (block.type === "text") {
      texts.push(block.text);
    } else if (block.type === "thinking") {
      // Show thinking in muted style
      texts.push(`[思考] ${block.thinking}`);
    } else if (block.type === "tool_use") {
      const result = resultMap[block.id];
      tools.push({
        id: block.id,
        name: block.name,
        icon: "terminal",
        status: "ok",
        preview: block.name,
        input: block.input ? JSON.stringify(block.input, null, 2) : "",
        output: result ? (typeof result.content === "string" ? result.content : JSON.stringify(result.content)) : "",
        is_error: result?.is_error || false,
      });
    }
  }
  return { text: texts.join("\n"), tools };
}

  async function loadSessions() {
    try {
      const res = await window.PrismAPI.sessions.list();
      // Defensive: handle both raw array and { items: [] }
      const arr = Array.isArray(res) ? res : (res?.items || res?.sessions || []);
      setSessions(arr);
      setLoadError(false);
    } catch (err) {
      console.warn("[Sidebar] sessions.list() failed:", err);
      setLoadError(true);
    }

    loadSessions();
  }, []);

    try {
      const sess = await window.PrismAPI.sessions.create({ title: "新对话" });

/* ============ PERMISSION MODAL ============ */
function PermissionModal({ onClose, t, permRequest, sessionId, addToast }) {
  const [countdown, setCountdown] = useState(null);
  const [answering, setAnswering] = useState(false);

  useEffect(() => {
    if (!permRequest?.timeout_at) return;
    function tick() {
      const secs = Math.max(0, Math.round((new Date(permRequest.timeout_at) - new Date()) / 1000));
      setCountdown(secs);
      if (secs === 0) onClose();
    }
    tick();
    const iv = setInterval(tick, 1000);
    return () => clearInterval(iv);
  }, [permRequest?.timeout_at]);

  async function answer(decision) {
    if (!sessionId || !permRequest?.request_id) { onClose(); return; }
    setAnswering(true);
    try {
      await window.PrismAPI.sessions.permissionAnswer(sessionId, {
        request_id: permRequest.request_id,
        decision,
      });
      onClose();
    } catch (err) {
      addToast({ id: Date.now(), kind: "danger", title: "回复失败", body: err.message });
      onClose();
    } finally {
      setAnswering(false);
    }
  }

  const toolName = permRequest?.tool_name || "unknown";
  const toolInput = permRequest?.tool_input ? JSON.stringify(permRequest.tool_input, null, 2) : "";
  const reason = permRequest?.reason || t.permissionBody;

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="head">
          <div className="eyebrow" style={{ color: "var(--amber)", marginBottom: 6 }}>
            等一下{countdown !== null && ` · ${countdown}s`}
          </div>
          <div style={{ fontFamily: "var(--serif)", fontSize: 22, color: "var(--ink)", fontWeight: 500, letterSpacing: "-0.01em" }}>{t.permissionTitle}</div>
          <div style={{ fontSize: 13.5, color: "var(--ink-3)", marginTop: 8, fontFamily: "var(--serif)", fontStyle: "italic" }}>{reason}</div>
        </div>
        <div className="body">
          {toolInput && (
            <div style={{ background: "var(--bg)", borderRadius: 12, padding: "14px 16px", fontFamily: "var(--mono)", fontSize: 12.5 }}>
              <div style={{ color: "var(--ink-4)", fontSize: 10.5, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.12em" }}>$ {toolName}</div>
              <pre style={{ color: "var(--ink)", margin: 0, whiteSpace: "pre-wrap", wordBreak: "break-all" }}>{toolInput}</pre>
            </div>
          )}
          {!toolInput && (
            <div style={{ background: "var(--bg)", borderRadius: 12, padding: "14px 16px", fontFamily: "var(--mono)", fontSize: 12.5, color: "var(--ink-3)" }}>
              工具: {toolName}
            </div>
          )}
        </div>
        <div className="foot">
          <button className="btn" onClick={() => answer("deny")} disabled={answering}>{t.deny}</button>
          <button className="btn primary" onClick={() => answer("allow")} disabled={answering}>{t.allow}</button>
        </div>
      </div>
    </div>
  );
}

/* ============ CHAT PAGE ============ */
function ChatPage({ t, sessionId, addToast, setPermRequest, setPerm, setPlanState }) {
  const [msgs, setMsgs] = useState([]);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState(false);
  const [sessionMeta, setSessionMeta] = useState(null);
  const [runActive, setRunActive] = useState(false);

  // SSE ref - holds { es, sessionId }
  const esRef = useRef(null);
  // In-flight streaming buffer: { [message_id]: { text: "", tools: {}, finalContent: null } }
  const streamBuf = useRef({});
  // RAF handle for throttled flush
  const rafHandle = useRef(null);
  // Polling fallback timer handle
  const pollTimerRef = useRef(null);

  // Scroll ref
  const bottomRef = useRef(null);

  function scrollToBottom() {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }

  // Close any open SSE connection
  function closeStream() {
    if (esRef.current) {
      esRef.current.es?.close();
      esRef.current = null;
    }
    if (rafHandle.current) {
      cancelAnimationFrame(rafHandle.current);
      rafHandle.current = null;
    }
    if (pollTimerRef.current) {
      clearTimeout(pollTimerRef.current);
      pollTimerRef.current = null;
    }
  }

  // Flush streaming buffer into React state (throttled via RAF)
  function scheduleFlush() {
    if (rafHandle.current) return; // already scheduled
    rafHandle.current = requestAnimationFrame(() => {
      rafHandle.current = null;
      const buf = streamBuf.current;
      const ids = Object.keys(buf);
      if (!ids.length) return;
      setMsgs(prev => {
        const next = [...prev];
        for (const msgId of ids) {
          const entry = buf[msgId];
          if (entry.finalized) continue;
          const idx = next.findIndex(m => m._streamId === msgId);
          const toolsArr = Object.values(entry.tools);
          if (idx >= 0) {
            next[idx] = { ...next[idx], content: entry.text || "…", tools: toolsArr, streaming: true };
          } else {
            next.push({ _streamId: msgId, role: "agent", at: "now", content: entry.text || "…", tools: toolsArr, streaming: true });
          }
        }
        return next;
      });
      scrollToBottom();
    });
  }

  function openSSE(sid) {
    closeStream();
    streamBuf.current = {};
    const stamp = sid; // session-id stamp to detect stale promises
    window.PrismAPI.openStream(sid, {
      onEvent(evt) {
        // Guard: if session changed while ticket was being minted
        if (!esRef.current || esRef.current.sessionId !== stamp) return;
        handleSSEEvent(evt, sid);
      },
      onError(err) {
        console.warn("[ChatPage] SSE error:", err);
        setRunActive(false);
      },
      onClose() {
        console.log("[ChatPage] SSE closed for session", sid);
        setRunActive(false);
      },
    }).then(es => {
      // Only store if still on same session
      if (esRef.current === null || esRef.current.sessionId === stamp) {
        esRef.current = { es, sessionId: stamp };
      } else {
        es.close(); // stale - we've already switched sessions
      }
    }).catch(err => {
      console.warn("[ChatPage] openStream failed:", err);
    });
    setRunActive(true);
  }

  function handleSSEEvent(evt, sid) {
    const { type } = evt;
    switch (type) {
      case "text_delta": {
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        streamBuf.current[mid].text += evt.text || "";
        scheduleFlush();
        break;
      }
      case "tool_use_delta": {
        // Accumulate partial JSON for a tool call
        const tid = evt.tool_use_id;
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        if (!streamBuf.current[mid].tools[tid]) {
          streamBuf.current[mid].tools[tid] = { id: tid, name: "", icon: "terminal", status: "running", preview: "", input: "", output: "" };
        }
        streamBuf.current[mid].tools[tid].inputPartial = (streamBuf.current[mid].tools[tid].inputPartial || "") + (evt.partial_json || "");
        scheduleFlush();
        break;
      }
      case "tool_start": {
        // A tool is beginning execution
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        streamBuf.current[mid].tools[evt.tool_use_id] = {
          id: evt.tool_use_id,
          name: evt.tool_name,
          icon: "terminal",
          status: "running",
          preview: evt.tool_name,
          input: evt.input ? JSON.stringify(evt.input, null, 2) : "",
          output: "",
        };
        scheduleFlush();
        break;
      }
      case "tool_end": {
        // Tool finished
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        const existing = streamBuf.current[mid].tools[evt.tool_use_id] || {};
        streamBuf.current[mid].tools[evt.tool_use_id] = {
          ...existing,
          status: evt.is_error ? "error" : "ok",
          output: evt.output ? (typeof evt.output === "string" ? evt.output : JSON.stringify(evt.output)) : "",
          duration: evt.duration_ms ? `${evt.duration_ms}ms` : "",
        };
        scheduleFlush();
        break;
      }
      case "message_complete": {
        // Finalize the in-flight message with authoritative content
        const content = evt.content || [];
        const mid = content.find ? content.find(b => b.type === "text")?.text || "" : "";
        // Build tools from tool_use blocks paired with tool_result blocks
        const { text, tools: parsedTools } = renderContentBlocks(content, []);
        setMsgs(prev => {
          const next = [...prev];
          // Find streaming placeholder
          const idx = next.findIndex(m => m.streaming && m.role === "agent");
          const finalMsg = {
            role: evt.role === "user" ? "user" : "agent",
            at: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }),
            content: text || mid,
            tools: parsedTools,
            streaming: false,
          };
          if (idx >= 0) {
            next[idx] = finalMsg;
          } else {
            next.push(finalMsg);
          }
          return next;
        });
        // Mark stream buffer entry as finalized
        for (const key of Object.keys(streamBuf.current)) {
          streamBuf.current[key].finalized = true;
        }
        streamBuf.current = {};
        scrollToBottom();
        break;
      }
      case "run_complete": {
        clearPollFallback();
        setRunActive(false);
        closeStream();
        // Refresh history from DB to ensure we have the authoritative final state
        window.PrismAPI.sessions.listMessages(sid, { limit: 50 }).then(historyRes => {
          const rawMsgs = Array.isArray(historyRes) ? historyRes : (historyRes?.messages || historyRes?.items || []);
          if (rawMsgs.length > 0) {
            const displayMsgs = [];
            let i = 0;
            while (i < rawMsgs.length) {
              const m = rawMsgs[i];
              if (m.role === "user") {
                const textBlocks = (m.content || []).filter(b => b.type === "text");
                displayMsgs.push({ role: "user", at: formatTime(m.created_at), content: textBlocks.map(b => b.text).join("\n") || m.text_preview || "" });
                i++;
              } else if (m.role === "assistant") {
                let toolResults = [];
                if (i + 1 < rawMsgs.length && rawMsgs[i + 1].role === "tool_result") { toolResults = rawMsgs[i + 1].content || []; }
                const { text, tools } = renderContentBlocks(m.content, toolResults);
                displayMsgs.push({ role: "agent", at: formatTime(m.created_at), content: text || m.text_preview || "", tools, streaming: false });
                i++;
                if (toolResults.length > 0) i++;
              } else { i++; }
            }
            // Defense-in-depth: 保留乐观 user 气泡(at=="now")若 DB 未持久化
            // (executor 已在 run 开始时发 message_complete 回调持久化 user prompt,
            //  但 HTTP callback 在 DLQ 兜底场景仍可能丢失 → frontend 合并避免气泡消失)
            setMsgs(prev => {
              const dbUserTexts = new Set(
                displayMsgs.filter(m => m.role === "user").map(m => (m.content || "").trim())
              );
              const optimisticTail = prev.filter(
                m => m.role === "user" && m.at === "now" && !dbUserTexts.has((m.content || "").trim())
              );
              return [...displayMsgs, ...optimisticTail];
            });
            streamBuf.current = {};
            scrollToBottom();
          }
        }).catch(err => console.warn("[ChatPage] post-run history refresh failed:", err));
        break;
      }
      case "run_error": {
        clearPollFallback();
        addToast({ id: Date.now(), kind: "danger", title: "Run 失败", body: evt.error || "未知错误" });
        setRunActive(false);
        closeStream();
        break;
      }
      case "run_crashed": {
        clearPollFallback();
        addToast({ id: Date.now(), kind: "danger", title: "Run 崩溃", body: evt.reason || "进程崩溃,可尝试恢复" });
        setRunActive(false);
        closeStream();
        break;
      }
      case "permission_ask": {
        setPermRequest(evt);
        setPerm(true);
        break;
      }
      case "harness_event": {
        const sub = evt.subtype;
        if (sub === "compaction") {
          addToast({ id: Date.now(), title: "上下文已压缩", body: `${sub}: ${evt.detail?.before_tokens || "?"} → ${evt.detail?.after_tokens || "?"} tokens` });
        } else if (sub === "step_start" || sub === "step_end" || sub === "plan_step") {
          // Handled via coordinator_plan_update; just log
          console.log("[harness_event]", sub, evt.detail);
        } else {
          console.log("[harness_event]", sub, evt.detail);
        }
        break;
      }
      case "coordinator_plan_update": {
        setPlanState({
          plan_json: evt.plan_json,
          current_step: evt.current_step,
          total_steps: evt.total_steps,
          status: evt.status,
          step_results: evt.step_results,
        });
        break;
      }
      case "session_title": {
        if (evt.title && sessionMeta) {
          setSessionMeta(prev => prev ? { ...prev, title: evt.title } : prev);
        }
        break;
      }
      default:
        console.log("[SSE unknown type]", type, evt);
    }
  }

  // Load session + history when sessionId changes
  useEffect(() => {
    if (!sessionId) {
      setMsgs([]);
      setSessionMeta(null);
      setLoadError(false);
      closeStream();
      return;
    }

    let cancelled = false;

    async function load() {
      setLoading(true);
      setLoadError(false);
      setMsgs([]);
      setPlanState(null);
      closeStream();

      try {
        const [meta, historyRes] = await Promise.all([
          window.PrismAPI.sessions.get(sessionId),
          window.PrismAPI.sessions.listMessages(sessionId, { limit: 50 }),
        ]);
        if (cancelled) return;

        setSessionMeta(meta);

        // Defensive: handle array or { items: [] } or { messages: [] }
        const rawMsgs = Array.isArray(historyRes)
          ? historyRes
          : (historyRes?.messages || historyRes?.items || []);

        // Convert API messages to display format
        // Group consecutive assistant messages to pair tool_use with tool_result
        const displayMsgs = [];
        let i = 0;
        while (i < rawMsgs.length) {
          const m = rawMsgs[i];
          if (m.role === "user") {
            const textBlocks = (m.content || []).filter(b => b.type === "text");
            const text = textBlocks.map(b => b.text).join("\n");
            displayMsgs.push({
              role: "user",
              at: formatTime(m.created_at),
              content: text || m.text_preview || "",
            });
            i++;
          } else if (m.role === "assistant") {
            // Collect tool_result from next message if it's a tool_result role
            let toolResults = [];
            if (i + 1 < rawMsgs.length && rawMsgs[i + 1].role === "tool_result") {
              const trMsg = rawMsgs[i + 1];
              toolResults = trMsg.content || [];
              // skip tool_result message since we'll embed it
            }
            const { text, tools } = renderContentBlocks(m.content, toolResults);
            displayMsgs.push({
              role: "agent",
              at: formatTime(m.created_at),
              content: text || m.text_preview || "",
              tools,
            });
            i++;
            // Skip next message only if we consumed it as toolResults
            if (toolResults.length > 0) i++;
          } else {
            // skip tool_use / tool_result / system standalone roles
            i++;
          }
        }

        setMsgs(displayMsgs);

        // Subscribe SSE if session is running
        if (meta.status === "running" && meta.blocking_run_id) {
          openSSE(sessionId);
        }
      } catch (err) {
        if (cancelled) return;
        console.warn("[ChatPage] load session failed:", err);
        setLoadError(true);
      } finally {
        if (!cancelled) setLoading(false);
      }
    }

    load();
    return () => { cancelled = true; closeStream(); };
  }, [sessionId]);

  // Polling fallback: if no SSE message_complete in N seconds, fetch history
  const lastSeqRef = useRef(0);

  function startPollFallback(sid) {
    clearPollFallback();
    pollTimerRef.current = setTimeout(async () => {
      console.log("[ChatPage] SSE fallback: fetching messages from DB", sid);
      try {
        const historyRes = await window.PrismAPI.sessions.listMessages(sid, { limit: 20 });
        const rawMsgs = Array.isArray(historyRes) ? historyRes : (historyRes?.messages || historyRes?.items || []);
        if (rawMsgs.length > 0) {
          const displayMsgs = [];
          let i = 0;
          while (i < rawMsgs.length) {
            const m = rawMsgs[i];
            if (m.role === "user") {
              const textBlocks = (m.content || []).filter(b => b.type === "text");
              displayMsgs.push({ role: "user", at: formatTime(m.created_at), content: textBlocks.map(b => b.text).join("\n") || m.text_preview || "" });
              i++;
            } else if (m.role === "assistant") {
              let toolResults = [];
              if (i + 1 < rawMsgs.length && rawMsgs[i + 1].role === "tool_result") { toolResults = rawMsgs[i + 1].content || []; }
              const { text, tools } = renderContentBlocks(m.content, toolResults);
              displayMsgs.push({ role: "agent", at: formatTime(m.created_at), content: text || m.text_preview || "", tools, streaming: false });
              i++;
              if (toolResults.length > 0) i++;
            } else { i++; }
          }
          setMsgs(displayMsgs);
          // Clear any streaming placeholders
          streamBuf.current = {};
          scrollToBottom();
        }
        setRunActive(false);
      } catch (err) {
        console.warn("[ChatPage] poll fallback failed:", err);
        setRunActive(false);
      }
    }, 6000); // wait 6s for SSE, then fallback
  }

  function clearPollFallback() {
    if (pollTimerRef.current) { clearTimeout(pollTimerRef.current); pollTimerRef.current = null; }
  }

  async function handleSend(prompt) {
    if (!sessionId) return;
    // Optimistic: push user message immediately
    const optMsg = { role: "user", at: "now", content: prompt };
    setMsgs(prev => [...prev, optMsg]);
    setRunActive(true); // show "thinking" state immediately
    scrollToBottom();

    // PRE-SUBSCRIBE SSE before submitting task (fixes race condition where
    // backend completes run before frontend opens EventSource)
    if (!esRef.current || esRef.current.sessionId !== sessionId) {
      openSSE(sessionId);
    }

    try {
      const res = await window.PrismAPI.tasks.submit({ session_id: sessionId, prompt });
      console.log("[ChatPage] task submitted:", res);
      if (res.accepted_type === "immediate") {
        // SSE already pre-subscribed above; start poll fallback as defense-in-depth
        startPollFallback(sessionId);
      } else if (res.accepted_type === "queued_query") {
        addToast({ id: Date.now(), title: "已排队", body: `第 ${res.queue_position || "?"} 位` });
        setRunActive(false);
      }
    } catch (err) {
      addToast({ id: Date.now(), kind: "danger", title: "发送失败", body: err.message });
      // Remove optimistic message on failure
      setMsgs(prev => prev.filter(m => m !== optMsg));
      setRunActive(false);
      clearPollFallback();
    }
  }

  // Empty state when no session is selected
  if (!sessionId) {
    return <EmptyNoSession t={t}/>;
  }

  if (loading) {
    return (
      <div style={{ display: "flex", flex: 1, alignItems: "center", justifyContent: "center", color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic" }}>
        <PrismMark size={20} style={{ marginRight: 10 }}/> 正在加载会话…
      </div>
    );
  }

  if (loadError) {
    return (
      <div style={{ display: "flex", flex: 1, flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12, color: "var(--ink-3)" }}>
        <div style={{ fontFamily: "var(--serif)", fontStyle: "italic" }}>加载失败,后端可能不可用</div>
        <button className="btn" onClick={() => { setLoadError(false); setLoading(true); }}>重试</button>
      </div>
    );
  }

  const showEmpty = msgs.length === 0 && !runActive;

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden" }}>
      <div style={{ flex: 1, overflowY: "auto" }}>
        {showEmpty && (
          <div style={{ display: "flex", flex: 1, alignItems: "center", justifyContent: "center", color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic", padding: 40 }}>
            发送一条消息开始对话
          </div>
        )}
        {msgs.map((m, i) => {
          const prev = msgs[i - 1];
          const first = m.role === "agent" && (!prev || prev.role !== "agent");
          return <Msg key={i} m={m} first={first}/>;
        })}
        {/* "Agent thinking" placeholder when run is active but no streaming yet */}
        {runActive && !msgs.some(m => m.streaming) && (
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 20px", color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 13 }}>
            <PrismMark size={14}/>
            <span>Agent 在思考…</span>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>
      <Composer t={t} onSend={handleSend} disabled={runActive}/>
    </div>
  );
}

function UsagePage() {
  const { PrismAPI } = window;
  const [data, setData] = useState(null);  // null = loading, {} = empty

  useEffect(() => {

        const end = new Date();

        const fmt = (d) => d.toISOString().slice(0, 10);
        const resp = await PrismAPI.providers.usage({ group_by: "day", start_date: fmt(start), end_date: fmt(end) });
        if (cancelled) return;
        setData(resp || {});
      } catch (e) {
        if (!cancelled) setErr(e.message || String(e));
      }
    })();
    return () => { cancelled = true; };
  }, []);

  if (err) return (
    <div className="page">
      <div className="page-head"><div className="page-title">用量</div></div>

  const summary = data.summary || {};

  const totalOut = summary.total_output_tokens ?? 0;
  const cacheHit = summary.cache_hit_ratio ?? 0;
  const savings  = summary.estimated_cache_savings_usd ?? 0;
  const runs     = summary.total_runs ?? 0;
  const fmtTok = (n) => n >= 1e6 ? `${(n/1e6).toFixed(2)}M` : n >= 1e3 ? `${(n/1e3).toFixed(1)}k` : String(n ?? 0);

  return (
    <div className="page">
      <div className="page-head">
        <div className="page-title">用量</div>
        <div className="page-sub">7 天窗口 · Prompt cache 命中率越高，省越多。</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 28 }}>
        <div className="stat-card feature">
          <div className="label">缓存命中</div>
          <div className="val">{(cacheHit * 100).toFixed(1)}<span style={{ fontSize: 20, color: "var(--ink-4)" }}>%</span></div>
          <div className="trend" style={{ color: "var(--ink-3)" }}>cache_hit_tokens / input</div>
        </div>
        <div className="stat-card"><div className="label">7 天 input</div><div className="val">{fmtTok(totalIn)}</div></div>
        <div className="stat-card"><div className="label">7 天 output</div><div className="val">{fmtTok(totalOut)}</div></div>
        <div className="stat-card"><div className="label">省下估算</div><div className="val">${savings.toFixed(2)}</div><div className="trend" style={{ color: "var(--ink-3)" }}>runs: {runs}</div></div>
      </div>
      <div className="section-title">分 Provider</div>
      {byProvider.length === 0 ? (
        <div style={{ color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic", padding: 20 }}>这 7 天还没有任何 run 消耗 tokens。</div>
      ) : (
        <table className="table">
          <thead><tr><th>Provider</th><th>输入</th><th>输出</th><th>缓存命中</th><th>缓存创建</th><th>花费(USD)</th><th>Runs</th></tr></thead>
          <tbody>
            {byProvider.map((p, i) => (
              <tr key={p.provider_id || p.provider_name || i}>
                <td style={{ color: "var(--ink)", fontWeight: 500 }}>{p.provider_name || "(unknown)"}</td>
                <td className="mono">{fmtTok(p.input_tokens ?? 0)}</td>
                <td className="mono">{fmtTok(p.output_tokens ?? 0)}</td>
                <td className="mono" style={{ color: "var(--teal)" }}>{fmtTok(p.cache_hit_tokens ?? 0)}</td>
                <td className="mono">{fmtTok(p.cache_creation_tokens ?? 0)}</td>
                <td className="mono">${(p.cost_usd ?? 0).toFixed(4)}</td>
                <td className="mono" style={{ color: "var(--ink-3)" }}>{p.runs ?? 0}</td>
              </tr>
            ))}
          </tbody>
        </table>
      )}
    </div>
  );
}

function SkillsPage() {
  const { PrismAPI } = window;

  // ── State ──────────────────────────────────────────────────────────────────
  const [searchResults, setSearchResults] = useState([]);
  const [installed, setInstalled] = useState([]);
  const [q, setQ] = useState("");
  const [source, setSource] = useState("all");
  const [searching, setSearching] = useState(false);
  const [searchErr, setSearchErr] = useState("");

  // Install channel: "local_file" | "github" | "custom_md"
  const [installTab, setInstallTab] = useState("local_file");
  const [installing, setInstalling] = useState(false);

  // Local file channel
  const [localFileName, setLocalFileName] = useState("");
  const [localB64, setLocalB64] = useState("");
  const [localSkillName, setLocalSkillName] = useState("");

  // GitHub channel
  const [ghUrl, setGhUrl] = useState("");
  const [ghVersion, setGhVersion] = useState("latest");
  const [ghSkillName, setGhSkillName] = useState("");

  // Custom Markdown channel
  const [mdContent, setMdContent] = useState("---\nname: my-skill\ndescription: 描述这个 Skill 干什么\n---\n\n# My Skill\n\n...");
  const [mdSkillName, setMdSkillName] = useState("my-skill");

  // View modal
  const [viewModal, setViewModal] = useState(null); // { name, content }
  const [viewLoading, setViewLoading] = useState(false);

  // Action loading per installed skill
  const [actionLoading, setActionLoading] = useState(null);

  // Toasts
  const [toasts, setToasts] = useState([]);

  // Debounce timer ref
  const debounceRef = useRef(null);

  // ── Helpers ────────────────────────────────────────────────────────────────
  function addToast(kind, title, body) {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, kind, title, body }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
  }

  function unwrap(resp) {
    // PrismAPI returns { data: [...] } or plain array
    if (resp && resp.data !== undefined) return resp.data;
    return resp;
  }

  // ── Data loaders ───────────────────────────────────────────────────────────
  async function loadInstalled() {
    try {
      const resp = await PrismAPI.skills.listInstalled();
      setInstalled(Array.isArray(unwrap(resp)) ? unwrap(resp) : []);
    } catch { /* non-fatal */ }
  }

  async function doSearch(searchQ, searchSource) {
    setSearching(true);
    setSearchErr("");
    try {
      const resp = await PrismAPI.skills.search({
        q: searchQ || undefined,
        source: searchSource !== "all" ? searchSource : undefined,
        limit: 50,
      });
      setSearchResults(Array.isArray(unwrap(resp)) ? unwrap(resp) : []);
    } catch (err) {
      setSearchErr(err.message || "搜索失败");
      setSearchResults([]);
    }
    setSearching(false);
  }

  useEffect(() => {
    loadInstalled();
    doSearch("", "all");
  }, []);

  // Debounced search on q/source change
  useEffect(() => {
    clearTimeout(debounceRef.current);
    debounceRef.current = setTimeout(() => doSearch(q, source), 300);
    return () => clearTimeout(debounceRef.current);
  }, [q, source]);

  // ── Local file picker ─────────────────────────────────────────────────────
  function handleFilePick(e) {
    const file = e.target.files[0];
    if (!file) return;
    setLocalFileName(file.name);
    const baseName = file.name.replace(/\.[^.]+$/, "");
    if (!localSkillName) setLocalSkillName(baseName);
    const reader = new FileReader();
    reader.onload = ev => setLocalB64(btoa(unescape(encodeURIComponent(ev.target.result))));
    reader.readAsText(file, "utf-8");
  }

  // ── Install handlers ───────────────────────────────────────────────────────
  async function handleLocalInstall() {
    if (!localB64) { addToast("warn", "请先选择文件", ""); return; }
    if (!localSkillName.trim()) { addToast("warn", "请填写技能名", ""); return; }
    setInstalling(true);
    try {
      await PrismAPI.skills.install({ skill_name: localSkillName.trim(), source: "local", content_base64: localB64 });
      addToast("success", "安装成功", localSkillName.trim());
      setLocalB64(""); setLocalFileName(""); setLocalSkillName("");
      await loadInstalled();
    } catch (err) {
      addToast("danger", "安装失败", err.message || String(err));
    }
    setInstalling(false);
  }

  async function handleGithubInstall() {
    if (!ghUrl.trim()) { addToast("warn", "请填写 GitHub URL", ""); return; }
    if (!ghSkillName.trim()) { addToast("warn", "请填写技能名", ""); return; }
    setInstalling(true);
    try {
      await PrismAPI.skills.install({ skill_name: ghSkillName.trim(), source: "github", source_url: ghUrl.trim(), version: ghVersion.trim() || "latest" });
      addToast("success", "安装成功", ghSkillName.trim());
      setGhUrl(""); setGhSkillName(""); setGhVersion("latest");
      await loadInstalled();
    } catch (err) {
      addToast("danger", "安装失败", err.message || String(err));
    }
    setInstalling(false);
  }

  async function handleCustomMdInstall() {
    if (!mdSkillName.trim()) { addToast("warn", "请填写技能名", ""); return; }
    if (!mdContent.trim()) { addToast("warn", "Markdown 内容不能为空", ""); return; }
    setInstalling(true);
    try {
      const b64 = btoa(unescape(encodeURIComponent(mdContent)));
      await PrismAPI.skills.install({ skill_name: mdSkillName.trim(), source: "local", content_base64: b64 });
      addToast("success", "安装成功", mdSkillName.trim());
      await loadInstalled();
    } catch (err) {
      addToast("danger", "安装失败", err.message || String(err));
    }
    setInstalling(false);
  }

  // ── Installed list CRUD ────────────────────────────────────────────────────
  async function handleToggleEnabled(sk) {
    const name = sk.skill_name || sk.name;
    const meta = sk.metadata || {};
    const newEnabled = !meta.enabled;
    setActionLoading(name);
    try {
      await PrismAPI.skills.patch(name, { enabled: newEnabled });
      addToast("success", newEnabled ? "已启用" : "已禁用", name);
      await loadInstalled();
    } catch (err) {
      addToast("danger", "操作失败", err.message || String(err));
    }
    setActionLoading(null);
  }

  async function handleViewContent(sk) {
    const name = sk.skill_name || sk.name;
    setViewModal({ name, content: "加载中…" });
    setViewLoading(true);
    try {
      const resp = await PrismAPI.skills.getContent(name);
      const data = unwrap(resp);
      setViewModal({ name, content: (data && data.content) || "（SKILL.md 内容为空）" });
    } catch (err) {
      setViewModal({ name, content: `加载失败: ${err.message || String(err)}` });
    }
    setViewLoading(false);
  }

  async function handleUninstall(sk) {
    const name = sk.skill_name || sk.name;
    if (!confirm(`确认卸载 "${name}"？`)) return;
    setActionLoading(name);
    try {
      await PrismAPI.skills.uninstall(name);
      addToast("success", "已卸载", name);
      await loadInstalled();
    } catch (err) {
      addToast("danger", "卸载失败", err.message || String(err));
    }
    setActionLoading(null);
  }

  // ── Tab style ──────────────────────────────────────────────────────────────
  function tabStyle(active) {
    return {
      padding: "5px 12px", fontSize: 12, background: "none", border: "none",
      borderBottom: active ? "2px solid var(--ink)" : "2px solid transparent",
      color: active ? "var(--ink)" : "var(--ink-3)", cursor: "pointer", marginBottom: -1,
    };
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  return (
    <div className="page">
      <div className="page-head">
        <div className="page-title">技能市场</div>
        <div className="page-sub">Skill 就是一份 Markdown 加可选钩子。本地装、GitHub 装、自定义 Markdown 都行。</div>
      </div>

        <div style={{ position: "fixed", bottom: 24, right: 24, zIndex: 200, display: "flex", flexDirection: "column", gap: 8 }}>
          {toasts.map(t => (
            <div key={t.id} className={`toast ${t.kind || ""}`} style={{ minWidth: 240 }} onClick={() => setToasts(p => p.filter(x => x.id !== t.id))}>
              <div style={{ flex: 1 }}><div className="title">{t.title}</div><div>{t.body}</div></div>
            </div>
          ))}
        </div>
      )}

      {/* View content modal */}
      {viewModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center" }} onClick={() => setViewModal(null)}>
          <div style={{ background: "var(--paper)", borderRadius: 12, padding: 28, maxWidth: 640, width: "90%", maxHeight: "80vh", display: "flex", flexDirection: "column", gap: 14 }} onClick={e => e.stopPropagation()}>

          {searching ? (
            <div style={{ color: "var(--ink-3)", padding: "16px 0", fontSize: 13 }}>搜索中…</div>
          ) : searchResults.length === 0 ? (
            <div style={{ color: "var(--ink-3)", padding: "16px 0", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 13 }}>
              {q ? `没有找到匹配 "${q}" 的技能` : "暂无可用技能"}
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {searchResults.map((sk, idx) => {
                const name = sk.skill_name || sk.name;
                const isInst = installed.some(s => (s.skill_name || s.name) === name);
                return (
                  <div key={name || idx} className="card" style={{ padding: 16, display: "flex", alignItems: "flex-start", gap: 12 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                        <span className="mono" style={{ fontSize: 13, fontWeight: 500, color: "var(--ink)" }}>{name}</span>
                        {isInst && <span className="badge teal" style={{ fontSize: 10 }}>已安装</span>}
                      </div>
                      <div style={{ fontSize: 12, color: "var(--ink-4)", marginBottom: 6, fontFamily: "var(--mono)" }}>
                        {sk.source || "local"}{sk.version ? ` · v${sk.version}` : ""}{sk.author ? ` · ${sk.author}` : ""}
                      </div>
                      <div style={{ fontSize: 12.5, color: "var(--ink-3)", lineHeight: 1.5, fontFamily: "var(--serif)", fontStyle: "italic" }}>
                        {sk.description || "暂无描述"}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* ── Right: install + installed ─────────────────────────── */}
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          {/* Install panel */}
          <div className="card" style={{ padding: 20 }}>
            <div className="section-title" style={{ marginBottom: 14 }}>安装技能</div>
            <div style={{ borderBottom: "1px solid var(--line)", marginBottom: 16 }}>
              <button data-testid="skill-install-tab-local" style={tabStyle(installTab === "local_file")} onClick={() => setInstallTab("local_file")}>本地文件</button>
              <button data-testid="skill-install-tab-github" style={tabStyle(installTab === "github")} onClick={() => setInstallTab("github")}>GitHub URL</button>
              <button data-testid="skill-install-tab-custom" style={tabStyle(installTab === "custom_md")} onClick={() => setInstallTab("custom_md")}>自定义 MD</button>
            </div>

            {/* Local file */}
            {installTab === "local_file" && (
              <div data-testid="skill-install-panel-local" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <label style={{ cursor: "pointer" }}>
                  <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>选择 SKILL.md 文件</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <div className="input" style={{ flex: 1, color: localFileName ? "var(--ink)" : "var(--ink-4)", cursor: "pointer", display: "flex", alignItems: "center" }}>
                      {localFileName || "点击选择 .md 文件"}
                    </div>
                    <input type="file" accept=".md,.txt" style={{ display: "none" }} onChange={handleFilePick}/>
                  </div>
                </label>
                <label>
                  <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>技能名（唯一标识）</div>
                  <input className="input" value={localSkillName} onChange={e => setLocalSkillName(e.target.value)} placeholder="my-skill"/>
                </label>
                <button className="btn primary" style={{ justifyContent: "center", marginTop: 4 }} onClick={handleLocalInstall} disabled={installing || !localB64}>
                  {installing ? "安装中…" : "安装"}
                </button>
              </div>
            )}

            {/* GitHub URL */}
            {installTab === "github" && (
              <div data-testid="skill-install-panel-github" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <label>
                  <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>GitHub URL</div>
                  <input className="input" value={ghUrl} onChange={e => setGhUrl(e.target.value)} placeholder="https://github.com/user/repo"/>
                </label>
                <label>
                  <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>版本（默认 latest）</div>
                  <input className="input" value={ghVersion} onChange={e => setGhVersion(e.target.value)} placeholder="latest"/>
                </label>
                <label>
                  <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>技能名</div>
                  <input className="input" value={ghSkillName} onChange={e => setGhSkillName(e.target.value)} placeholder="my-skill"/>
                </label>
                <button className="btn primary" style={{ justifyContent: "center", marginTop: 4 }} onClick={handleGithubInstall} disabled={installing}>
                  {installing ? "安装中…" : "安装"}
                </button>
              </div>
            )}

            {/* Custom Markdown */}
            {installTab === "custom_md" && (
              <div data-testid="skill-install-panel-custom" style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <label>
                  <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>技能名</div>
                  <input className="input" value={mdSkillName} onChange={e => setMdSkillName(e.target.value)} placeholder="my-skill"/>
                </label>
                <label>
                  <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>SKILL.md 内容</div>
                  <textarea data-testid="skill-install-textarea" className="input" rows={10} style={{ fontFamily: "var(--mono)", fontSize: 12, resize: "vertical" }} value={mdContent} onChange={e => setMdContent(e.target.value)}/>
                </label>
                <button data-testid="skill-install-submit" className="btn primary" style={{ justifyContent: "center", marginTop: 4 }} onClick={handleCustomMdInstall} disabled={installing}>
                  {installing ? "安装中…" : "安装"}
                </button>
              </div>
            )}
          </div>

          {/* Installed list */}
          <div className="card" style={{ padding: 20 }}>
            <div className="section-title" style={{ marginBottom: 14 }}>已安装 ({installed.length})</div>
            {installed.length === 0 ? (
              <div style={{ fontSize: 13, color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic" }}>暂未安装任何技能</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {installed.map(sk => {
                  const name = sk.skill_name || sk.name;
                  const meta = sk.metadata || {};
                  const enabled = meta.enabled !== false; // default enabled
                  const acting = actionLoading === name;
                  return (
                    <div key={name} style={{ borderRadius: 8, border: "1px solid var(--line)", padding: "10px 14px", display: "flex", alignItems: "center", gap: 10, background: enabled ? "var(--paper)" : "var(--bg)" }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13, fontWeight: 500, color: enabled ? "var(--ink)" : "var(--ink-4)" }}>{name}</div>
                        <div style={{ fontSize: 11, color: "var(--ink-4)", fontFamily: "var(--mono)" }}>v{sk.version || "1.0.0"} · {sk.source || "local"}</div>
                      </div>
                      <div style={{ display: "flex", gap: 5, flexShrink: 0 }}>
                        <button className="btn sm ghost" onClick={() => handleToggleEnabled(sk)} disabled={acting} title={enabled ? "禁用" : "启用"}>
                          {enabled ? "禁用" : "启用"}
                        </button>
                        <button className="btn sm ghost" onClick={() => handleViewContent(sk)} disabled={acting} title="查看 SKILL.md">
                          查看
                        </button>
                        <button className="btn sm danger" onClick={() => handleUninstall(sk)} disabled={acting} title="卸载">
                          {acting ? "…" : "卸载"}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function PluginsPage() {
  const { PrismAPI } = window;

  // ── Builder state (left pane) ───────────────────────────────────────────
  const [builderMsgs, setBuilderMsgs] = useState([]);
  const [builderSessionId, setBuilderSessionId] = useState(null);
  const [builderRunning, setBuilderRunning] = useState(false);
  const [builderProgress, setBuilderProgress] = useState(0); // 0-100
  const [pendingManifest, setPendingManifest] = useState(null); // { yaml, json, name, version, description } — triggers save modal

  // ── Library state (right pane) ──────────────────────────────────────────
  const [library, setLibrary] = useState([]);
  const [libraryLoading, setLibraryLoading] = useState(false);
  const [viewManifest, setViewManifest] = useState(null); // { name, yaml }
  const [actionLoading, setActionLoading] = useState(null); // plugin id

  // ── Save modal state ────────────────────────────────────────────────────
  const [saveModal, setSaveModal] = useState(false);
  const [saveName, setSaveName] = useState("");
  const [saveDesc, setSaveDesc] = useState("");
  const [saveYaml, setSaveYaml] = useState("");
  const [saving, setSaving] = useState(false);
  const yamlManuallyEdited = useRef(false); // true when user edited YAML in modal (desync guard)

  // ── Toasts ─────────────────────────────────────────────────────────────
  const [toasts, setToasts] = useState([]);

  // ── Refs ────────────────────────────────────────────────────────────────
  const esRef = useRef(null);
  const streamBuf = useRef({});
  const rafHandle = useRef(null);
  const bottomRef = useRef(null);

  // ── Helpers ────────────────────────────────────────────────────────────
  function addToast(kind, title, body) {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, kind, title, body }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 5000);
  }

  function scrollBottom() { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }

  // ── Library loader ─────────────────────────────────────────────────────
  async function loadLibrary() {
    setLibraryLoading(true);
    try {
      const resp = await PrismAPI.plugins.listLibrary();
      setLibrary(Array.isArray(resp) ? resp : []);
    } catch (err) {
      addToast("warn", "插件库加载失败", err.message || String(err));
    }
    setLibraryLoading(false);
  }

  useEffect(() => { loadLibrary(); }, []);

  // ── SSE streaming (builder) ────────────────────────────────────────────
  function closeStream() {
    if (esRef.current) { esRef.current.es?.close(); esRef.current = null; }
    if (rafHandle.current) { cancelAnimationFrame(rafHandle.current); rafHandle.current = null; }
  }

  function scheduleFlush() {
    if (rafHandle.current) return;
    rafHandle.current = requestAnimationFrame(() => {
      rafHandle.current = null;
      const buf = streamBuf.current;
      const ids = Object.keys(buf);
      if (!ids.length) return;
      setBuilderMsgs(prev => {
        const next = [...prev];
        for (const msgId of ids) {
          const entry = buf[msgId];
          if (entry.finalized) continue;
          const idx = next.findIndex(m => m._streamId === msgId);
          if (idx >= 0) {
            next[idx] = { ...next[idx], content: entry.text || "…", streaming: true };
          } else {
            next.push({ _streamId: msgId, role: "agent", at: "now", content: entry.text || "…", streaming: true });
          }
        }
        return next;
      });
      scrollBottom();
    });
  }

  function handleSSEEvent(evt) {
    switch (evt.type) {
      case "text_delta": {
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", finalized: false };
        streamBuf.current[mid].text += evt.text || "";
        scheduleFlush();
        break;
      }
      case "message_complete": {
        const blocks = Array.isArray(evt.content) ? evt.content : [];
        const text = blocks.filter(b => b.type === "text").map(b => b.text).join("\n");
        setBuilderMsgs(prev => {
          const next = prev.filter(m => !m.streaming);
          next.push({ role: "agent", at: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }), content: text || "…", streaming: false });
          return next;
        });
        for (const k of Object.keys(streamBuf.current)) streamBuf.current[k].finalized = true;
        streamBuf.current = {};
        scrollBottom();
        break;
      }
      case "harness_event": {
        // Track completion percentage from step events
        if (evt.subtype === "step") {
          const pct = typeof evt.completion_pct === "number" ? evt.completion_pct : null;
          if (pct !== null) setBuilderProgress(Math.round(pct));
        }
        // Plugin manifest ready
        if (evt.subtype === "plugin_manifest_ready") {
          const data = evt.data || {};
          setPendingManifest({
            name: data.name || "my-plugin",
            version: data.version || "1.0.0",
            description: data.description || "",
            yaml: data.manifest_yaml || "",
            json: data.manifest_json || {},
          });
          setSaveName(data.name || "my-plugin");
          setSaveDesc(data.description || "");
          setSaveYaml(data.manifest_yaml || "");
          yamlManuallyEdited.current = false;
          setSaveModal(true);
        }
        break;
      }
      case "run_complete":
      case "run_crashed":
      case "run_error":
        setBuilderRunning(false);
        break;
      default:
        break;
    }
  }

  function openBuilderStream(sid) {
    closeStream();
    streamBuf.current = {};
    PrismAPI.openStream(sid, {
      onEvent(evt) {
        if (!esRef.current || esRef.current.sessionId !== sid) return;
        handleSSEEvent(evt);
      },
      onError(err) { console.warn("[PluginsPage] SSE error:", err); setBuilderRunning(false); },
      onClose() { setBuilderRunning(false); },
    }).then(es => {
      if (!esRef.current || esRef.current.sessionId === sid) {
        esRef.current = { es, sessionId: sid };
      } else {
        es.close();
      }
    }).catch(err => {
      console.warn("[PluginsPage] openStream failed:", err);
      setBuilderRunning(false);
    });
    setBuilderRunning(true);
  }

  // ── Send message to plugin builder ─────────────────────────────────────
  async function handleBuilderSend(text) {
    if (!text.trim() || builderRunning) return;

    // Add user message
    setBuilderMsgs(prev => [...prev, {
      role: "user",
      at: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }),
      content: text,
    }]);
    scrollBottom();

    try {
      let sid = builderSessionId;

      if (!sid) {
        // Create a new session for the builder
        const sessResp = await PrismAPI.sessions.create({ title: "Plugin Builder" });
        const sess = sessResp.data || sessResp;
        sid = sess.id || sess.session_id;
        setBuilderSessionId(sid);
        setBuilderProgress(0);
      }

      // Submit task with agent_type=plugin_builder so TaskRouter routes to plugin builder
      await PrismAPI.tasks.submit({ session_id: sid, prompt: text, agent_type: "plugin_builder" });

      // Open SSE stream
      openBuilderStream(sid);
    } catch (err) {
      addToast("danger", "发送失败", err.message || String(err));
      setBuilderRunning(false);
    }
  }

  // ── Library CRUD ───────────────────────────────────────────────────────
  async function handleTogglePlugin(plugin) {
    setActionLoading(plugin.id);
    try {
      await PrismAPI.plugins.patch(plugin.id, { enabled: !plugin.enabled });
      addToast("success", plugin.enabled ? "已禁用" : "已启用", plugin.name);
      await loadLibrary();
    } catch (err) {
      addToast("danger", "操作失败", err.message || String(err));
    }
    setActionLoading(null);
  }

  async function handleDeletePlugin(plugin) {
    if (!confirm(`确认删除插件 "${plugin.name}"？`)) return;
    setActionLoading(plugin.id);
    try {
      await PrismAPI.plugins.delete(plugin.id);
      addToast("success", "已删除", plugin.name);
      await loadLibrary();
    } catch (err) {
      addToast("danger", "删除失败", err.message || String(err));
    }
    setActionLoading(null);
  }

  // ── Save manifest to library ───────────────────────────────────────────
  async function handleSaveToLibrary() {
    if (!saveName.trim()) { addToast("warn", "请填写插件名", ""); return; }
    setSaving(true);
    try {
      // If user manually edited YAML, manifest_json is stale — send {} so backend re-parses from YAML
      const manifestJson = yamlManuallyEdited.current ? {} : (pendingManifest?.json || {});
      await PrismAPI.plugins.save({
        name: saveName.trim(),
        version: pendingManifest?.version || "1.0.0",
        description: saveDesc.trim(),
        manifest_yaml: saveYaml,
        manifest_json: manifestJson,
      });
      addToast("success", "已保存到插件库", saveName.trim());
      setSaveModal(false);
      setPendingManifest(null);
      yamlManuallyEdited.current = false;
      await loadLibrary();
    } catch (err) {
      addToast("danger", "保存失败", err.message || String(err));
    }
    setSaving(false);
  }

  // ── Open save modal pre-filled from last agent message ───────────────
  function openSaveModalFromLastMsg() {
    // builderMsgs use role="agent" and field=".content" (set by scheduleFlush/message_complete)
    const lastAgent = [...builderMsgs].reverse().find(m => m.role === "agent" && !m.streaming);
    const rawText = lastAgent?.content || "";
    // Extract fenced YAML block if present, otherwise use raw text
    const yamlMatch = rawText.match(/```ya?ml\s*([\s\S]*?)```/i);
    const extracted = yamlMatch ? yamlMatch[1].trim() : rawText.trim();
    setSaveName("");
    setSaveDesc("");
    setSaveYaml(extracted);
    setPendingManifest(null);
    yamlManuallyEdited.current = false;
    setSaveModal(true);
  }

  // ── Cleanup on unmount ─────────────────────────────────────────────────
  useEffect(() => () => closeStream(), []);

  // ── Render ─────────────────────────────────────────────────────────────
  return (
    <div className="page" style={{ paddingBottom: 0 }}>
      <div className="page-head">
        <div className="page-title">插件工坊</div>
        <div className="page-sub">与 Plugin Builder Agent 对话，自动构建 Plugin manifest；完成后一键保存到插件库。</div>
      </div>

      {/* Toast stack */}
      {toasts.length > 0 && (
        <div style={{ position: "fixed", bottom: 24, right: 24, zIndex: 300, display: "flex", flexDirection: "column", gap: 8 }}>
          {toasts.map(t => (
            <div key={t.id} className={`toast ${t.kind || ""}`} style={{ minWidth: 240 }} onClick={() => setToasts(p => p.filter(x => x.id !== t.id))}>
              <div style={{ flex: 1 }}><div className="title">{t.title}</div><div>{t.body}</div></div>
            </div>
          ))}
        </div>
      )}

      {/* Save manifest modal */}
      {saveModal && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 400, display: "flex", alignItems: "center", justifyContent: "center" }} onClick={() => setSaveModal(false)}>
          <div style={{ background: "var(--paper)", borderRadius: 12, padding: 28, maxWidth: 560, width: "90%", display: "flex", flexDirection: "column", gap: 14 }} onClick={e => e.stopPropagation()}>
            <div style={{ fontWeight: 600, fontSize: 15 }}>保存到插件库</div>
            <label>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>插件名（唯一标识）</div>
              <input className="input" value={saveName} onChange={e => setSaveName(e.target.value)}/>
            </label>
            <label>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>描述</div>
              <input className="input" value={saveDesc} onChange={e => setSaveDesc(e.target.value)}/>
            </label>
            <label>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>Manifest YAML（可编辑）</div>
              <textarea className="input" rows={10} style={{ fontFamily: "var(--mono)", fontSize: 12, resize: "vertical" }} value={saveYaml} onChange={e => { yamlManuallyEdited.current = true; setSaveYaml(e.target.value); }}/>
            </label>
            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <button className="btn primary" style={{ flex: 1, justifyContent: "center" }} onClick={handleSaveToLibrary} disabled={saving}>
                {saving ? "保存中…" : "保存到插件库"}
              </button>
              <button className="btn ghost" onClick={() => setSaveModal(false)}>取消</button>
            </div>
          </div>
        </div>
      )}

      {/* View manifest modal */}
      {viewManifest && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 400, display: "flex", alignItems: "center", justifyContent: "center" }} onClick={() => setViewManifest(null)}>
          <div style={{ background: "var(--paper)", borderRadius: 12, padding: 28, maxWidth: 560, width: "90%", maxHeight: "80vh", display: "flex", flexDirection: "column", gap: 14 }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ fontWeight: 600, fontSize: 15 }}>{viewManifest.name} / manifest.yaml</div>
              <button className="btn ghost sm" onClick={() => setViewManifest(null)}>关闭</button>
            </div>
            <pre style={{ flex: 1, overflow: "auto", fontSize: 12.5, lineHeight: 1.6, fontFamily: "var(--mono)", background: "var(--bg)", borderRadius: 8, padding: "12px 14px", margin: 0, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
              {viewManifest.yaml || "（manifest 为空）"}
            </pre>
          </div>
        </div>
      )}

      {/* Main two-pane layout */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 380px", gap: 20, height: "calc(100vh - 200px)", minHeight: 500 }}>

        {/* ── Left pane: Conversational builder ─────────────────── */}
        <div style={{ display: "flex", flexDirection: "column", background: "var(--paper)", borderRadius: 12, border: "1px solid var(--line)", overflow: "hidden" }}>
          {/* Header */}
          <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 500, color: "var(--ink)" }}>Plugin Builder Agent</div>
              <div style={{ fontSize: 11, color: "var(--ink-4)", fontFamily: "var(--mono)" }}>
                {builderSessionId ? `session: ${builderSessionId.slice(-8)}` : "新对话"}
              </div>
            </div>
            {builderProgress > 0 && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "var(--ink-3)" }}>
                <div className="progress" style={{ width: 80 }}>
                  <div className="bar" style={{ width: `${builderProgress}%`, background: builderProgress >= 80 ? "var(--teal)" : "var(--amber)" }}/>
                </div>
                <span>完成度 {builderProgress}%</span>
              </div>
            )}
            {builderSessionId && (
              <button className="btn ghost sm" onClick={() => {
                closeStream();
                setBuilderSessionId(null);
                setBuilderMsgs([]);
                setBuilderProgress(0);
                setBuilderRunning(false);
              }}>新建</button>
            )}
          </div>

          {/* Messages */}
          <div style={{ flex: 1, overflow: "auto", padding: "16px 20px", display: "flex", flexDirection: "column", gap: 0 }}>
            {builderMsgs.length === 0 && (
              <div style={{ margin: "auto", textAlign: "center", color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 14, padding: 32 }}>
                告诉 Agent 你想构建什么 Plugin——<br/>它会问你几个问题，然后生成 manifest。
              </div>
            )}
            {builderMsgs.map((m, i) => (
              <Msg key={i} m={m} first={i === 0 || builderMsgs[i - 1]?.role !== m.role}/>
            ))}
            <div ref={bottomRef}/>
          </div>

          {/* Manual save button — fallback for when plugin_manifest_ready event is never emitted */}
          {builderMsgs.length > 0 && !builderRunning && (
            <div style={{ padding: "8px 16px", borderTop: "1px solid var(--line)", display: "flex", justifyContent: "flex-end" }}>
              <button className="btn ghost sm" style={{ color: "var(--teal)", borderColor: "var(--teal)" }} onClick={openSaveModalFromLastMsg}>
                <Icon name="pin" size={13}/> 保存到插件库
              </button>
            </div>
          )}

          {/* Composer */}
          <div style={{ borderTop: "1px solid var(--line)" }}>
            <Composer t={{ composer_placeholder: "描述你想构建的 Plugin，例如：金融研究助手，含合规 Skill 和 MCP…" }} onSend={handleBuilderSend} disabled={builderRunning}/>
          </div>
        </div>

        {/* ── Right pane: Plugin library ─────────────────────────── */}
        <div style={{ display: "flex", flexDirection: "column", background: "var(--paper)", borderRadius: 12, border: "1px solid var(--line)", overflow: "hidden" }}>
          <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, fontSize: 13, fontWeight: 500, color: "var(--ink)" }}>插件库 ({library.length})</div>
            <button className="btn ghost sm" onClick={loadLibrary} disabled={libraryLoading}>
              {libraryLoading ? "…" : "刷新"}
            </button>
          </div>
          <div style={{ flex: 1, overflow: "auto", padding: "12px 16px", display: "flex", flexDirection: "column", gap: 10 }}>
            {library.length === 0 && !libraryLoading && (
              <div style={{ color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 13, padding: "16px 0" }}>
                暂无保存的插件。通过左侧对话构建 Plugin，完成后保存到这里。
              </div>
            )}
            {library.map(plugin => {
              const acting = actionLoading === plugin.id;
              return (
                <div key={plugin.id} style={{ borderRadius: 8, border: "1px solid var(--line)", padding: "12px 14px", background: plugin.enabled ? "var(--paper)" : "var(--bg)" }}>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 6 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 500, color: plugin.enabled ? "var(--ink)" : "var(--ink-4)" }}>{plugin.name}</div>
                      <div style={{ fontSize: 11, color: "var(--ink-4)", fontFamily: "var(--mono)" }}>v{plugin.version}</div>
                    </div>
                    {plugin.enabled ? <span className="badge teal" style={{ fontSize: 10 }}>启用</span> : <span className="badge" style={{ fontSize: 10 }}>禁用</span>}
                  </div>
                  {plugin.description && (
                    <div style={{ fontSize: 12, color: "var(--ink-3)", marginBottom: 8, lineHeight: 1.4, fontFamily: "var(--serif)", fontStyle: "italic" }}>{plugin.description}</div>
                  )}
                  <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
                    <button className="btn sm ghost" onClick={() => handleTogglePlugin(plugin)} disabled={acting}>
                      {plugin.enabled ? "禁用" : "启用"}
                    </button>
                    <button className="btn sm ghost" onClick={() => setViewManifest({ name: plugin.name, yaml: plugin.manifest_yaml })} disabled={acting}>
                      查看 Manifest
                    </button>
                    <button className="btn sm danger" onClick={() => handleDeletePlugin(plugin)} disabled={acting}>
                      {acting ? "…" : "删除"}
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}
