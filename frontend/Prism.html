/**
 * Group sessions by time bucket relative to now.
 * Returns { today: [], yesterday: [], thisWeek: [], earlier: [] }
 */
function groupByTime(sessions) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfYesterday = new Date(startOfToday - 86400000);
  const startOfWeek = new Date(startOfToday - (now.getDay() || 7) * 86400000);

  const groups = { today: [], yesterday: [], thisWeek: [], earlier: [] };
  const sorted = [...sessions].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
  for (const s of sorted) {
    const d = new Date(s.updated_at);
    if (d >= startOfToday) groups.today.push(s);
    else if (d >= startOfYesterday) groups.yesterday.push(s);
    else if (d >= startOfWeek) groups.thisWeek.push(s);
    else groups.earlier.push(s);
  }
  return groups;
}

function formatTime(isoStr) {
  if (!isoStr) return "";
  const d = new Date(isoStr);
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfYesterday = new Date(startOfToday - 86400000);
  if (d >= startOfToday) return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  if (d >= startOfYesterday) return "昨天";
  return d.toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
}

/**
 * Render API ContentBlock[] into a displayable structure for Msg.
 * Returns { text, tools }
 */
function renderContentBlocks(blocks, toolResults) {
  if (!Array.isArray(blocks)) return { text: "", tools: [] };
  const texts = [];
  const tools = [];
  // Build a map of tool_result by tool_use_id
  const resultMap = {};
  if (Array.isArray(toolResults)) {
    for (const r of toolResults) {
      if (r.type === "tool_result") resultMap[r.tool_use_id] = r;
    }
  }
  for (const block of blocks) {
    if (block.type === "text") {
      texts.push(block.text);
    } else if (block.type === "thinking") {
      // Show thinking in muted style
      texts.push(`[思考] ${block.thinking}`);
    } else if (block.type === "tool_use") {
      const result = resultMap[block.id];
      tools.push({
        id: block.id,
        name: block.name,
        icon: "terminal",
        status: "ok",
        preview: block.name,
        input: block.input ? JSON.stringify(block.input, null, 2) : "",
        output: result ? (typeof result.content === "string" ? result.content : JSON.stringify(result.content)) : "",
        is_error: result?.is_error || false,
      });
    }
  }
  return { text: texts.join("\n"), tools };
}

  const [sessions, setSessions] = useState([]);
  const [loadError, setLoadError] = useState(false);

  // Load sessions from API
  async function loadSessions() {
    try {
      const res = await window.PrismAPI.sessions.list();
      // Defensive: handle both raw array and { items: [] }
      const arr = Array.isArray(res) ? res : (res?.items || res?.sessions || []);
      setSessions(arr);
      setLoadError(false);
    } catch (err) {
      console.warn("[Sidebar] sessions.list() failed:", err);
      setLoadError(true);
    }
  }

  useEffect(() => {
    loadSessions();
  }, []);

    try {
      const sess = await window.PrismAPI.sessions.create({ title: "新对话" });
      setSessions(prev => [sess, ...prev]);
      setCurrentSessionId(sess.id);

/* ============ PERMISSION MODAL ============ */
function PermissionModal({ onClose, t, permRequest, sessionId, addToast }) {
  const [countdown, setCountdown] = useState(null);
  const [answering, setAnswering] = useState(false);

  useEffect(() => {
    if (!permRequest?.timeout_at) return;
    function tick() {
      const secs = Math.max(0, Math.round((new Date(permRequest.timeout_at) - new Date()) / 1000));
      setCountdown(secs);
      if (secs === 0) onClose();
    }
    tick();
    const iv = setInterval(tick, 1000);
    return () => clearInterval(iv);
  }, [permRequest?.timeout_at]);

  async function answer(decision) {
    if (!sessionId || !permRequest?.request_id) { onClose(); return; }
    setAnswering(true);
    try {
      await window.PrismAPI.sessions.permissionAnswer(sessionId, {
        request_id: permRequest.request_id,
        decision,
      });
      onClose();
    } catch (err) {
      addToast({ id: Date.now(), kind: "danger", title: "回复失败", body: err.message });
      onClose();
    } finally {
      setAnswering(false);
    }
  }

  const toolName = permRequest?.tool_name || "unknown";
  const toolInput = permRequest?.tool_input ? JSON.stringify(permRequest.tool_input, null, 2) : "";
  const reason = permRequest?.reason || t.permissionBody;

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="head">
          <div className="eyebrow" style={{ color: "var(--amber)", marginBottom: 6 }}>
            等一下{countdown !== null && ` · ${countdown}s`}
          </div>
          <div style={{ fontFamily: "var(--serif)", fontSize: 22, color: "var(--ink)", fontWeight: 500, letterSpacing: "-0.01em" }}>{t.permissionTitle}</div>
          <div style={{ fontSize: 13.5, color: "var(--ink-3)", marginTop: 8, fontFamily: "var(--serif)", fontStyle: "italic" }}>{reason}</div>
        </div>
        <div className="body">
          {toolInput && (
            <div style={{ background: "var(--bg)", borderRadius: 12, padding: "14px 16px", fontFamily: "var(--mono)", fontSize: 12.5 }}>
              <div style={{ color: "var(--ink-4)", fontSize: 10.5, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.12em" }}>$ {toolName}</div>
              <pre style={{ color: "var(--ink)", margin: 0, whiteSpace: "pre-wrap", wordBreak: "break-all" }}>{toolInput}</pre>
            </div>
          )}
          {!toolInput && (
            <div style={{ background: "var(--bg)", borderRadius: 12, padding: "14px 16px", fontFamily: "var(--mono)", fontSize: 12.5, color: "var(--ink-3)" }}>
              工具: {toolName}
            </div>
          )}
        </div>
        <div className="foot">
          <button className="btn" onClick={() => answer("deny")} disabled={answering}>{t.deny}</button>
          <button className="btn primary" onClick={() => answer("allow")} disabled={answering}>{t.allow}</button>
        </div>
      </div>
    </div>
  );
}

/* ============ CHAT PAGE ============ */
function ChatPage({ t, sessionId, addToast, setPermRequest, setPerm, setPlanState }) {
  const [msgs, setMsgs] = useState([]);
  const [loading, setLoading] = useState(false);
  const [loadError, setLoadError] = useState(false);
  const [sessionMeta, setSessionMeta] = useState(null);
  const [runActive, setRunActive] = useState(false);

  // SSE ref - holds { es, sessionId }
  const esRef = useRef(null);
  // In-flight streaming buffer: { [message_id]: { text: "", tools: {}, finalContent: null } }
  const streamBuf = useRef({});
  // RAF handle for throttled flush
  const rafHandle = useRef(null);

  // Scroll ref
  const bottomRef = useRef(null);

  function scrollToBottom() {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }

  // Close any open SSE connection
  function closeStream() {
    if (esRef.current) {
      esRef.current.es?.close();
      esRef.current = null;
    }
    if (rafHandle.current) {
      cancelAnimationFrame(rafHandle.current);
      rafHandle.current = null;
    }
  }

  // Flush streaming buffer into React state (throttled via RAF)
  function scheduleFlush() {
    if (rafHandle.current) return; // already scheduled
    rafHandle.current = requestAnimationFrame(() => {
      rafHandle.current = null;
      const buf = streamBuf.current;
      const ids = Object.keys(buf);
      if (!ids.length) return;
      setMsgs(prev => {
        const next = [...prev];
        for (const msgId of ids) {
          const entry = buf[msgId];
          if (entry.finalized) continue;
          const idx = next.findIndex(m => m._streamId === msgId);
          const toolsArr = Object.values(entry.tools);
          if (idx >= 0) {
            next[idx] = { ...next[idx], content: entry.text || "…", tools: toolsArr, streaming: true };
          } else {
            next.push({ _streamId: msgId, role: "agent", at: "now", content: entry.text || "…", tools: toolsArr, streaming: true });
          }
        }
        return next;
      });
      scrollToBottom();
    });
  }

  function openSSE(sid) {
    closeStream();
    streamBuf.current = {};
    const stamp = sid; // session-id stamp to detect stale promises
    window.PrismAPI.openStream(sid, {
      onEvent(evt) {
        // Guard: if session changed while ticket was being minted
        if (!esRef.current || esRef.current.sessionId !== stamp) return;
        handleSSEEvent(evt, sid);
      },
      onError(err) {
        console.warn("[ChatPage] SSE error:", err);
        setRunActive(false);
      },
      onClose() {
        console.log("[ChatPage] SSE closed for session", sid);
        setRunActive(false);
      },
    }).then(es => {
      // Only store if still on same session
      if (esRef.current === null || esRef.current.sessionId === stamp) {
        esRef.current = { es, sessionId: stamp };
      } else {
        es.close(); // stale - we've already switched sessions
      }
    }).catch(err => {
      console.warn("[ChatPage] openStream failed:", err);
    });
    setRunActive(true);
  }

  function handleSSEEvent(evt, sid) {
    const { type } = evt;
    switch (type) {
      case "text_delta": {
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        streamBuf.current[mid].text += evt.text || "";
        scheduleFlush();
        break;
      }
      case "tool_use_delta": {
        // Accumulate partial JSON for a tool call
        const tid = evt.tool_use_id;
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        if (!streamBuf.current[mid].tools[tid]) {
          streamBuf.current[mid].tools[tid] = { id: tid, name: "", icon: "terminal", status: "running", preview: "", input: "", output: "" };
        }
        streamBuf.current[mid].tools[tid].inputPartial = (streamBuf.current[mid].tools[tid].inputPartial || "") + (evt.partial_json || "");
        scheduleFlush();
        break;
      }
      case "tool_start": {
        // A tool is beginning execution
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        streamBuf.current[mid].tools[evt.tool_use_id] = {
          id: evt.tool_use_id,
          name: evt.tool_name,
          icon: "terminal",
          status: "running",
          preview: evt.tool_name,
          input: evt.input ? JSON.stringify(evt.input, null, 2) : "",
          output: "",
        };
        scheduleFlush();
        break;
      }
      case "tool_end": {
        // Tool finished
        const mid = evt.message_id || "default";
        if (!streamBuf.current[mid]) streamBuf.current[mid] = { text: "", tools: {}, finalized: false };
        const existing = streamBuf.current[mid].tools[evt.tool_use_id] || {};
        streamBuf.current[mid].tools[evt.tool_use_id] = {
          ...existing,
          status: evt.is_error ? "error" : "ok",
          output: evt.output ? (typeof evt.output === "string" ? evt.output : JSON.stringify(evt.output)) : "",
          duration: evt.duration_ms ? `${evt.duration_ms}ms` : "",
        };
        scheduleFlush();
        break;
      }
      case "message_complete": {
        // Finalize the in-flight message with authoritative content
        const content = evt.content || [];
        const mid = content.find ? content.find(b => b.type === "text")?.text || "" : "";
        // Build tools from tool_use blocks paired with tool_result blocks
        const { text, tools: parsedTools } = renderContentBlocks(content, []);
        setMsgs(prev => {
          const next = [...prev];
          // Find streaming placeholder
          const idx = next.findIndex(m => m.streaming && m.role === "agent");
          const finalMsg = {
            role: evt.role === "user" ? "user" : "agent",
            at: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }),
            content: text || mid,
            tools: parsedTools,
            streaming: false,
          };
          if (idx >= 0) {
            next[idx] = finalMsg;
          } else {
            next.push(finalMsg);
          }
          return next;
        });
        // Mark stream buffer entry as finalized
        for (const key of Object.keys(streamBuf.current)) {
          streamBuf.current[key].finalized = true;
        }
        streamBuf.current = {};
        scrollToBottom();
        break;
      }
      case "run_complete": {
        setRunActive(false);
        closeStream();
        break;
      }
      case "run_error": {
        addToast({ id: Date.now(), kind: "danger", title: "Run 失败", body: evt.error || "未知错误" });
        setRunActive(false);
        closeStream();
        break;
      }
      case "run_crashed": {
        addToast({ id: Date.now(), kind: "danger", title: "Run 崩溃", body: evt.reason || "进程崩溃,可尝试恢复" });
        setRunActive(false);
        closeStream();
        break;
      }
      case "permission_ask": {
        setPermRequest(evt);
        setPerm(true);
        break;
      }
      case "harness_event": {
        const sub = evt.subtype;
        if (sub === "compaction") {
          addToast({ id: Date.now(), title: "上下文已压缩", body: `${sub}: ${evt.detail?.before_tokens || "?"} → ${evt.detail?.after_tokens || "?"} tokens` });
        } else if (sub === "step_start" || sub === "step_end" || sub === "plan_step") {
          // Handled via coordinator_plan_update; just log
          console.log("[harness_event]", sub, evt.detail);
        } else {
          console.log("[harness_event]", sub, evt.detail);
        }
        break;
      }
      case "coordinator_plan_update": {
        setPlanState({
          plan_json: evt.plan_json,
          current_step: evt.current_step,
          total_steps: evt.total_steps,
          status: evt.status,
          step_results: evt.step_results,
        });
        break;
      }
      case "session_title": {
        if (evt.title && sessionMeta) {
          setSessionMeta(prev => prev ? { ...prev, title: evt.title } : prev);
        }
        break;
      }
      default:
        console.log("[SSE unknown type]", type, evt);
    }
  }

  // Load session + history when sessionId changes
  useEffect(() => {
    if (!sessionId) {
      setMsgs([]);
      setSessionMeta(null);
      setLoadError(false);
      closeStream();
      return;
    }

    let cancelled = false;

    async function load() {
      setLoading(true);
      setLoadError(false);
      setMsgs([]);
      setPlanState(null);
      closeStream();

      try {
        const [meta, historyRes] = await Promise.all([
          window.PrismAPI.sessions.get(sessionId),
          window.PrismAPI.sessions.listMessages(sessionId, { limit: 50 }),
        ]);
        if (cancelled) return;

        setSessionMeta(meta);

        // Defensive: handle array or { items: [] } or { messages: [] }
        const rawMsgs = Array.isArray(historyRes)
          ? historyRes
          : (historyRes?.messages || historyRes?.items || []);

        // Convert API messages to display format
        // Group consecutive assistant messages to pair tool_use with tool_result
        const displayMsgs = [];
        let i = 0;
        while (i < rawMsgs.length) {
          const m = rawMsgs[i];
          if (m.role === "user") {
            const textBlocks = (m.content || []).filter(b => b.type === "text");
            const text = textBlocks.map(b => b.text).join("\n");
            displayMsgs.push({
              role: "user",
              at: formatTime(m.created_at),
              content: text || m.text_preview || "",
            });
            i++;
          } else if (m.role === "assistant") {
            // Collect tool_result from next message if it's a tool_result role
            let toolResults = [];
            if (i + 1 < rawMsgs.length && rawMsgs[i + 1].role === "tool_result") {
              const trMsg = rawMsgs[i + 1];
              toolResults = trMsg.content || [];
              // skip tool_result message since we'll embed it
            }
            const { text, tools } = renderContentBlocks(m.content, toolResults);
            displayMsgs.push({
              role: "agent",
              at: formatTime(m.created_at),
              content: text || m.text_preview || "",
              tools,
            });
            i++;
            // Skip next message only if we consumed it as toolResults
            if (toolResults.length > 0) i++;
          } else {
            // skip tool_use / tool_result / system standalone roles
            i++;
          }
        }

        setMsgs(displayMsgs);

        // Subscribe SSE if session is running
        if (meta.status === "running" && meta.blocking_run_id) {
          openSSE(sessionId);
        }
      } catch (err) {
        if (cancelled) return;
        console.warn("[ChatPage] load session failed:", err);
        setLoadError(true);
      } finally {
        if (!cancelled) setLoading(false);
      }
    }

    load();
    return () => { cancelled = true; closeStream(); };
  }, [sessionId]);

  async function handleSend(prompt) {
    if (!sessionId) return;
    // Optimistic: push user message immediately
    const optMsg = { role: "user", at: "now", content: prompt };
    setMsgs(prev => [...prev, optMsg]);
    scrollToBottom();

    try {
      const res = await window.PrismAPI.tasks.submit({ session_id: sessionId, prompt });
      if (res.accepted_type === "immediate") {
        // Subscribe SSE immediately if not already open
        if (!esRef.current || esRef.current.sessionId !== sessionId) {
          openSSE(sessionId);
        }
      } else if (res.accepted_type === "queued_query") {
        addToast({ id: Date.now(), title: "已排队", body: `第 ${res.queue_position || "?"} 位` });
      }
    } catch (err) {
      addToast({ id: Date.now(), kind: "danger", title: "发送失败", body: err.message });
      // Remove optimistic message on failure
      setMsgs(prev => prev.filter(m => m !== optMsg));
    }
  }

  // Empty state when no session is selected
  if (!sessionId) {
    return <EmptyNoSession t={t}/>;
  }

  if (loading) {
    return (
      <div style={{ display: "flex", flex: 1, alignItems: "center", justifyContent: "center", color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic" }}>
        <PrismMark size={20} style={{ marginRight: 10 }}/> 正在加载会话…
      </div>
    );
  }

  if (loadError) {
    return (
      <div style={{ display: "flex", flex: 1, flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12, color: "var(--ink-3)" }}>
        <div style={{ fontFamily: "var(--serif)", fontStyle: "italic" }}>加载失败,后端可能不可用</div>
        <button className="btn" onClick={() => { setLoadError(false); setLoading(true); }}>重试</button>
      </div>
    );
  }

  const showEmpty = msgs.length === 0 && !runActive;

  return (
    <div style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden" }}>
      <div style={{ flex: 1, overflowY: "auto" }}>
        {showEmpty && (
          <div style={{ display: "flex", flex: 1, alignItems: "center", justifyContent: "center", color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic", padding: 40 }}>
            发送一条消息开始对话
          </div>
        )}
        {msgs.map((m, i) => {
          const prev = msgs[i - 1];
          const first = m.role === "agent" && (!prev || prev.role !== "agent");
          return <Msg key={i} m={m} first={first}/>;
        })}
        <div ref={bottomRef}/>
      </div>
      <Composer t={t} onSend={handleSend} disabled={runActive}/>
    </div>
  );
}

function EmptyNoSession({ t }) {

              {[["cli-laptop", "pk_live_7f3a…", "2 月前", "14:02", "rw"], ["ci-pipeline", "pk_live_de21…", "1 月前", "昨天", "ro"], ["obs-exporter", "pk_live_18be…", "3 周前", "3 天前", "ro"]].map(([n, p, c, l, s], i) => (
                <tr key={i}><td style={{ color: "var(--ink)", fontWeight: 500 }}>{n}</td><td className="mono">{p}</td><td style={{ color: "var(--ink-3)" }}>{c}</td><td style={{ color: "var(--ink-3)" }}>{l}</td><td><span className="badge">{s}</span></td><td><button className="btn sm danger">撤销</button></td></tr>
              ))}
            </tbody>
          </table>
        </>}
      </div>
    </div>
  );
}

/* ============ LOGIN ============ */
function LoginScreen({ onSignIn, onToast, t }) {
  const [mode, setMode]         = useState("login");
  const [email, setEmail]       = useState("alice@example.com");
  const [password, setPassword] = useState("");
  const [username, setUsername] = useState("");
  const [inviteCode, setInviteCode] = useState("");
  const [loading, setLoading]   = useState(false);
  const [errMsg, setErrMsg]     = useState("");

  async function handleSubmit() {
    setErrMsg("");
    if (!email.trim() || !password.trim()) { setErrMsg("邮箱和密码不能为空"); return; }
    setLoading(true);
    try {
      if (mode === "login") {
        await window.PrismAPI.login(email, password);
        onSignIn();
      } else {
        if (!username.trim()) { setErrMsg("用户名不能为空"); setLoading(false); return; }
        await window.PrismAPI.register({ email, username, password, invite_code: inviteCode || undefined });
        await window.PrismAPI.login(email, password);
        onSignIn();
      }
    } catch (err) {
      const status = err.status;
      if (status === 401) setErrMsg("邮箱或密码错误");
      else if (status === 422) setErrMsg("输入格式有问题,请检查邮箱和密码");
      else setErrMsg(err.message || "登录失败,请重试");
    } finally {
      setLoading(false);
    }
  }

  function handleForgot(e) {
    e.preventDefault();
    if (onToast) onToast({ id: Date.now(), title: "还没做", body: "忘记密码功能还没实现,请联系管理员重置。" });
  }

  return (
    <div className="login-wrap">
      <div className="login-left">
        <svg style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0.28 }} viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
          <line x1="-50" y1="440" x2="300" y2="440" stroke="#E8E4DB" strokeWidth="0.8" opacity="0.7"/>
          <path d="M300 440 L460 180 L620 440 Z" stroke="#E8E4DB" strokeWidth="1" fill="none" strokeLinejoin="round"/>
          {[-120, -70, -20, 30, 80, 130].map((y, i) => {
            const cs = ["#9B4A35", "#B8803A", "#6B7A4A", "#4E7C6E", "#7A4E58", "#AE8690"];
            return <line key={i} x1="620" y1="440" x2="900" y2={440 + y} stroke={cs[i]} strokeWidth="0.9" opacity="0.75"/>;
          })}
          <circle cx="-50" cy="440" r="3" fill="#E8E4DB"/>
        </svg>
        <div style={{ position: "relative", zIndex: 1 }}>
          <div className="logo" style={{ color: "var(--paper)" }}><PrismMark size={26}/><span style={{ fontSize: 20 }}>Prism · 棱镜</span></div>
        </div>
        <div style={{ position: "relative", zIndex: 1 }}>
          <div className="eyebrow" style={{ color: "rgba(232,228,219,0.55)", marginBottom: 12 }}>No. 04 · 2026</div>
          <h1 style={{ fontFamily: "var(--serif)", fontSize: 48, fontWeight: 400, lineHeight: 1.15, margin: 0, letterSpacing: "-0.02em", color: "var(--paper)", maxWidth: 520 }}>
            <em style={{ fontStyle: "italic" }}>Harness</em> 不是胶水,<br/>它是操作系统。
          </h1>
          <p style={{ fontFamily: "var(--serif)", fontSize: 16, color: "rgba(232,228,219,0.75)", maxWidth: 460, marginTop: 20, lineHeight: 1.65 }}>
            把大模型变成可靠、可治理、可扩展的协作者。自托管,协议原生,对每一家 provider 开放。
          </p>
          <div style={{ display: "flex", gap: 30, marginTop: 40 }}>
            {[["412", "每月 runs"], ["72%", "缓存命中"], ["18k", "每天审计事件"]].map(([k, v]) => (
              <div key={k}>
                <div style={{ fontFamily: "var(--serif)", fontSize: 28, color: "var(--paper)" }}>{k}</div>
                <div style={{ fontSize: 11, color: "rgba(232,228,219,0.55)", textTransform: "uppercase", letterSpacing: "0.14em", marginTop: 3 }}>{v}</div>
              </div>
            ))}
          </div>
        </div>
        <div style={{ position: "relative", zIndex: 1, fontSize: 11.5, color: "rgba(232,228,219,0.5)", fontFamily: "var(--mono)" }}>prism v0.4.2 · self-hosted · hangzhou-prod</div>
      </div>
      <div className="login-right">
        <div style={{ maxWidth: 380, width: "100%", margin: "0 auto" }}>
          <div className="eyebrow" style={{ marginBottom: 10 }}>{mode === "login" ? "登录" : "创建账号"}</div>
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 30, color: "var(--ink)", fontWeight: 400, margin: 0, letterSpacing: "-0.015em" }}>{t.loginTitle}</h2>
          <p style={{ fontSize: 14, color: "var(--ink-3)", marginTop: 10, lineHeight: 1.6, fontFamily: "var(--serif)", fontStyle: "italic" }}>{t.loginSub}</p>

          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 26 }}>
            <label>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.email}</div>
              <input className="input" type="email" value={email} onChange={e => setEmail(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleSubmit()}/>
            </label>
            {mode === "register" && (
              <label>
                <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>用户名</div>
                <input className="input" value={username} onChange={e => setUsername(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleSubmit()}/>
              </label>
            )}
            <label>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.password}</div>
              <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key === "Enter" && handleSubmit()}/>
            </label>
            {mode === "register" && (
              <label>
                <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>邀请码 <span style={{ color: "var(--ink-4)" }}>(选填)</span></div>
                <input className="input" placeholder="PRISM-XXXXXXXX" value={inviteCode} onChange={e => setInviteCode(e.target.value)}
                  onKeyDown={e => e.key === "Enter" && handleSubmit()}/>
              </label>
            )}
            {mode === "login" && (
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12 }}>
                <label style={{ display: "flex", gap: 6, color: "var(--ink-3)", cursor: "pointer" }}>
                  <input type="checkbox" defaultChecked style={{ accentColor: "var(--ink)" }}/>保持登录
                </label>
                <a href="#" style={{ color: "var(--ink)", borderBottom: "1px solid var(--line-strong)" }} onClick={handleForgot}>忘了?</a>
              </div>
            )}
          </div>

          {errMsg && (
            <div style={{ marginTop: 12, padding: "8px 12px", background: "var(--rust-soft)", borderRadius: 8, fontSize: 12.5, color: "var(--rust)", border: "1px solid rgba(155,74,53,0.25)" }}>
              {errMsg}
            </div>
          )}

          <button className="btn primary" style={{ width: "100%", justifyContent: "center", padding: "11px", marginTop: 18 }}
            onClick={handleSubmit} disabled={loading}>
            {loading
              ? <span style={{ fontFamily: "var(--mono)", fontSize: 12 }}>请稍等…</span>
              : <><Icon name="arrowRight" size={12}/> {mode === "login" ? t.signIn : t.signUp}</>}
          </button>

          <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "20px 0", color: "var(--ink-4)", fontSize: 11 }}>
            <div className="hr" style={{ flex: 1 }}/><span>或者</span><div className="hr" style={{ flex: 1 }}/>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn" style={{ flex: 1, justifyContent: "center" }}>飞书 SSO</button>
            <button className="btn" style={{ flex: 1, justifyContent: "center" }}>OIDC</button>
          </div>

          <div style={{ marginTop: 28, fontSize: 12.5, color: "var(--ink-3)", textAlign: "center" }}>
            {mode === "login"
              ? <>还没有工作区? <a href="#" style={{ color: "var(--ink)", borderBottom: "1px solid var(--line-strong)", marginLeft: 4 }} onClick={e => { e.preventDefault(); setMode("register"); setErrMsg(""); }}>{t.signUp}</a></>
              : <>已有账号? <a href="#" style={{ color: "var(--ink)", borderBottom: "1px solid var(--line-strong)", marginLeft: 4 }} onClick={e => { e.preventDefault(); setMode("login"); setErrMsg(""); }}>回去登录</a></>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ TOASTS & TWEAKS ============ */
function Toasts({ toasts, onClose }) {
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.kind || ""}`} onClick={() => onClose(t.id)}>
          <div style={{ flex: 1 }}>
            <div className="title">{t.title}</div>
            <div>{t.body}</div>
          </div>
          <Icon name="close" size={11} style={{ color: "var(--ink-4)", cursor: "pointer", marginTop: 3 }}/>
        </div>
      ))}
    </div>
  );
}

function Tweaks({ tweaks, setTweaks }) {
  const [collapsed, setCollapsed] = useState(false);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const h = e => { if (e.data?.type === "__activate_edit_mode") setVisible(true); if (e.data?.type === "__deactivate_edit_mode") setVisible(false); };
    window.addEventListener("message", h);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", h);
  }, []);
  const up = (k, v) => { setTweaks({ ...tweaks, [k]: v }); window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*"); };
  if (!visible) return null;
  return (
    <div className={`tweaks ${collapsed ? "collapsed" : ""}`}>
      <div className="head" onClick={() => setCollapsed(!collapsed)}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}><PrismMark size={14}/><span style={{ fontFamily: "var(--serif)", fontSize: 14, color: "var(--ink)", fontStyle: "italic" }}>Tweaks</span></div>
        <Icon name="chevron" size={11} style={{ transform: collapsed ? "rotate(90deg)" : "" }}/>
      </div>
      <div className="body">
        <div><div className="label">主题</div><div className="seg">{["light", "dark"].map(v => <button key={v} className={tweaks.theme === v ? "on" : ""} onClick={() => up("theme", v)}>{v}</button>)}</div></div>
        <div><div className="label">密度</div><div className="seg">{["compact", "comfortable", "spacious"].map(v => <button key={v} className={tweaks.density === v ? "on" : ""} onClick={() => up("density", v)}>{v}</button>)}</div></div>
        <div><div className="label">对话气泡圆角</div><div className="seg">{["soft", "softer", "pill"].map(v => <button key={v} className={tweaks.bubble === v ? "on" : ""} onClick={() => up("bubble", v)}>{v}</button>)}</div></div>
        <div><div className="label">语气</div><div className="seg">{["同事", "管家", "冷静"].map(v => <button key={v} className={tweaks.tone === v ? "on" : ""} onClick={() => up("tone", v)}>{v}</button>)}</div></div>
        <div><div className="label">布局</div><div className="seg">{["focus", "split"].map(v => <button key={v} className={tweaks.layout === v ? "on" : ""} onClick={() => up("layout", v)}>{v}</button>)}</div></div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [tweaks, setTweaks] = useState({ theme: "light", density: "comfortable", bubble: "soft", tone: "同事", layout: "split" });
  const [lang, setLang] = useState("zh");
  // screen: "loading" | "login" | "app"
  const [screen, setScreen] = useState("loading");
  const [page, setPage] = useState("chat");
  const [showPlan, setShowPlan] = useState(true);
  const [perm, setPerm] = useState(false);
  const [permRequest, setPermRequest] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [currentSessionId, setCurrentSessionId] = useState(null);
  const [planState, setPlanState] = useState(null);

  // Auto-restore login from sessionStorage token
  useEffect(() => {
    async function bootstrap() {
      if (window.PrismAPI && window.PrismAPI.isAuthenticated()) {
        try {
          await window.PrismAPI.me();
          setScreen("app");
        } catch {
          setScreen("login");
        }
      } else {
        setScreen("login");
      }
    }
    bootstrap();

    // Redirect to login on unauthorized events from apiClient
    const handler = () => setScreen("login");
    window.addEventListener("prism:unauthorized", handler);
    return () => window.removeEventListener("prism:unauthorized", handler);
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme);
    document.documentElement.setAttribute("data-density", tweaks.density);
  }, [tweaks]);

  useEffect(() => {
    const map = { soft: "18px 18px 6px 18px", softer: "22px 22px 22px 22px", pill: "22px 22px 6px 22px" };
    document.documentElement.style.setProperty("--bubble-radius", map[tweaks.bubble]);
  }, [tweaks.bubble]);

  const t = I18N[lang] || I18N.zh;

  function addToast(toast) {
    setToasts(prev => [...prev, toast]);
    // Auto-dismiss after 6s
    setTimeout(() => setToasts(prev => prev.filter(x => x.id !== toast.id)), 6000);
  }

  if (screen === "loading") {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: "var(--bg)", gap: 12, color: "var(--ink-3)", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 16 }}>
        <PrismMark size={24}/>正在恢复…
      </div>
    );
  }

  if (screen === "login") {
    return (<><LoginScreen t={t} onSignIn={() => setScreen("app")} onToast={addToast}/><Tweaks tweaks={tweaks} setTweaks={setTweaks}/></>);
  }

  const sidebarMode = tweaks.layout === "split" && page === "chat" && showPlan && planState ? "split" : "normal";

  // Get current session title for Topbar
  const sessionTitle = currentSessionId ? null : null; // resolved inside ChatPage via sessionMeta

  return (
    <>
      <div className="app" data-sidebar={sidebarMode}>
        <Sidebar
          page={page}
          setPage={setPage}
          t={t}
          currentSessionId={currentSessionId}
          setCurrentSessionId={(id) => { setCurrentSessionId(id); setPlanState(null); }}
          addToast={addToast}
        />
        <main className="main">
          <Topbar
            page={page}
            t={t}
            showPlan={showPlan}
            setShowPlan={setShowPlan}
            lang={lang}
            setLang={setLang}
            onPerm={() => setPerm(true)}
            sessionTitle={null}
          />
          {page === "chat" && (
            <ChatPage
              key={currentSessionId || "empty"}
              t={t}
              sessionId={currentSessionId}
              addToast={addToast}
              setPermRequest={setPermRequest}
              setPerm={setPerm}
              setPlanState={setPlanState}
            />
          )}
          {page === "sessions" && <SessionsPage/>}
          {page === "usage" && <UsagePage/>}
          {page === "skills" && <SkillsPage/>}
          {page === "plugins" && <PluginsPage/>}
          {page === "admin" && <AdminPage/>}
          {page === "observability" && <ObsPage/>}
          {page === "settings" && <SettingsPage/>}
          {page !== "chat" && (
            <div className="statusbar">
              <div className="kv"><span>provider</span> <b>anthropic</b></div>
              <div className="kv"><span>模型</span> <b>sonnet-4-5</b></div>
              <div className="kv"><span>缓存</span> <b style={{ color: "var(--teal)" }}>72%</b></div>
              <div style={{ flex: 1 }}/>
              <div className="kv"><span>harness</span> <b style={{ color: "var(--teal)" }}>● active</b></div>
            </div>
          )}
        </main>
        {sidebarMode === "split" && <PlanPanel t={t} planState={planState}/>}
      </div>

      {/* Demo switcher */}
      <div style={{ position: "fixed", top: 14, right: 20, zIndex: 70, display: "flex", gap: 4, background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 999, padding: 4, boxShadow: "var(--shadow-2)" }}>
        <button className="icon-btn" onClick={() => setScreen("login")} title="登录页"><Icon name="arrowRight" size={11} style={{ transform: "rotate(180deg)" }}/></button>
        <button className="icon-btn" onClick={() => { setCurrentSessionId(null); setPage("chat"); }} title="空状态"><Icon name="sparkle" size={11}/></button>
        <button className="icon-btn" onClick={() => setScreen("app")} title="应用"><Icon name="chat" size={11}/></button>
      </div>

      {perm && (
        <PermissionModal
          t={t}
          onClose={() => { setPerm(false); setPermRequest(null); }}
          permRequest={permRequest}
          sessionId={currentSessionId}
          addToast={addToast}
        />
      )}
      <Toasts toasts={toasts} onClose={id => setToasts(toasts.filter(x => x.id !== id))}/>
      <Tweaks tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
