function ProvidersTab({ onToast }) {
  const [providers, setProviders] = useState([]);
  const [presets, setPresets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editingProvider, setEditingProvider] = useState(null);
  const [form, setForm] = useState({ preset: "", name: "", api_key: "", base_url: "", model_id: "", is_default: false });
  const [submitting, setSubmitting] = useState(false);
  const [testing, setTesting] = useState(null);

  async function load() {
    setLoading(true);
    try {
      const [pvList, psList] = await Promise.all([PrismAPI.providers.list(), PrismAPI.providers.presets()]);
      setProviders(Array.isArray(pvList) ? pvList : []);
      setPresets(Array.isArray(psList) ? psList : []);
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "加载失败", body: err.message });
    }
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  function applyPreset(presetName) {
    const p = presets.find(x => x.name === presetName);
    if (!p) { setForm(f => ({ ...f, preset: presetName })); return; }
    setForm(f => ({ ...f, preset: presetName, name: p.name, base_url: p.base_url, model_id: p.model_id, api_key: "", is_default: false }));
  }

  function openEdit(p) {
    setEditingProvider(p);
    setForm({ preset: "", name: p.name, api_key: "", base_url: p.base_url || "", model_id: p.model_id || "", is_default: p.is_default });
    setShowForm(true);
  }

  function closeForm() { setShowForm(false); setEditingProvider(null); setForm({ preset: "", name: "", api_key: "", base_url: "", model_id: "", is_default: false }); }

  async function handleSubmit() {
    if (!form.name.trim()) { onToast({ id: Date.now(), kind: "warning", title: "缺名字", body: "Provider 名字不能为空" }); return; }
    const preset = presets.find(p => p.name === form.preset);
    const protocol = preset?.protocol || "openai";
    const capabilities = preset?.capabilities || {};

    if (!editingProvider && !form.api_key.trim()) {
      onToast({ id: Date.now(), kind: "warning", title: "缺 API Key", body: "新建时必须填 API Key" }); return;
    }

    setSubmitting(true);
    try {
      if (editingProvider) {
        const body = { name: form.name, base_url: form.base_url || undefined, model_id: form.model_id || undefined, is_default: form.is_default };
        if (form.api_key.trim()) body.api_key = form.api_key;
        await PrismAPI.providers.update(editingProvider.id, body);
        onToast({ id: Date.now(), kind: "success", title: "已更新", body: form.name });
      } else {
        await PrismAPI.providers.create({
          name: form.name, protocol, base_url: form.base_url || undefined,
          model_id: form.model_id || undefined, api_key: form.api_key,
          is_default: form.is_default,
          config: { capabilities },
        });
        onToast({ id: Date.now(), kind: "success", title: "已新建", body: form.name });
      }
      closeForm();
      load();
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "操作失败", body: err.message });
    }
    setSubmitting(false);
  }

  async function handleDelete(p) {
    if (!confirm(`确定删除 ${p.name}？`)) return;
    try {
      await PrismAPI.providers.delete_(p.id);
      onToast({ id: Date.now(), title: "已删除", body: p.name });
      load();
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "删除失败", body: err.message });
    }
  }

  async function handleTest(p) {
    setTesting(p.id);
    try {
      await PrismAPI.providers.test(p.id);
      onToast({ id: Date.now(), kind: "success", title: "连通", body: `${p.name} 测试通过` });
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "测试失败", body: err.message });
    }
    setTesting(null);
  }

  const userProviders = providers.filter(p => p.scope === "user");
  const systemProviders = providers.filter(p => p.scope === "system");

  return (
    <div>
      <div className="page-head" style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
        <div>
          <div className="page-title">我的 Providers</div>
          <div className="page-sub">带着你自己的 key 来。Anthropic 协议、OpenAI 协议都通。</div>
        </div>
        <button className="btn primary" onClick={() => { setShowForm(true); setEditingProvider(null); }}><Icon name="plus" size={13}/> 新建</button>
      </div>

      {showForm && (
        <div className="card" style={{ padding: 22, marginBottom: 20 }}>
          <div style={{ fontFamily: "var(--serif)", fontSize: 15, color: "var(--ink)", marginBottom: 16 }}>{editingProvider ? `编辑 ${editingProvider.name}` : "新建 Provider"}</div>
          {!editingProvider && (
            <label style={{ display: "block", marginBottom: 14 }}>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>从预设开始（可选）</div>
              <select className="input" value={form.preset} onChange={e => applyPreset(e.target.value)}>
                <option value="">— 手动填写 —</option>
                {presets.map(p => <option key={p.name} value={p.name}>{p.name} ({p.protocol})</option>)}
              </select>
            </label>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <label style={{ display: "block" }}>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>名字 *</div>
              <input className="input" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="My Anthropic"/>
            </label>
            <label style={{ display: "block" }}>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>API Key {editingProvider ? "（留空不改）" : "*"}</div>
              <input className="input" type="password" value={form.api_key} onChange={e => setForm(f => ({ ...f, api_key: e.target.value }))} placeholder={editingProvider ? "留空表示不修改" : "sk-…"}/>
            </label>
            <label style={{ display: "block" }}>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>Base URL（可选）</div>
              <input className="input" value={form.base_url} onChange={e => setForm(f => ({ ...f, base_url: e.target.value }))} placeholder="https://api.anthropic.com"/>
            </label>
            <label style={{ display: "block" }}>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>Model ID（可选）</div>
              <input className="input" value={form.model_id} onChange={e => setForm(f => ({ ...f, model_id: e.target.value }))} placeholder="claude-sonnet-4-6"/>
            </label>
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14, cursor: "pointer" }}>
            <input type="checkbox" checked={form.is_default} onChange={e => setForm(f => ({ ...f, is_default: e.target.checked }))}/>
            <span style={{ fontSize: 13, color: "var(--ink-2)" }}>设为我的默认 Provider</span>
          </label>
          <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
            <button className="btn primary" onClick={handleSubmit} disabled={submitting}>{submitting ? "保存中…" : "保存"}</button>
            <button className="btn ghost" onClick={closeForm}>取消</button>
          </div>
        </div>
      )}

      {loading ? <div style={{ color: "var(--ink-3)" }}>加载中…</div> : (
        <>
          {userProviders.length > 0 && (
            <>
              <div className="section-title" style={{ marginBottom: 10 }}>我的配置</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
                {userProviders.map(p => (
                  <div key={p.id} className="card" style={{ padding: 18, display: "flex", alignItems: "center", gap: 16 }}>
                    <div style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--ink)", color: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--serif)", fontSize: 16, flexShrink: 0 }}>{(p.name || "?")[0]}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <span style={{ fontFamily: "var(--serif)", fontSize: 15, color: "var(--ink)" }}>{p.name}</span>
                        {p.is_default && <span className="badge ink">默认</span>}
                        <span className="badge">{p.protocol}</span>
                        <span className={`dot ${p.is_healthy ? "live" : "warn"}`}/>
                      </div>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 4, fontFamily: "var(--mono)" }}>
                        {p.api_key_masked} · {p.model_id}
                      </div>
                    </div>
                    <button className="btn sm ghost" onClick={() => handleTest(p)} disabled={testing === p.id}>{testing === p.id ? "…" : "测一下"}</button>
                    <button className="btn sm" onClick={() => openEdit(p)}>编辑</button>
                    <button className="btn sm danger" onClick={() => handleDelete(p)}>删除</button>
                  </div>
                ))}
              </div>
            </>
          )}
          {systemProviders.length > 0 && (
            <>
              <div className="section-title" style={{ marginBottom: 10 }}>平台 Providers（只读）</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {systemProviders.map(p => (
                  <div key={p.id} className="card" style={{ padding: 16, display: "flex", alignItems: "center", gap: 14, opacity: 0.72 }}>
                    <div style={{ width: 36, height: 36, borderRadius: "50%", background: "var(--ink-3)", color: "var(--paper)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "var(--serif)", fontSize: 14, flexShrink: 0 }}>{(p.name || "?")[0]}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <span style={{ fontFamily: "var(--serif)", fontSize: 14, color: "var(--ink-2)" }}>{p.name}</span>
                        {p.is_default && <span className="badge">默认</span>}
                        <span className="badge">{p.protocol}</span>
                        <span className={`dot ${p.is_healthy ? "live" : "warn"}`}/>
                      </div>
                      <div style={{ fontSize: 11, color: "var(--ink-4)", marginTop: 3, fontFamily: "var(--mono)" }}>{p.model_id}</div>
                    </div>
                    <span style={{ fontSize: 11.5, color: "var(--ink-4)", fontFamily: "var(--mono)" }}>system</span>
                  </div>
                ))}
              </div>
            </>
          )}
          {providers.length === 0 && <div style={{ color: "var(--ink-3)", padding: 20 }}>暂无 provider</div>}
        </>
      )}
    </div>
  );
}

function McpTab({ onToast }) {
  const [servers, setServers] = useState([]);
  const [installs, setInstalls] = useState([]);
  const [loading, setLoading] = useState(true);
  const [installing, setInstalling] = useState(null);
  const [toggling, setToggling] = useState(null);
  const [uninstalling, setUninstalling] = useState(null);

  async function load() {
    setLoading(true);
    try {
      const [srvList, instList] = await Promise.all([PrismAPI.mcp.listServers(), PrismAPI.mcp.listInstalls()]);
      setServers(Array.isArray(srvList) ? srvList : []);
      setInstalls(Array.isArray(instList) ? instList : []);
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "加载失败", body: err.message });
    }
    setLoading(false);
  }

  useEffect(() => { load(); }, []);

  function isInstalled(serverId) { return installs.some(i => i.mcp_server_id === serverId); }
  function getInstall(serverId) { return installs.find(i => i.mcp_server_id === serverId); }

  async function handleInstall(server) {
    setInstalling(server.id);
    try {
      await PrismAPI.mcp.install({ mcp_server_id: server.id });
      onToast({ id: Date.now(), kind: "success", title: "已安装", body: server.name });
      load();
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "安装失败", body: err.message });
    }
    setInstalling(null);
  }

  async function handleToggle(install) {
    setToggling(install.id);
    try {
      await PrismAPI.mcp.updateInstall(install.id, { is_enabled: !install.is_enabled });
      setInstalls(prev => prev.map(i => i.id === install.id ? { ...i, is_enabled: !i.is_enabled } : i));
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "切换失败", body: err.message });
    }
    setToggling(null);
  }

  async function handleUninstall(install) {
    if (!confirm(`卸载 ${install.mcp_server_name}？`)) return;
    setUninstalling(install.id);
    try {
      await PrismAPI.mcp.uninstall(install.id);
      onToast({ id: Date.now(), title: "已卸载", body: install.mcp_server_name });
      load();
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "卸载失败", body: err.message });
    }
    setUninstalling(null);
  }

  if (loading) return <div style={{ color: "var(--ink-3)" }}>加载中…</div>;

  const notInstalled = servers.filter(s => !isInstalled(s.id));

  return (
    <div>
      <div className="page-head"><div className="page-title">我的 MCP</div><div className="page-sub">安装 MCP Server 后，Agent 可以调用它提供的工具。</div></div>

      {installs.length > 0 && (
        <>
          <div className="section-title" style={{ marginBottom: 10 }}>已安装</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
            {installs.map(inst => {
              const srv = servers.find(s => s.id === inst.mcp_server_id);
              return (
                <div key={inst.id} className="card" style={{ padding: 16, display: "flex", alignItems: "center", gap: 14 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

                      {srv?.scope === "system" && <span className="badge">系统</span>}
                      <span className={`dot ${inst.is_enabled ? "live" : "warn"}`}/>
                    </div>
                    {srv && <div style={{ fontSize: 11.5, color: "var(--ink-4)", marginTop: 4, fontFamily: "var(--mono)" }}>$ {srv.command} {(srv.args || []).join(" ")}</div>}
                  </div>
                  <div
                    className={`switch ${inst.is_enabled ? "on" : ""}`}
                    style={{ cursor: toggling === inst.id ? "wait" : "pointer" }}
                    onClick={() => toggling !== inst.id && handleToggle(inst)}
                  />
                  <button className="btn sm danger" onClick={() => handleUninstall(inst)} disabled={uninstalling === inst.id}>{uninstalling === inst.id ? "…" : "卸载"}</button>
                </div>
              );
            })}
          </div>
        </>
      )}

      {notInstalled.length > 0 && (
        <>
          <div className="section-title" style={{ marginBottom: 10 }}>可安装</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {notInstalled.map(s => (
              <div key={s.id} className="card" style={{ padding: 16, display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span className="mono" style={{ fontSize: 13, color: "var(--ink)", fontWeight: 500 }}>{s.name}</span>
                    <span className="badge">系统</span>
                  </div>
                  <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 3, fontFamily: "var(--serif)", fontStyle: "italic" }}>{s.description}</div>
                </div>
                <button className="btn sm primary" onClick={() => handleInstall(s)} disabled={installing === s.id}>{installing === s.id ? "安装中…" : "安装"}</button>
              </div>
            ))}
          </div>
        </>
      )}

      {servers.length === 0 && <div style={{ color: "var(--ink-3)", padding: 20 }}>暂无可用 MCP Server</div>}
    </div>
  );
}

function SkillsSettingsTab({ onToast }) {
  const [installed, setInstalled] = useState([]);
  const [searchResults, setSearchResults] = useState([]);
  const [q, setQ] = useState("");
  const [loading, setLoading] = useState(true);
  const [searching, setSearching] = useState(false);
  const [uninstalling, setUninstalling] = useState(null);

  async function loadInstalled() {
    setLoading(true);
    try {
      const list = await PrismAPI.skills.listInstalled();
      setInstalled(Array.isArray(list) ? list : []);
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "加载失败", body: err.message });
    }
    setLoading(false);
  }

  useEffect(() => { loadInstalled(); }, []);

  async function handleSearch() {
    if (!q.trim()) { setSearchResults([]); return; }
    setSearching(true);
    try {
      const results = await PrismAPI.skills.search({ q: q.trim() });
      setSearchResults(Array.isArray(results) ? results : []);
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "搜索失败", body: err.message });
      setSearchResults([]);
    }
    setSearching(false);
  }

  async function handleUninstall(sk) {
    const name = sk.skill_name || sk.name;
    if (!confirm(`卸载 ${name}？`)) return;
    setUninstalling(name);
    try {
      await PrismAPI.skills.uninstall(name);
      onToast({ id: Date.now(), title: "已卸载", body: name });
      loadInstalled();
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "卸载失败", body: err.message });
    }
    setUninstalling(null);
  }

  return (
    <div>
      <div className="page-head"><div className="page-title">技能（Skills）</div><div className="page-sub">Skill 是 Markdown + 钩子的组合，装上后 Agent 可以使用。</div></div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <input className="input" style={{ flex: 1 }} placeholder="搜索技能名…" value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSearch()}/>
        <button className="btn" onClick={handleSearch} disabled={searching}>{searching ? "搜索中…" : "搜索"}</button>
      </div>

      {searchResults.length > 0 && (
        <div style={{ marginBottom: 24 }}>
          <div className="section-title" style={{ marginBottom: 10 }}>搜索结果</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {searchResults.map((sk, i) => {
              const name = sk.skill_name || sk.name;
              const isInst = installed.some(s => (s.skill_name || s.name) === name);
              return (
                <div key={i} className="card" style={{ padding: 16, display: "flex", alignItems: "center", gap: 14 }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="mono" style={{ fontSize: 13, color: "var(--ink)", fontWeight: 500 }}>{name}</div>
                    {sk.description && <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 3, fontFamily: "var(--serif)", fontStyle: "italic" }}>{sk.description}</div>}
                  </div>
                  {isInst ? <span className="badge teal">已装</span> : (
                    <button className="btn sm primary" onClick={() => onToast({ id: Date.now(), title: "暂不支持", body: "从搜索结果安装需要提供 source_url/version，请联系管理员操作。" })}>安装</button>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
      {q && !searching && searchResults.length === 0 && <div style={{ color: "var(--ink-3)", marginBottom: 20 }}>无匹配技能</div>}

      <div className="section-title" style={{ marginBottom: 10 }}>已安装</div>
      {loading ? <div style={{ color: "var(--ink-3)" }}>加载中…</div> : installed.length === 0 ? (
        <div className="card" style={{ padding: 24, textAlign: "center", color: "var(--ink-3)", fontFamily: "var(--serif)", fontStyle: "italic" }}>暂未安装任何 Skill</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {installed.map((sk, i) => {
            const name = sk.skill_name || sk.name;
            return (
              <div key={i} className="card" style={{ padding: 16, display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="mono" style={{ fontSize: 13, color: "var(--ink)", fontWeight: 500 }}>{name}</div>
                  {sk.version && <div style={{ fontSize: 11.5, color: "var(--ink-4)", marginTop: 3, fontFamily: "var(--mono)" }}>v{sk.version} · {sk.source || "local"}</div>}
                </div>
                <span className="badge teal">已装</span>
                <button className="btn sm danger" onClick={() => handleUninstall(sk)} disabled={uninstalling === name}>{uninstalling === name ? "…" : "卸载"}</button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ImTab({ onToast }) {
  const [bindings, setBindings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pairingChannel, setPairingChannel] = useState("");
  const [pairResult, setPairResult] = useState(null);
  const [countdown, setCountdown] = useState(0);
  const [generating, setGenerating] = useState(false);
  const [unbinding, setUnbinding] = useState(null);
  const countdownRef = useRef(null);

  async function loadBindings() {
    setLoading(true);
    try {
      const list = await PrismAPI.im.listBindings();
      setBindings(Array.isArray(list) ? list : []);
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "加载失败", body: err.message });
    }
    setLoading(false);
  }

  useEffect(() => { loadBindings(); return () => { if (countdownRef.current) clearInterval(countdownRef.current); }; }, []);

  async function handleGeneratePair() {
    if (!pairingChannel) { onToast({ id: Date.now(), kind: "warning", title: "选择渠道", body: "请先选择要绑定的 IM 渠道" }); return; }
    setGenerating(true);
    try {
      const result = await PrismAPI.im.generatePairingCode({ channel: pairingChannel });
      setPairResult(result);
      const exp = new Date(result.expires_at);
      const secs = Math.max(0, Math.floor((exp - Date.now()) / 1000));
      setCountdown(secs);
      if (countdownRef.current) clearInterval(countdownRef.current);
      countdownRef.current = setInterval(() => {
        setCountdown(c => { if (c <= 1) { clearInterval(countdownRef.current); setPairResult(null); return 0; } return c - 1; });
      }, 1000);
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "生成失败", body: err.message });
    }
    setGenerating(false);
  }

  async function handleUnbind(b) {
    if (!confirm(`解绑 ${b.channel || b.id}？`)) return;
    setUnbinding(b.id);
    try {
      await PrismAPI.im.unbind(b.id);
      onToast({ id: Date.now(), title: "已解绑", body: b.channel || b.id });
      loadBindings();
    } catch (err) {
      onToast({ id: Date.now(), kind: "danger", title: "解绑失败", body: err.message });
    }
    setUnbinding(null);
  }

  const CHANNELS = [
    { value: "feishu", label: "飞书 · Lark" },
    { value: "wecom", label: "企业微信" },
    { value: "telegram", label: "Telegram" },
  ];

  return (
    <div>
      <div className="page-head"><div className="page-title">IM 绑定</div><div className="page-sub">把 Prism 接到飞书、企微、Telegram 里。每条消息都变成一个 Session。</div></div>

      <div className="card" style={{ padding: 22, marginBottom: 20 }}>
        <div style={{ fontFamily: "var(--serif)", fontSize: 14, color: "var(--ink-2)", marginBottom: 14 }}>生成配对码</div>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>选择渠道</div>
            <select className="input" value={pairingChannel} onChange={e => setPairingChannel(e.target.value)}>
              <option value="">— 选择渠道 —</option>
              {CHANNELS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
            </select>
          </div>
          <button className="btn primary" onClick={handleGeneratePair} disabled={generating}>{generating ? "生成中…" : "生成配对码"}</button>
        </div>
        {pairResult && (
          <div style={{ marginTop: 16, padding: "16px 20px", background: "var(--bg)", borderRadius: 12, display: "flex", alignItems: "center", gap: 20 }}>
            <div>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 4 }}>配对码</div>
              <div style={{ fontFamily: "var(--mono)", fontSize: 32, color: "var(--ink)", letterSpacing: "0.12em", fontWeight: 600 }}>{pairResult.pairing_code}</div>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 4 }}>有效期</div>
              <div style={{ fontFamily: "var(--mono)", fontSize: 20, color: countdown < 60 ? "var(--red, #c0392b)" : "var(--teal)" }}>{Math.floor(countdown / 60)}:{String(countdown % 60).padStart(2, "0")}</div>
            </div>
            <div style={{ fontSize: 12, color: "var(--ink-3)", fontFamily: "var(--serif)", fontStyle: "italic", maxWidth: 160 }}>在 {CHANNELS.find(c => c.value === pairResult.channel)?.label || pairResult.channel} 中向 Bot 发送此码完成绑定</div>
          </div>
        )}
      </div>

      <div className="section-title" style={{ marginBottom: 10 }}>已绑定</div>
      {loading ? <div style={{ color: "var(--ink-3)" }}>加载中…</div> : bindings.length === 0 ? (
        <div className="card" style={{ padding: 24, textAlign: "center", color: "var(--ink-3)", fontFamily: "var(--serif)", fontStyle: "italic" }}>暂无绑定</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {bindings.map(b => (
            <div key={b.id} className="card" style={{ padding: 16, display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: "var(--serif)", fontSize: 14, color: "var(--ink)" }}>
                  {CHANNELS.find(c => c.value === b.channel)?.label || b.channel || "未知渠道"}
                </div>
                {b.external_id && <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginTop: 3, fontFamily: "var(--mono)" }}>{b.external_id}</div>}
              </div>
              <span className="badge teal">已绑</span>
              <button className="btn sm danger" onClick={() => handleUnbind(b)} disabled={unbinding === b.id}>{unbinding === b.id ? "…" : "解绑"}</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const [phone, setPhone]       = useState("");
  const [otpCode, setOtpCode]   = useState("");
  const [loading, setLoading]   = useState(false);
  const [errMsg, setErrMsg]     = useState("");
  const [okMsg, setOkMsg]       = useState("");
  const [otpRequested, setOtpRequested] = useState(false);
  const [magicRequested, setMagicRequested] = useState(false);
  const [googleEnabled, setGoogleEnabled] = useState(false);
  const [phoneEnabled, setPhoneEnabled] = useState(false);
  const [showForgot, setShowForgot] = useState(false);

  useEffect(() => {
    // Probe which login methods are available
    window.PrismAPI.auth.providers().then(p => {
      setGoogleEnabled(!!p.google);
      setPhoneEnabled(!!p.phone_password);
    }).catch(() => {});
  }, []);

  function clearMessages() { setErrMsg(""); setOkMsg(""); }

  function switchChannel(ch) {
    setChannel(ch);
    clearMessages();
    setOtpRequested(false);
    setMagicRequested(false);
  }

  function switchEmailMode(mode) {
    setEmailMode(mode);
    clearMessages();
    setOtpRequested(false);
    setMagicRequested(false);
  }

  // ── Login handlers ─────────────────────────────────────────────
  async function handleEmailPwLogin() {
    clearMessages();
    if (!email.trim() || !password.trim()) { setErrMsg("邮箱和密码不能为空"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.login(email, password);
      onSignIn();
    } catch (err) {
      if (err.status === 401) setErrMsg("邮箱或密码错误");
      else setErrMsg(err.message || "登录失败");
    }
    setLoading(false);
  }

  async function handleMagicRequest() {
    clearMessages();
    if (!email.trim()) { setErrMsg("请输入邮箱"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.auth.emailMagicRequest({ email: email.trim() });
      setMagicRequested(true);
      setOkMsg("如果邮箱已注册，Magic Link 已发出，请查收邮件（dev 模式可在 docker logs 里看 URL）");
    } catch (err) {
      setErrMsg(err.message || "请求失败");
    }
    setLoading(false);
  }

  async function handleOtpRequest() {
    clearMessages();
    if (!email.trim()) { setErrMsg("请输入邮箱"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.auth.emailOtpRequest({ email: email.trim() });
      setOtpRequested(true);
      setOkMsg("OTP 已发出，请查收邮件（dev 模式可在 docker logs 看 6 位码）");
    } catch (err) {
      setErrMsg(err.message || "请求失败");
    }
    setLoading(false);
  }

  async function handleOtpVerify() {
    clearMessages();
    if (!otpCode.trim()) { setErrMsg("请输入 6 位验证码"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.auth.emailOtpVerify({ email: email.trim(), code: otpCode.trim() });
      await window.PrismAPI.me();
      onSignIn();
    } catch (err) {
      if (err.status === 401) setErrMsg("验证码错误或已过期");
      else setErrMsg(err.message || "验证失败");
    }
    setLoading(false);
  }

  async function handlePhoneLogin() {
    clearMessages();
    if (!phone.trim() || !password.trim()) { setErrMsg("手机号和密码不能为空"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.auth.phoneLogin({ phone: phone.trim(), password });
      await window.PrismAPI.me();
      onSignIn();
    } catch (err) {
      if (err.status === 401) setErrMsg("手机号或密码错误");
      else setErrMsg(err.message || "登录失败");
    }
    setLoading(false);
  }

  // ── Register handlers ──────────────────────────────────────────
  async function handleEmailRegister() {
    clearMessages();
    if (!email.trim() || !password.trim()) { setErrMsg("邮箱和密码不能为空"); return; }
    if (!username.trim()) { setErrMsg("用户名不能为空"); return; }
    if (!inviteCode.trim()) { setErrMsg("邀请码不能为空"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.register({ email: email.trim(), username: username.trim(), password, invite_code: inviteCode.trim() });
      await window.PrismAPI.login(email.trim(), password);
      onSignIn();
    } catch (err) {
      if (err.status === 409) setErrMsg("邮箱或用户名已注册");
      else if (err.status === 400) setErrMsg(err.message || "邀请码无效");
      else setErrMsg(err.message || "注册失败");
    }
    setLoading(false);
  }

  async function handlePhoneRegister() {
    clearMessages();
    if (!phone.trim() || !password.trim()) { setErrMsg("手机号和密码不能为空"); return; }
    if (!inviteCode.trim()) { setErrMsg("邀请码不能为空"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.auth.phoneRegister({ phone: phone.trim(), password, invite_code: inviteCode.trim() });
      await window.PrismAPI.me();
      onSignIn();
    } catch (err) {
      if (err.status === 400) setErrMsg(err.message || "邀请码无效或手机号格式错误");
      else setErrMsg(err.message || "注册失败");
    }
    setLoading(false);
  }

  function handleGoogleLogin() {
    window.location.href = "/api/v1/auth/google/authorize";
  }

  // ── Tab style helpers ──────────────────────────────────────────
  function topTabStyle(active) {
    return {
      flex: 1, padding: "10px 0", fontSize: 13.5, fontWeight: active ? 600 : 400,
      background: "none", border: "none", borderBottom: active ? "2px solid var(--ink)" : "2px solid transparent",
      color: active ? "var(--ink)" : "var(--ink-3)", cursor: "pointer", marginBottom: -1,
    };
  }

  function subTabStyle(active) {
    return {
      padding: "5px 12px", fontSize: 12, background: "none", border: "none",
      borderBottom: active ? "2px solid var(--ink)" : "2px solid transparent",
      color: active ? "var(--ink)" : "var(--ink-3)", cursor: "pointer", marginBottom: -1,
    };
  }

  // ── Render ─────────────────────────────────────────────────────
  return (
    <div className="login-wrap">
      <LoginLeft/>
      <div className="login-right">
        <div style={{ maxWidth: 380, width: "100%", margin: "0 auto" }}>
          {/* ── Login ─────────────────────────────── */}
          {screen === "login" && (
            <>
              <div className="eyebrow" style={{ marginBottom: 10 }}>登录</div>
              <h2 style={{ fontFamily: "var(--serif)", fontSize: 30, color: "var(--ink)", fontWeight: 400, margin: 0, letterSpacing: "-0.015em" }}>{t.loginTitle}</h2>
              <p style={{ fontSize: 14, color: "var(--ink-3)", marginTop: 10, lineHeight: 1.6, fontFamily: "var(--serif)", fontStyle: "italic" }}>{t.loginSub}</p>

              {/* Top-level channel tabs: 邮箱 / 手机 */}
              <div style={{ display: "flex", marginTop: 22, borderBottom: "1px solid var(--line)" }}>
                <button style={topTabStyle(channel === "email")} onClick={() => switchChannel("email")}>邮箱</button>
                {phoneEnabled && <button style={topTabStyle(channel === "phone")} onClick={() => switchChannel("phone")}>手机</button>}
              </div>

              {/* Email channel */}
              {channel === "email" && (
                <>
                  {/* Email sub-mode tabs */}
                  <div style={{ display: "flex", gap: 0, marginTop: 14, marginBottom: 2, borderBottom: "1px solid var(--line)" }}>
                    <button style={subTabStyle(emailMode === "email_pw")} onClick={() => switchEmailMode("email_pw")}>密码</button>
                    <button style={subTabStyle(emailMode === "magic")} onClick={() => switchEmailMode("magic")}>Magic Link</button>
                    <button style={subTabStyle(emailMode === "otp")} onClick={() => switchEmailMode("otp")}>验证码</button>
                  </div>

                  <div style={{ marginTop: 16, display: "flex", flexDirection: "column", gap: 12 }}>
                    {/* Email + Password */}
                    {emailMode === "email_pw" && (
                      <>
                        <label>
                          <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.email}</div>
                          <input className="input" type="email" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === "Enter" && handleEmailPwLogin()}/>
                        </label>
                        <label>
                          <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.password}</div>
                          <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleEmailPwLogin()}/>
                        </label>
                        <div style={{ display: "flex", justifyContent: "flex-end", fontSize: 12 }}>
                          <a href="#" style={{ color: "var(--ink)", borderBottom: "1px solid var(--line-strong)" }} onClick={e => { e.preventDefault(); setShowForgot(true); }}>忘了密码?</a>
                        </div>
                        <ErrBox msg={errMsg}/>
                        <button className="btn primary" style={{ justifyContent: "center", padding: "11px" }} onClick={handleEmailPwLogin} disabled={loading}>
                          {loading ? "请稍等…" : <><Icon name="arrowRight" size={12}/> {t.signIn}</>}
                        </button>
                      </>
                    )}

                    {/* Magic Link */}
                    {emailMode === "magic" && (
                      <>
                        <label>
                          <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.email}</div>
                          <input className="input" type="email" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === "Enter" && handleMagicRequest()} disabled={magicRequested}/>
                        </label>
                        <ErrBox msg={errMsg}/>
                        <OkBox msg={okMsg}/>
                        {!magicRequested ? (
                          <button className="btn primary" style={{ justifyContent: "center", padding: "11px" }} onClick={handleMagicRequest} disabled={loading}>
                            {loading ? "发送中…" : "发送 Magic Link"}
                          </button>
                        ) : (
                          <button className="btn ghost" style={{ justifyContent: "center" }} onClick={() => { setMagicRequested(false); clearMessages(); }}>重新发送</button>
                        )}
                        <p style={{ fontSize: 12, color: "var(--ink-4)", fontFamily: "var(--serif)", fontStyle: "italic", marginTop: 4 }}>
                          链接发到邮箱，点击后自动登录。Dev 模式下可在 docker logs 里看到链接。
                        </p>
                      </>
                    )}

                    {/* OTP */}
                    {emailMode === "otp" && (
                      <>
                        <label>
                          <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.email}</div>
                          <input className="input" type="email" value={email} onChange={e => setEmail(e.target.value)} disabled={otpRequested}/>
                        </label>
                        {otpRequested && (
                          <label>
                            <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>6 位验证码</div>
                            <input className="input" value={otpCode} onChange={e => setOtpCode(e.target.value)} maxLength={6} placeholder="123456" onKeyDown={e => e.key === "Enter" && handleOtpVerify()} autoFocus/>
                          </label>
                        )}
                        <ErrBox msg={errMsg}/>
                        <OkBox msg={okMsg}/>
                        {!otpRequested ? (
                          <button className="btn primary" style={{ justifyContent: "center", padding: "11px" }} onClick={handleOtpRequest} disabled={loading}>
                            {loading ? "发送中…" : "发送验证码"}
                          </button>
                        ) : (
                          <div style={{ display: "flex", gap: 8 }}>
                            <button className="btn primary" style={{ flex: 1, justifyContent: "center" }} onClick={handleOtpVerify} disabled={loading}>{loading ? "验证中…" : "验证登录"}</button>
                            <button className="btn ghost" onClick={() => { setOtpRequested(false); clearMessages(); }}>重发</button>
                          </div>
                        )}
                      </>
                    )}
                  </div>

                  {/* Google SSO */}
                  {googleEnabled && (
                    <>
                      <div style={{ display: "flex", alignItems: "center", gap: 12, margin: "18px 0 14px", color: "var(--ink-4)", fontSize: 11 }}>
                        <div className="hr" style={{ flex: 1 }}/><span>或者</span><div className="hr" style={{ flex: 1 }}/>
                      </div>
                      <button className="btn" style={{ width: "100%", justifyContent: "center" }} onClick={handleGoogleLogin}>
                        <svg width="14" height="14" viewBox="0 0 24 24" style={{ marginRight: 6 }}>
                          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        用 Google 登录
                      </button>
                    </>
                  )}
                </>
              )}

              {/* Phone channel */}
              {channel === "phone" && (
                <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 12 }}>
                  <label>
                    <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>手机号</div>
                    <input className="input" type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="+8613800138000" onKeyDown={e => e.key === "Enter" && handlePhoneLogin()}/>
                  </label>
                  <label>
                    <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.password}</div>
                    <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handlePhoneLogin()}/>
                  </label>
                  <ErrBox msg={errMsg}/>
                  <button className="btn primary" style={{ justifyContent: "center", padding: "11px" }} onClick={handlePhoneLogin} disabled={loading}>
                    {loading ? "登录中…" : <><Icon name="arrowRight" size={12}/> 登录</>}
                  </button>
                </div>
              )}

              <div style={{ marginTop: 24, fontSize: 12.5, color: "var(--ink-3)", textAlign: "center" }}>
                还没有账号?{" "}
                <a href="#" style={{ color: "var(--ink)", borderBottom: "1px solid var(--line-strong)", marginLeft: 4 }} onClick={e => { e.preventDefault(); setScreen("register"); setChannel("email"); clearMessages(); }}>
                  {t.signUp}
                </a>
              </div>
            </>
          )}

          {/* ── Register ───────────────────────────── */}
          {screen === "register" && (
            <>
              <div className="eyebrow" style={{ marginBottom: 10 }}>创建账号</div>
              <h2 style={{ fontFamily: "var(--serif)", fontSize: 30, color: "var(--ink)", fontWeight: 400, margin: 0, letterSpacing: "-0.015em" }}>加入 Prism</h2>
              <p style={{ fontSize: 14, color: "var(--ink-3)", marginTop: 10, lineHeight: 1.6, fontFamily: "var(--serif)", fontStyle: "italic" }}>注册需要邀请码。</p>

              {/* Register channel tabs: 邮箱 / 手机 */}
              <div style={{ display: "flex", marginTop: 18, borderBottom: "1px solid var(--line)" }}>
                <button style={topTabStyle(channel === "email")} onClick={() => { setChannel("email"); clearMessages(); }}>邮箱注册</button>
                {phoneEnabled && <button style={topTabStyle(channel === "phone")} onClick={() => { setChannel("phone"); clearMessages(); }}>手机注册</button>}
              </div>

              <div style={{ marginTop: 18, display: "flex", flexDirection: "column", gap: 12 }}>
                {channel === "email" && (
                  <>
                    <label>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.email}</div>
                      <input className="input" type="email" value={email} onChange={e => setEmail(e.target.value)}/>
                    </label>
                    <label>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>用户名</div>
                      <input className="input" value={username} onChange={e => setUsername(e.target.value)}/>
                    </label>
                    <label>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.password}</div>
                      <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)}/>
                    </label>
                    <label>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>邀请码</div>
                      <input className="input" placeholder="PRISM-XXXXXXXX" value={inviteCode} onChange={e => setInviteCode(e.target.value)}/>
                    </label>
                    <ErrBox msg={errMsg}/>
                    <button className="btn primary" style={{ justifyContent: "center", padding: "11px" }} onClick={handleEmailRegister} disabled={loading}>
                      {loading ? "注册中…" : <><Icon name="arrowRight" size={12}/> {t.signUp}</>}
                    </button>
                  </>
                )}
                {channel === "phone" && (
                  <>
                    <label>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>手机号</div>
                      <input className="input" type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="+8613800138000"/>
                    </label>
                    <label>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>{t.password}</div>
                      <input className="input" type="password" value={password} onChange={e => setPassword(e.target.value)}/>
                    </label>
                    <label>
                      <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>邀请码</div>
                      <input className="input" placeholder="PRISM-XXXXXXXX" value={inviteCode} onChange={e => setInviteCode(e.target.value)}/>
                    </label>
                    <ErrBox msg={errMsg}/>
                    <button className="btn primary" style={{ justifyContent: "center", padding: "11px" }} onClick={handlePhoneRegister} disabled={loading}>
                      {loading ? "注册中…" : <><Icon name="arrowRight" size={12}/> 注册</>}
                    </button>
                  </>
                )}
              </div>

              <div style={{ marginTop: 24, fontSize: 12.5, color: "var(--ink-3)", textAlign: "center" }}>
                已有账号?{" "}
                <a href="#" style={{ color: "var(--ink)", borderBottom: "1px solid var(--line-strong)", marginLeft: 4 }} onClick={e => { e.preventDefault(); setScreen("login"); setChannel("email"); clearMessages(); }}>
                  回去登录
                </a>
              </div>
            </>
          )}
        </div>
      </div>

      {showForgot && <ForgotPasswordModal onClose={() => setShowForgot(false)} onToast={onToast}/>}
    </div>
  );
}

/* Google OAuth pending: new user needs invite code */
function GooglePendingScreen({ tmpToken, onSignIn, onToast }) {
  const [inviteCode, setInviteCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [errMsg, setErrMsg] = useState("");

  async function handleComplete() {
    if (!inviteCode.trim()) { setErrMsg("请输入邀请码"); return; }
    setLoading(true);
    try {
      await window.PrismAPI.auth.googleComplete({ tmp_token: tmpToken, invite_code: inviteCode.trim() });
      await window.PrismAPI.me();
      onSignIn();
    } catch (err) {
      if (err.status === 400) setErrMsg(err.message || "邀请码无效");
      else setErrMsg(err.message || "完成注册失败");
    }
    setLoading(false);
  }

  return (
    <div className="login-wrap">
      <LoginLeft/>
      <div className="login-right">
        <div style={{ maxWidth: 380, width: "100%", margin: "0 auto" }}>
          <div className="eyebrow" style={{ marginBottom: 10 }}>Google 登录</div>
          <h2 style={{ fontFamily: "var(--serif)", fontSize: 30, color: "var(--ink)", fontWeight: 400, margin: 0 }}>填写邀请码</h2>
          <p style={{ fontSize: 14, color: "var(--ink-3)", marginTop: 10, fontFamily: "var(--serif)", fontStyle: "italic" }}>
            你的 Google 账号尚未注册 Prism。请填写邀请码以完成注册。
          </p>
          <div style={{ marginTop: 22, display: "flex", flexDirection: "column", gap: 12 }}>
            <label>
              <div style={{ fontSize: 11.5, color: "var(--ink-3)", marginBottom: 5 }}>邀请码</div>
              <input className="input" placeholder="PRISM-XXXXXXXX" value={inviteCode} onChange={e => setInviteCode(e.target.value)} onKeyDown={e => e.key === "Enter" && handleComplete()} autoFocus/>
            </label>
            <ErrBox msg={errMsg}/>
            <button className="btn primary" style={{ justifyContent: "center", padding: "11px" }} onClick={handleComplete} disabled={loading}>
              {loading ? "完成中…" : <><Icon name="arrowRight" size={12}/> 完成注册</>}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============ TOASTS & TWEAKS ============ */
function Toasts({ toasts, onClose }) {
  return (
    <div className="toast-stack">
      {toasts.map(t => (
        <div key={t.id} className={`toast ${t.kind || ""}`} onClick={() => onClose(t.id)}>
          <div style={{ flex: 1 }}>
            <div className="title">{t.title}</div>
            <div>{t.body}</div>
          </div>
          <Icon name="close" size={11} style={{ color: "var(--ink-4)", cursor: "pointer", marginTop: 3 }}/>
        </div>
      ))}
    </div>
  );
}

function Tweaks({ tweaks, setTweaks }) {
  const [collapsed, setCollapsed] = useState(false);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const h = e => { if (e.data?.type === "__activate_edit_mode") setVisible(true); if (e.data?.type === "__deactivate_edit_mode") setVisible(false); };
    window.addEventListener("message", h);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", h);
  }, []);
  const up = (k, v) => { setTweaks({ ...tweaks, [k]: v }); window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*"); };
  if (!visible) return null;
  return (
    <div className={`tweaks ${collapsed ? "collapsed" : ""}`}>
      <div className="head" onClick={() => setCollapsed(!collapsed)}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}><PrismMark size={14}/><span style={{ fontFamily: "var(--serif)", fontSize: 14, color: "var(--ink)", fontStyle: "italic" }}>Tweaks</span></div>
        <Icon name="chevron" size={11} style={{ transform: collapsed ? "rotate(90deg)" : "" }}/>
      </div>
      <div className="body">
        <div><div className="label">主题</div><div className="seg">{["light", "dark"].map(v => <button key={v} className={tweaks.theme === v ? "on" : ""} onClick={() => up("theme", v)}>{v}</button>)}</div></div>
        <div><div className="label">密度</div><div className="seg">{["compact", "comfortable", "spacious"].map(v => <button key={v} className={tweaks.density === v ? "on" : ""} onClick={() => up("density", v)}>{v}</button>)}</div></div>
        <div><div className="label">对话气泡圆角</div><div className="seg">{["soft", "softer", "pill"].map(v => <button key={v} className={tweaks.bubble === v ? "on" : ""} onClick={() => up("bubble", v)}>{v}</button>)}</div></div>
        <div><div className="label">语气</div><div className="seg">{["同事", "管家", "冷静"].map(v => <button key={v} className={tweaks.tone === v ? "on" : ""} onClick={() => up("tone", v)}>{v}</button>)}</div></div>
        <div><div className="label">布局</div><div className="seg">{["focus", "split"].map(v => <button key={v} className={tweaks.layout === v ? "on" : ""} onClick={() => up("layout", v)}>{v}</button>)}</div></div>
      </div>
    </div>
  );
}

/* ============ APP ============ */
function App() {
  const [tweaks, setTweaks] = useState({ theme: "light", density: "comfortable", bubble: "soft", tone: "同事", layout: "split" });
  const [lang, setLang] = useState("zh");
  // screen: "loading" | "login" | "app" | "google_pending"
  const [screen, setScreen] = useState("loading");
  const [googlePendingToken, setGooglePendingToken] = useState("");
  const [page, setPage] = useState("chat");
  const [showPlan, setShowPlan] = useState(true);
  const [perm, setPerm] = useState(false);
  const [permRequest, setPermRequest] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [currentSessionId, setCurrentSessionId] = useState(null);
  const [planState, setPlanState] = useState(null);

  // Auto-restore login from sessionStorage token
  useEffect(() => {
    async function bootstrap() {
      // 1. Handle magic link callback: ?challenge_id=...&token=...
      //    Backend email sends: {FRONT_URL}/auth/magic?challenge_id=...&token=...
      //    We also handle the page being loaded at Prism.html with those params.
      const params = new URLSearchParams(window.location.search);
      const challengeId = params.get("challenge_id");
      const magicToken = params.get("token");
      if (challengeId && magicToken) {
        try {
          const data = await window.PrismAPI.auth.emailMagicVerify({ challenge_id: challengeId, token: magicToken });
          if (data && data.access_token) {
            // Clean URL
            window.history.replaceState({}, "", window.location.pathname);
            await window.PrismAPI.me();
            setScreen("app");
            return;
          }
        } catch (err) {
          console.warn("[App] magic link verify failed:", err.message);
          // Fall through to normal login
          window.history.replaceState({}, "", window.location.pathname);
        }
      }

      // 2. Handle Google OAuth callback: #access_token=...&expires_in=...
      const hash = window.location.hash;
      if (hash && hash.includes("access_token=")) {
        const hashParams = new URLSearchParams(hash.slice(1));
        const accessToken = hashParams.get("access_token");
        if (accessToken) {
          window.history.replaceState({}, "", window.location.pathname);
          window.PrismAPI._storeTokenPublic && window.PrismAPI._storeTokenPublic(accessToken);
          // Use sessionStorage directly since storeToken is private
          sessionStorage.setItem("prism_access_token", accessToken);
          try {
            await window.PrismAPI.me();
            setScreen("app");
            return;
          } catch { /* fall through */ }
        }
      }

      // 3. Handle Google OAuth pending (new user needs invite code): ?auth_pending=<tmp_token>
      const authPending = params.get("auth_pending");
      if (authPending) {
        window.history.replaceState({}, "", window.location.pathname);
        setScreen("google_pending");
        setGooglePendingToken(authPending);
        return;
      }

      // 4. Handle auth error from OAuth: ?auth_error=...
      const authError = params.get("auth_error");
      if (authError) {
        window.history.replaceState({}, "", window.location.pathname);
        setScreen("login");
        return;
      }

      // 5. Normal: restore from sessionStorage
      if (window.PrismAPI && window.PrismAPI.isAuthenticated()) {
        try {
          await window.PrismAPI.me();
          setScreen("app");
        } catch {
          setScreen("login");
        }
      } else {
        setScreen("login");
      }
    }
    bootstrap();

    // Redirect to login on unauthorized events from apiClient
    const handler = () => setScreen("login");
    window.addEventListener("prism:unauthorized", handler);
    return () => window.removeEventListener("prism:unauthorized", handler);
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme);
    document.documentElement.setAttribute("data-density", tweaks.density);
  }, [tweaks]);

  useEffect(() => {
    const map = { soft: "18px 18px 6px 18px", softer: "22px 22px 22px 22px", pill: "22px 22px 6px 22px" };
    document.documentElement.style.setProperty("--bubble-radius", map[tweaks.bubble]);
  }, [tweaks.bubble]);

  const t = I18N[lang] || I18N.zh;

  function addToast(toast) {
    setToasts(prev => [...prev, toast]);
    // Auto-dismiss after 6s
    setTimeout(() => setToasts(prev => prev.filter(x => x.id !== toast.id)), 6000);
  }

  if (screen === "loading") {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", background: "var(--bg)", gap: 12, color: "var(--ink-3)", fontFamily: "var(--serif)", fontStyle: "italic", fontSize: 16 }}>
        <PrismMark size={24}/>正在恢复…
      </div>
    );
  }

  if (screen === "login") {
    return (<><LoginScreen t={t} onSignIn={() => setScreen("app")} onToast={addToast}/><Tweaks tweaks={tweaks} setTweaks={setTweaks}/></>);
  }

  if (screen === "google_pending") {
    return (<><GooglePendingScreen tmpToken={googlePendingToken} onSignIn={() => setScreen("app")} onToast={addToast}/><Tweaks tweaks={tweaks} setTweaks={setTweaks}/></>);
  }

  const sidebarMode = tweaks.layout === "split" && page === "chat" && showPlan && planState ? "split" : "normal";

  // Get current session title for Topbar
  const sessionTitle = currentSessionId ? null : null; // resolved inside ChatPage via sessionMeta

  return (
    <>
      <div className="app" data-sidebar={sidebarMode}>
        <Sidebar
          page={page}
          setPage={setPage}
          t={t}
          currentSessionId={currentSessionId}
          setCurrentSessionId={(id) => { setCurrentSessionId(id); setPlanState(null); }}
          addToast={addToast}
        />
        <main className="main">
          <Topbar
            page={page}
            t={t}
            showPlan={showPlan}
            setShowPlan={setShowPlan}
            lang={lang}
            setLang={setLang}
            onPerm={() => setPerm(true)}
            sessionTitle={null}
          />
          {page === "chat" && (
            <ChatPage
              key={currentSessionId || "empty"}
              t={t}
              sessionId={currentSessionId}
              addToast={addToast}
              setPermRequest={setPermRequest}
              setPerm={setPerm}
              setPlanState={setPlanState}
            />
          )}
          {page === "sessions" && <SessionsPage setPage={setPage} setCurrentSession={setCurrentSessionId}/>}
          {page === "usage" && <UsagePage/>}
          {page === "skills" && <SkillsPage/>}
          {page === "plugins" && <PluginsPage/>}
          {page === "observability" && <ObsPage/>}
          {page === "settings" && <SettingsPage onToast={addToast}/>}
          {page !== "chat" && (
            <div className="statusbar">
              <div className="kv"><span>provider</span> <b>anthropic</b></div>
              <div className="kv"><span>模型</span> <b>sonnet-4-5</b></div>
              <div className="kv"><span>缓存</span> <b style={{ color: "var(--teal)" }}>72%</b></div>
              <div style={{ flex: 1 }}/>
              <div className="kv"><span>harness</span> <b style={{ color: "var(--teal)" }}>● active</b></div>
            </div>
          )}
        </main>
        {sidebarMode === "split" && <PlanPanel t={t} planState={planState}/>}
      </div>

      {/* Demo switcher */}
      <div style={{ position: "fixed", top: 14, right: 20, zIndex: 70, display: "flex", gap: 4, background: "var(--paper)", border: "1px solid var(--line)", borderRadius: 999, padding: 4, boxShadow: "var(--shadow-2)" }}>
        <button className="icon-btn" onClick={() => setScreen("login")} title="登录页"><Icon name="arrowRight" size={11} style={{ transform: "rotate(180deg)" }}/></button>
        <button className="icon-btn" onClick={() => { setCurrentSessionId(null); setPage("chat"); }} title="空状态"><Icon name="sparkle" size={11}/></button>
        <button className="icon-btn" onClick={() => setScreen("app")} title="应用"><Icon name="chat" size={11}/></button>
      </div>

      {perm && (
        <PermissionModal
          t={t}
          onClose={() => { setPerm(false); setPermRequest(null); }}
          permRequest={permRequest}
          sessionId={currentSessionId}
          addToast={addToast}
        />
      )}
      <Toasts toasts={toasts} onClose={id => setToasts(toasts.filter(x => x.id !== id))}/>
      <Tweaks tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
