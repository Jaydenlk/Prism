# Grafana dashboard provisioning — auto-load 4 Prism dashboards (ADR-116)
apiVersion: 1

providers:
  - name: Prism Dashboards
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
