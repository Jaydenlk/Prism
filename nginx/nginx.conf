# Prism v2 — nginx reverse proxy configuration
# ADR-115 (DOC-12 Task 12.3): SSE passthrough + security headers
#
# Key settings:
#   /healthz                     — nginx-native health endpoint (no backend round-trip)
#   /api/v1/sessions/*/stream    — SSE long-connection passthrough
#       X-Accel-Buffering: no    — disable nginx buffering for SSE
#       proxy_read_timeout 3600s — allow 1-hour SSE connections
#       chunked_transfer_encoding off — prevent chunked encoding issues with SSE
#   /                            — all other traffic proxied to backend:8000

server {
    listen 80;
    server_name _;

    # Maximum client body size (file uploads, plugin payloads)
    client_max_body_size 10M;

    # ---------------------------------------------------------------------------
    # nginx-native health endpoint (no backend round-trip)
    # Used by: docker-compose nginx healthcheck + load balancer probes
    # ---------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------------
    # SSE stream passthrough (ADR-115 v4 requirement)
    # Pattern matches: /api/v1/sessions/<uuid>/stream
    # ---------------------------------------------------------------------------
    location ~ ^/api/v1/sessions/[^/]+/stream {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        # Disable connection keep-alive upgrade (SSE uses persistent HTTP/1.1)
        proxy_set_header   Connection "";

        # Disable all buffering — essential for real-time SSE delivery
        proxy_buffering    off;
        proxy_cache        off;

        # Tell upstream to disable its own buffering (e.g. gunicorn)
        proxy_set_header   X-Accel-Buffering no;

        # Allow SSE connections to stay open for up to 1 hour
        proxy_read_timeout 3600s;

        # Prevent chunked encoding from interfering with SSE framing
        chunked_transfer_encoding off;

        # Forward real client IP
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------
    # All other API + frontend traffic
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Standard read timeout for non-SSE endpoints
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # ---------------------------------------------------------------------------
    # Security headers (applied globally via add_header in each block above,
    # or set them here for the default location block)
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"           always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
