# Alembic configuration file for Prism v2 Backend
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to alembic.ini location
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone to use when rendering timestamps in migration files
# Leave empty to use UTC
timezone = UTC

# Maximum length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command even if
# no --sql flag is passed
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory
# sourceless = false

# Version path separator; As mentioned above, this is the character used to
# split version_locations. The default within new alembic.ini files is "os",
# which uses os.pathsep. Note that this setting is only used when
# "version_locations" is set - when it is not set, the single-directory
# rules apply.
# version_path_separator = os  # Use os.pathsep. Default configuration used for new projects.
# version_path_separator = ;   # Non-Windows
# version_path_separator = :   # Non-Windows
# version_path_separator = space  # use a space as the path separator

# The output encoding used when revision files are written from
# template; defaults to utf-8.
# output_encoding = utf-8

sqlalchemy.url = postgresql://prism:prism_dev_pass@postgres:5432/prism_dev


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner
# uses the binary "black" as the format executable (note: [post_write_hooks] section is optional)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
